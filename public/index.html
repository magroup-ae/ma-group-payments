<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA Group</title>
<style>
  :root { --navy:#1F3864; --blue:#2E75B6; --gold:#BF9000; --green:#375623; --red:#C00000; --grey:#f4f5f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Calibri,Arial,sans-serif; background:var(--grey); color:#222; font-size:14px; }
  /* ---------- app shell: fixed left sidebar + top bar ---------- */
  :root { --sbw:238px; --sbwc:64px; }
  body.sb-collapsed { --sbw:var(--sbwc); }
  aside.sb { position:fixed; left:0; top:0; bottom:0; width:var(--sbw); background:var(--navy); color:#fff; display:flex; flex-direction:column;
    z-index:40; transition:width .18s ease, transform .2s ease; overflow:hidden; }
  aside.sb .sb-top { display:flex; align-items:center; gap:10px; padding:12px 12px 10px; border-bottom:1px solid rgba(255,255,255,.13); min-height:58px; }
  aside.sb .sb-top img { height:34px; background:#fff; border-radius:6px; padding:3px 5px; flex:0 0 auto; }
  aside.sb .sb-top .nm { font-weight:800; font-size:13.5px; letter-spacing:.3px; line-height:1.2; white-space:nowrap; }
  aside.sb .sb-top .nm span { display:block; font-weight:500; font-size:10.5px; color:#c9d4e6; letter-spacing:.6px; }
  aside.sb .sb-scroll { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:8px 0 12px; }
  aside.sb .sb-scroll::-webkit-scrollbar { width:6px } aside.sb .sb-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22); border-radius:3px }
  aside.sb .grp { color:#8fa4c4; font-size:9px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; padding:9px 16px 3px; white-space:nowrap; }
  aside.sb button.nv { width:100%; border:0; background:none; color:#dfe6f2; display:flex; align-items:center; gap:11px; padding:7px 16px; cursor:pointer;
    font-size:13px; font-weight:600; text-align:left; border-left:3px solid transparent; white-space:nowrap; }
  aside.sb button.nv:hover { background:rgba(255,255,255,.08); color:#fff; }
  aside.sb button.nv.on { background:rgba(191,144,0,.20); color:#fff; border-left-color:var(--gold); }
  aside.sb button.nv .ic { flex:0 0 18px; display:flex; align-items:center; justify-content:center; opacity:.92; }
  aside.sb button.nv .lb { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
  aside.sb .sb-foot { border-top:1px solid rgba(255,255,255,.13); padding:9px 12px; font-size:11px; color:#c9d4e6; white-space:nowrap; }
  aside.sb .sb-foot b { color:#fff; display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; }
  aside.sb .sb-foot a { color:#ffd77a; text-decoration:none; }
  body.sb-collapsed aside.sb .lb, body.sb-collapsed aside.sb .grp, body.sb-collapsed aside.sb .nm, body.sb-collapsed aside.sb .sb-foot .txt { display:none; }
  body.sb-collapsed aside.sb button.nv { justify-content:center; padding:11px 0; }
  body.sb-collapsed aside.sb .sb-top { justify-content:center; padding:12px 0 10px; }
  header.app { background:#fff; color:var(--navy); display:flex; align-items:center; gap:12px; padding:0 18px; height:52px;
    position:sticky; top:0; z-index:20; border-bottom:1px solid #e3e7ee; margin-left:var(--sbw); transition:margin-left .18s ease; }
  header.app .t { font-weight:800; font-size:15px; letter-spacing:.2px; color:var(--navy); }
  header.app .sp { flex:1; }
  header.app .u { font-size:11.5px; color:#5b6472; text-align:right; }
  header.app .u b { color:var(--navy) }
  header.app a { color:var(--blue); text-decoration:none }
  .sbtoggle { border:0; background:#f2f4f8; color:var(--navy); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1; }
  .sbtoggle:hover { background:#e6ebf3 }
  .sb-mask { display:none; position:fixed; inset:0; background:rgba(15,25,45,.45); z-index:35; }
  main { max-width:1180px; margin:0 auto; padding:16px; }
  .shell { margin-left:var(--sbw); transition:margin-left .18s ease; }
  @media (max-width:860px){
    aside.sb { transform:translateX(-100%); width:238px; box-shadow:0 0 40px rgba(0,0,0,.3); }
    body.sb-open aside.sb { transform:none; }
    body.sb-open .sb-mask { display:block; }
    header.app, .shell { margin-left:0; }
    body.sb-collapsed { --sbw:0px; }
  }
  @media print { aside.sb, header.app, .sb-mask { display:none !important; } .shell { margin-left:0 } }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:16px 18px; margin-bottom:14px; }
  h2 { margin:2px 0 12px; font-size:16px; color:var(--navy); }
  h3 { margin:14px 0 8px; font-size:13px; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { background:var(--navy); color:#fff; padding:7px 8px; text-align:left; font-size:12px; white-space:nowrap; }
  td { border-bottom:1px solid #eee; padding:7px 8px; }
  tr.click { cursor:pointer; } tr.click:hover { background:#f0f4fa; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px 14px; }
  label { display:block; font-size:11px; font-weight:700; color:#666; margin-bottom:3px; text-transform:uppercase; letter-spacing:.3px; }
  input,select,textarea { width:100%; padding:8px 9px; border:1px solid #ccc; border-radius:6px; font-size:14px; font-family:inherit; background:#fff; }
  input:focus,select:focus { outline:2px solid var(--blue); border-color:transparent; }
  input[readonly] { background:#f3f4f6; color:#555; }
  .btn { border:0; border-radius:7px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; color:#fff; background:var(--navy); }
  .btn.gold { background:var(--gold); } .btn.green { background:var(--green); } .btn.red { background:var(--red); }
  .btn.ghost { background:#fff; color:var(--navy); border:1.5px solid var(--navy); }

  .pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; }
  .st-Draft{background:#8a8a8a}.st-Certified{background:var(--blue)}.st-Checked{background:var(--gold)}
  .st-Approved{background:var(--green)}.st-Paid{background:var(--navy)}.st-Cancelled{background:var(--red)}
  .st-Submitted{background:var(--blue)}.st-Rejected{background:var(--red)}.st-Issued{background:var(--blue)}

  .kpi { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); border-top:4px solid var(--gold); }
  .kpi .v { font-size:20px; font-weight:800; color:var(--navy); }
  .kpi .l { font-size:11px; color:#777; text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }
  .flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .right { margin-left:auto; }
  .muted { color:#888; font-size:12px; }
  .note { background:#fff8e6; border:1px solid var(--gold); border-radius:8px; padding:10px 12px; font-size:12.5px; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--navy),#2a4a80); }
  .login { background:#fff; border-radius:14px; padding:34px 36px; width:340px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .login img { height:70px; margin-bottom:6px; }
  .login h1 { font-size:18px; color:var(--navy); margin:4px 0 18px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transition:.3s; z-index:99; }
  .toast.show { opacity:1; }
  .audit { font-size:12px; color:#555; } .audit li { margin-bottom:3px; }
  /* ------- dashboard charts ------- */
  .kpigrp { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:#8a94a6; margin:16px 2px 7px; }
  .kpi.alert { border-top-color:var(--red); } .kpi.good { border-top-color:var(--green); }
  .chartgrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media(max-width:820px){ .chartgrid{ grid-template-columns:1fr; } }
  .chartcard { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .dash-h { font-size:13px; font-weight:800; color:var(--navy); margin:0 0 12px; letter-spacing:.2px; }
  .hbars { display:flex; flex-direction:column; gap:9px; }
  .hbar-row { display:grid; grid-template-columns:135px 1fr auto; gap:10px; align-items:center; font-size:12px; }
  .hbar-lab { color:#33415a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .hbar-track { position:relative; background:#eef2f8; border-radius:6px; height:16px; }
  .hbar-2 .hbar-track { height:22px; }
  .hbar-fill { position:absolute; left:0; height:16px; border-radius:6px; min-width:2px; }
  .hbar-fill.b1 { top:0; height:9px; border-radius:5px; }
  .hbar-fill.b2 { top:11px; height:9px; border-radius:5px; }
  .hbar-val { font-weight:700; color:#1f2733; white-space:nowrap; text-align:right; font-size:11px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:12px; font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; color:#33415a; }
  .legend i { width:11px; height:11px; border-radius:3px; display:inline-block; flex:none; }
  /* ------- printable areas ------- */
  #printArea, #chequeArea, #labelArea { display:none; }
  @media print {
    #toast { display:none !important; }
    /* certificate: hide everything else so no blank trailing pages */
    body.printing-cert #root, body.printing-cert #chequeArea, body.printing-cert #labelArea { display:none !important; }
    body.printing-cert #printArea { display:block; }
    body.printing-cert #printArea .cert { page-break-inside:avoid; }
    body.printing-cert #printArea .pagebreak { page-break-before:always; height:0; }
    /* cheque: only the leaf prints, on exactly one page */
    body.printing-cheque #root, body.printing-cheque #printArea, body.printing-cheque #labelArea { display:none !important; }
    body.printing-cheque #chequeArea { display:block; }
    body.printing-cheque #chequeArea .leaf { overflow:hidden; page-break-after:avoid; page-break-inside:avoid; }
    body.printing-cheque .fld { page-break-inside:avoid; }
    /* asset labels: each label on its own thermal page */
    body.printing-labels #root, body.printing-labels #printArea, body.printing-labels #chequeArea { display:none !important; }
    body.printing-labels { margin:0; }
    body.printing-labels #labelArea { display:block; }
    body.printing-labels .lbl, body.printing-labels .lblrot { margin:0; page-break-inside:avoid; break-inside:avoid; }
    body.printing-labels .lbl:not(:last-child), body.printing-labels .lblrot:not(:last-child) { page-break-after:always; break-after:page; }
  }
  /* ---- MUNBYN thermal asset label (monochrome) ---- */
  #labelArea { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .lbl { box-sizing:border-box; border:0.5mm solid #000; overflow:hidden; background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif; }
  .lbl .lh { background:#000; display:flex; align-items:center; }
  .lbl .lh .lg { background:#fff; display:flex; align-items:center; justify-content:center; }
  .lbl .lh .lg img { width:90%; height:90%; object-fit:contain; }
  .lbl .lh .lt b { display:block; color:#fff; font-weight:800; letter-spacing:.2mm; line-height:1.1; }
  .lbl .lh .lt small { display:block; color:#fff; line-height:1.25; }
  .lbl .lb { text-align:center; }
  .lbl .lb .code { font-family:'Courier New',monospace; font-weight:800; color:#000; }
  .lbl .lb .item { font-weight:700; color:#000; }
  .lbl .lb .plate { font-weight:700; color:#000; }
  .lbl .lb .sub { color:#000; }
  /* 3x2 in (76.2x50.8mm) landscape — MA Group default */
  .lbl.t3x2 { width:76.2mm; height:50.8mm; }
  .lbl.t3x2 .lh { height:13mm; gap:2mm; padding:0 2mm; }
  .lbl.t3x2 .lh .lg { width:12.5mm; height:10.5mm; }
  .lbl.t3x2 .lh .lt b { font-size:5mm; } .lbl.t3x2 .lh .lt small { font-size:2.3mm; }
  .lbl.t3x2 .lb { padding-top:1.6mm; } .lbl.t3x2 .lb svg.bc { height:13mm; max-width:66mm; }
  .lbl.t3x2 .lb .code { font-size:5mm; margin-top:.5mm; } .lbl.t3x2 .lb .item { font-size:2.9mm; margin-top:.8mm; }
  .lbl.t3x2 .lb .plate { font-size:3.4mm; margin-top:.4mm; } .lbl.t3x2 .lb .sub { font-size:2.1mm; margin-top:1mm; line-height:1.3; }
  /* 2x3 in (50.8x76.2mm) portrait */
  .lbl.t2x3 { width:50.8mm; height:76.2mm; }
  .lbl.t2x3 .lh { height:15mm; gap:1.5mm; padding:0 2mm; }

  .lbl.t2x3 .lb { padding-top:5mm; } .lbl.t2x3 .lb svg.bc { height:20mm; max-width:44mm; }
  .lbl.t2x3 .lb .code { font-size:5.2mm; margin-top:3mm; } .lbl.t2x3 .lb .item { font-size:3mm; margin-top:4mm; }
  .lbl.t2x3 .lb .plate { font-size:3.6mm; margin-top:2mm; } .lbl.t2x3 .lb .sub { font-size:2.3mm; margin-top:4mm; line-height:1.4; }
  /* 4x6 in (100x150mm) portrait */
  .lbl.t4x6 { width:100mm; height:150mm; }
  .lbl.t4x6 .lh { height:30mm; gap:3mm; padding:0 3mm; }
  .lbl.t4x6 .lh .lg { width:26mm; height:24mm; }
  .lbl.t4x6 .lh .lt b { font-size:9mm; } .lbl.t4x6 .lh .lt small { font-size:4mm; }
  .lbl.t4x6 .lb { padding-top:8mm; } .lbl.t4x6 .lb svg.bc { height:32mm; max-width:88mm; }
  .lbl.t4x6 .lb .code { font-size:9mm; margin-top:3mm; } .lbl.t4x6 .lb .item { font-size:5mm; margin-top:6mm; }
  .lbl.t4x6 .lb .plate { font-size:6.5mm; margin-top:3mm; } .lbl.t4x6 .lb .sub { font-size:3.4mm; margin-top:4mm; line-height:1.6; }
  /* 100x50 mm landscape */

  .lbl.t100x50 .lb .plate { font-size:3.6mm; } .lbl.t100x50 .lb .sub { display:none; }
  /* 60x40 mm landscape */
  .lbl.t60x40 { width:60mm; height:40mm; }

  .lbl.t60x40 .lh .lg { width:9mm; height:8mm; }

  .lbl.t60x40 .lb { padding-top:1.5mm; } .lbl.t60x40 .lb svg.bc { height:11mm; max-width:52mm; }
  .lbl.t60x40 .lb .code { font-size:4mm; } .lbl.t60x40 .lb .item { font-size:2.4mm; }
  .lbl.t60x40 .lb .plate { font-size:2.8mm; } .lbl.t60x40 .lb .sub { display:none; }

  .lblrot { display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fff; }
  .lblrot > .lbl { transform:rotate(90deg); }
  .cert { font-family:'Calibri','Segoe UI',Arial,sans-serif; color:#1a1a1a; font-size:11px; max-width:190mm; margin:0 auto; }

  .cert .title { background:linear-gradient(90deg,var(--navy),#2a4a80); color:#fff; text-align:center; font-weight:800; font-size:13px; letter-spacing:1.2px; padding:7px; margin:10px 0 3px; text-transform:uppercase; }

</head>
<body>
<div id="root"></div>
<div id="printArea"></div>
<div id="labelArea"></div>
<style id="labelPage"></style>
<div class="toast" id="toast"></div>
<script src="jspdf.umd.min.js"></script>
<script src="jsbarcode.min.js"></script>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);

async function api(path, opts={}){
  const r = await fetch("/api/"+path, { ...opts,
    headers:{ "content-type":"application/json", ...(TOKEN?{authorization:"Bearer "+TOKEN}:{}), ...(opts.headers||{}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(()=>({}));
  if (r.status===401 && path!=="login"){ TOKEN=""; sessionStorage.removeItem("tok"); renderLogin(); throw new Error("Session expired"); }
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

}

// Render a full HTML document to a multi-page A4 PDF in the browser and return its
// base64 (no data-URI prefix). Used to attach the LOA/Contract PDF to the email.
// Render an HTML document to a base64 PDF in the browser.
// Long documents (a completion report with many site photos) are the hard case:
// a single tall canvas can exceed the browser's canvas-area limit and come back
// blank, and an over-large PDF is rejected by the upload limit. So the render
// scale is capped by canvas area and, if the PDF exceeds `budget` bytes, it is
// rebuilt at progressively lower quality until it fits.
const PDF_MAX_CANVAS_PX=1.4e7; // safe canvas area across Safari / Chrome
async function htmlToPdfBase64(html,opts={}){
  await loadScript("jspdf.umd.min.js"); await loadScript("html2canvas.min.js");
  const budget=opts.budget||3.6e6; // bytes of base64
  const RW=820; // render width (~A4 @ 96dpi with margin)
  const ifr=document.createElement("iframe");
  ifr.style.cssText="position:fixed;left:-10000px;top:0;width:"+(RW+60)+"px;height:1200px;border:0;background:#fff";
  document.body.appendChild(ifr);
  const idoc=ifr.contentDocument||ifr.contentWindow.document;
  idoc.open(); idoc.write(html); idoc.close();
  await new Promise(r=>setTimeout(r,350));
  try{ await Promise.all([...idoc.images].map(im=>im.complete?1:new Promise(res=>{im.onload=im.onerror=res; setTimeout(res,2500);}))); }catch(e){}
  // Corporate documents paginate themselves into A4 pages with a repeated
  // letterhead and "Page N of M" — render each of those pages to its own PDF
  // page so the PDF is identical to the printed document.
  for(let i=0;i<40 && !(ifr.contentWindow&&ifr.contentWindow.MAPG_DONE) && !idoc.querySelector(".mapg");i++) await new Promise(r=>setTimeout(r,80));
  // App-generated documents (certificates, VOs, comparison sheets) paginate with
  // the same engine used for printing, so the PDF matches the printed pages.
  try{ if(!idoc.querySelector(".mapg")&&!idoc.querySelector(".pg")&&idoc.getElementById("printArea")&&typeof paginatePrint==="function") paginatePrint(idoc,ifr.contentWindow); }catch(e){}
  const mapg=[...idoc.querySelectorAll(".mapg,.pg")];
  if(mapg.length){
    const { jsPDF }=window.jspdf; const probe=new jsPDF({unit:"pt",format:"a4"});
    const pw=probe.internal.pageSize.getWidth(), ph=probe.internal.pageSize.getHeight();
    const a=Math.max(1,mapg[0].scrollWidth*mapg[0].scrollHeight);
    const sc=Math.max(0.8,Math.min(2,Math.sqrt(PDF_MAX_CANVAS_PX/a)));
    const shots=[];
    for(const pg of mapg) shots.push(await html2canvas(pg,{scale:sc,useCORS:true,backgroundColor:"#ffffff",windowWidth:pg.scrollWidth,scrollX:0,scrollY:0}));
    try{ document.body.removeChild(ifr); }catch(e){}
    const emit=(q)=>{ const d=new jsPDF({unit:"pt",format:"a4",compress:true});
      shots.forEach((cv,i)=>{ if(i) d.addPage(); d.addImage(cv.toDataURL("image/jpeg",q),"JPEG",0,0,pw,ph); });
      return d.output("datauristring").split(",")[1]; };
    let o=""; for(const q of [0.9,0.8,0.7,0.6,0.5]){ o=emit(q); if(o.length<=budget) return o; }
    return o;
  }
  const target=idoc.querySelector(".cert")||idoc.querySelector(".page")||idoc.body;
  const hCss=Math.max(target.scrollHeight||0,600);
  // Cap the scale so width×height stays inside the canvas-area limit.
  let scale=Math.min(2,Math.sqrt(PDF_MAX_CANVAS_PX/(RW*hCss)));
  if(!(scale>0.5)) scale=0.5;
  const canvas=await html2canvas(target,{scale,useCORS:true,backgroundColor:"#ffffff",windowWidth:RW,scrollX:0,scrollY:0});
  try{ document.body.removeChild(ifr); }catch(e){}
  if(!canvas.width||!canvas.height) throw new Error("The page could not be rendered (too long for the browser)");
  const build=(q,shrink)=>{
    const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const M=24, cw=pw-M*2; const ratio=cw/canvas.width; const pageCanvasPx=(ph-M*2)/ratio;
    let pos=0, first=true;
    while(pos<canvas.height){
      const sh=Math.min(pageCanvasPx, canvas.height-pos);
      const sw=Math.round(canvas.width*shrink), shp=Math.max(1,Math.round(sh*shrink));
      const slice=document.createElement("canvas"); slice.width=sw; slice.height=shp;
      const ctx=slice.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,sw,shp);
      ctx.drawImage(canvas,0,pos,canvas.width,sh,0,0,sw,shp);
      if(!first) pdf.addPage(); first=false;
      pdf.addImage(slice.toDataURL("image/jpeg",q),"JPEG",M,M,cw,sh*ratio);
      pos+=sh;
    }
    return pdf.output("datauristring").split(",")[1];
  };
  const steps=[[0.9,1],[0.78,1],[0.7,0.8],[0.6,0.65],[0.5,0.5]];
  let out="";
  for(const [q,sk] of steps){ out=build(q,sk); if(out.length<=budget) return out; }
  return out; // best effort — the caller reports the size
}

// Save a base64 PDF to the user's device as a real file download.
function downloadPdfB64(name,b64){
  try{
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} },30000);
    return true;
  }catch(e){ toast("Download failed: "+e.message); return false; }
}
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function grp(n){ let s=""; if(n>=100){ s=ONES[Math.floor(n/100)]+" Hundred "; n%=100; } if(n>=20){ s+=TENS[Math.floor(n/10)]; if(n%10) s+=" "+ONES[n%10]; } else if(n>0) s+=ONES[n]; return s.trim(); }
function words(amount){ const neg=num(amount)<0; amount=Math.abs(num(amount)); const d=Math.floor(amount), f=Math.round((amount-d)*100), m=Math.floor(d/1e6), t=Math.floor(d%1e6/1e3), u=d%1e3;
  let w=[m?grp(m)+" Million":"",t?grp(t)+" Thousand":"",u?grp(u):""].filter(Boolean).join(" ")||"Zero";
  return "UAE Dirhams "+(neg?"Minus ":"")+w+(f?" and "+grp(f)+" Fils":"")+" Only"; }

// compress images before upload (PDFs pass through unchanged). png=true keeps transparency (signature/stamp).
function fileToDataUrl(file, cb, opts={}){
  if(!file){ toast("Choose a file"); return; }
  if(file.type==="application/pdf" || !file.type.startsWith("image/")){
    const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); return;
  }
  const maxPx=opts.png?700:1700, q=opts.q||0.72;
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; const sc=Math.min(1,maxPx/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const ctx=cv.getContext("2d");
      if(!opts.png){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img,0,0,w,h);
      try{ cb(opts.png?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",q)); }catch(e){ cb(fr.result); } };
    img.onerror=()=>cb(fr.result); img.src=fr.result; };
  fr.readAsDataURL(file);
}

// creates the client + contract when none exists (so client IPCs are always possible);
// if a contract already exists, only the contract/quotation reference is refreshed —
// commercial terms already configured on the contract are never overwritten.
async function syncProjContract(p){
  if(!p||p.fixed) return; const cname=String(p.client||"").trim(); if(!cname) return;
  let cts=[]; try{ cts=await api("contracts"); }catch(e){ return; }
  const ex=cts.find(c=>String(c.project||"").toLowerCase()===String(p.name||"").toLowerCase());

    try{ await api("contract",{method:"POST",body:{ id:ex.id, clientId:ex.clientId, project:ex.project, subcontractRef:p.contractRef||ex.subcontractRef||"", offerRef:p.contractRef||ex.offerRef||"" }}); }catch(e){}
  } else {
    try{
      await api("project/seed",{method:"POST",body:{ client:{ name:cname }, contract:{ project:p.name,
        contractSum:+p.contractValue||0, advanceAmount:+p.downPayment||0,
        retentionPct:p.retentionPct!=null?+p.retentionPct:0.1, recoveryRate:0,
        subcontractRef:p.contractRef||"", offerRef:p.contractRef||"", vatPct:0.05 } }});

  }
}

async function projectDash(p,ctx){
  const box=$("#pd_body"); if(!box) return;
  if(!p){ box.innerHTML=`<div class="muted">Pick a project to see its own KPIs and charts.</div>`; return; }
  box.innerHTML=`<div class="muted">Loading ${esc(p)}…</div>`;
  let pnl=null; try{ pnl=await api("pnl?project="+encodeURIComponent(p)); }catch(e){ box.innerHTML=`<div class="muted">${esc(e.message)}</div>`; return; }
  const contracts=(ctx.contracts||[]).filter(c=>c.project===p);
  const cids=new Set(contracts.map(c=>c.id));
  const sp=(S.projects||[]).find(x=>x&&x.name===p)||{};
  const sDown={ down:+sp.downPayment||0, retPct:(sp.retentionPct!=null?+sp.retentionPct:0.10), cv:+sp.contractValue||0 };
  const cval=contracts.reduce((a,c)=>a+(+c.contractSum||0)+(+c.variations||0),0);
  const live=(ctx.ccerts||[]).filter(c=>cids.has(c.contractId)&&["Issued","Approved"].includes(c.status));
  const certified=num(pnl.revenue), netDue=num(pnl.netDue), cost=num(pnl.cost), gp=num(pnl.grossProfit);
  const pctDone=cval>0?certified/cval:0;
  const supCost=CERTS.filter(c=>c.project===p&&c.status!=="Cancelled").reduce((a,c)=>a+(c.net||c.payable||0),0);
  const catRows=Object.entries(pnl.byCat||{}).map(([k,v])=>({label:k,value:v})).sort((a,b)=>b.value-a.value).slice(0,10);
  const grpRows=[{label:"Direct",value:num(pnl.byGroup.Direct),color:"#2E75B6"},{label:"Indirect",value:num(pnl.byGroup.Indirect),color:"#BF9000"},{label:"Overhead",value:num(pnl.byGroup.Overhead),color:"#375623"}];
  const mm={}; (pnl.byDate||[]).forEach(d=>{ const k=String(d.date).slice(0,7); mm[k]=(mm[k]||0)+num(d.cost); });
  const mk=Object.keys(mm).sort(); const trend=mk.map(k=>{const[y,mo]=k.split("-");return {label:mo+"/"+y.slice(2),value:mm[k]};});
  const gpc=gp>=0?"var(--green)":"var(--red)";
  const isHQ=p==="MA HQ – Operations";
  const kpi=(v,l,cls="")=>`<div class="kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  if(isHQ){
    const paid=num(pnl.paidOut);
    box.innerHTML=`
     <div class="note" style="margin-bottom:10px"><b>Overhead cost centre.</b> MA HQ carries recurring running costs (rent, salaries, utilities, subscriptions). These are company overhead — not billed to a client — and reduce group profit.</div>
     <div class="kpis">
       ${kpi("AED "+fmt(cost),"Total HQ operation cost")}
       ${kpi("AED "+fmt(paid),"Paid out")}
       ${kpi("AED "+fmt(cost-paid),"Outstanding")}
       ${kpi(pnl.count||0,"Expense entries")}
     </div>
     <div class="chartgrid" style="margin-top:12px">
       ${chartCard("HQ cost by category", hbars(catRows))}
       ${chartCard("HQ cost by type", donut(Object.entries(pnl.byType||{}).map(([k,v])=>({label:k,value:v})).sort((a,b)=>b.value-a.value)))}
     </div>
     <div class="chartcard"><div class="dash-h">Monthly HQ operation cost</div>${areaChart(trend)}</div>`;
    return;
  }
  box.innerHTML=`
   <div class="kpis">
     ${kpi("AED "+fmt(cval||sDown.cv),"Contract value (incl variations)")}
     ${kpi("AED "+fmt(certified),`Certified to client (${fmt(pctDone*100)}%)`)}
     ${kpi("AED "+fmt(netDue),"Net due from client")}
     ${kpi(live.length,"Client IPCs issued/approved")}
   </div>
   <div class="kpis" style="margin-top:10px">
     ${kpi("AED "+fmt(sDown.down),"Down payment (agreed)")}
     ${kpi("AED "+fmt(certified*sDown.retPct),`Retention held @ ${fmt(sDown.retPct*100)}%`)}
     ${kpi("AED "+fmt((cval||sDown.cv)-certified),"Balance to certify")}
     ${kpi("AED "+fmt(certified*sDown.retPct/2),"Retention due at completion (½)")}
   </div>
   <div class="note" style="margin-top:8px">Retention @ ${fmt(sDown.retPct*100)}% of certified revenue. Release: 5% on completion / taking-over, 5% after the 12-month DLP.</div>
   <div class="kpis" style="margin-top:10px">
     ${kpi("AED "+fmt(cost),"Cost incurred to date")}
     ${kpi("AED "+fmt(supCost),"Certified to suppliers (ex VAT)")}
     ${kpi(`<span style="color:${gpc}">AED ${fmt(gp)}</span>`,"Profit to date",gp>=0?"good":"alert")}
     ${kpi(`<span style="color:${gpc}">${certified?fmt(pnl.margin*100)+"%":"—"}</span>`,"Margin on certified",gp>=0?"good":"alert")}
   </div>
   <div class="chartgrid" style="margin-top:12px">
     ${chartCard("Cost by activity / trade — "+esc(p), hbars(catRows))}
     ${chartCard("Cost split — Direct / Indirect / Overhead", donut(grpRows,"AED "+fmt(cost)))}
   </div>
   <div class="chartcard"><div class="dash-h">Monthly spend — ${esc(p)}</div>${areaChart(trend)}</div>`;
}
function advTable(){
  const rows=SUPS.filter(s=>(+s.advanceAmount)>0).map(s=>{
    const rec=CERTS.filter(c=>c.supplierId===s.id&&c.status!=="Cancelled").reduce((a,c)=>a+(c.advanceRecovery||0),0);
    const out=Math.max(0,(+s.advanceAmount)-rec);
    return `<tr><td>${esc(s.name)}</td><td class="num">${fmt(s.advanceAmount)}</td><td class="num">${pct(s.advanceRecoveryRate)}</td><td class="num">${fmt(rec)}</td><td class="num"><b>${fmt(out)}</b></td></tr>`;
  }).join("");
  if(!rows) return `<div class="muted">No suppliers with an advance yet.</div>`;
  return `<table><tr><th>Supplier</th><th class="num">Advance</th><th class="num">Recovery rate</th><th class="num">Recovered</th><th class="num">Outstanding</th></tr>${rows}</table>`;
}

    const syncRow=(tr)=>{ const cb=tr.querySelector(".boqsel"), q=tr.querySelector(".boqq"); if(cb&&q) cb.checked=num(q.value)>0; };

    host.querySelectorAll(".boqq").forEach(inp=>inp.oninput=()=>{ syncRow(inp.closest("tr")); recalc(); });
    const all=$("#boqAll"); if(all) all.onchange=()=>{ host.querySelectorAll("tr").forEach(tr=>{ const cb=tr.querySelector(".boqsel"), q=tr.querySelector(".boqq"); if(!cb||!q) return; cb.checked=all.checked; q.value=all.checked?(num(q.dataset.cqty)||0):0; }); recalc(); };

    $("#boqEdit").onclick=(e)=>{ e.preventDefault(); boqEditor(); }; };
  const boqEditor=(seed)=>{ const host=$("#w_boq"); const items=(seed&&seed.length)?seed:(BOQ.length?BOQ.slice():[{ref:"1",description:"",unit:"",rate:0,qty:0}]);
    const row=(it,i)=>`<tr><td><input class="be_ref" value="${esc(it.ref||String(i+1))}" style="width:50px"></td><td><input class="be_desc" value="${esc(it.description||"")}" style="width:230px"></td><td><input class="be_unit" value="${esc(it.unit||"")}" style="width:60px"></td><td><input class="be_rate" type="number" step="0.01" value="${it.rate||0}" style="width:90px"></td><td><input class="be_qty" type="number" step="0.01" value="${it.qty||0}" style="width:80px"></td><td><a href="#" class="be_del">✕</a></td></tr>`;

    const bind=()=>host.querySelectorAll(".be_del").forEach(a=>a.onclick=(e)=>{ e.preventDefault(); a.closest("tr").remove(); }); bind();

  const showSup=async ()=>{ const supId=$("#f_supplierId").value, proj=$("#f_project").value; const sp=supById(supId)||sup;
    let t=null; try{ t=await api("contract-terms?supplier="+encodeURIComponent(supId)+"&project="+encodeURIComponent(proj)); }catch(e){}
    TERMS=t; BOQ=(t&&Array.isArray(t.boq))?t.boq:[]; BOQMODE=BOQ.length>0;
    const cv=t?num(t.contractValue):num(sp&&sp.contractValue);
    const rate=((t?t.contractType:(sp&&sp.contractType))||"")==="Rate";
    // BOQ on a rate / price-list contract (or no fixed value) = each invoice is a
    // standalone call-off: value only this cert's items, never deduct prior invoices.
    BOQPERINV = BOQMODE && (rate || !(cv>0));
    const perInvoice = !BOQMODE && (rate || !(cv>0));
    const retP=t?t.retentionPct:(sp&&sp.retentionPct), vatP=t?t.vatPct:(sp&&sp.vatPct), advA=t?t.advanceAmount:(sp&&sp.advanceAmount), advR=t?t.advanceRecoveryRate:(sp&&sp.advanceRecoveryRate), docNo=(t&&t.docNo)||(sp&&sp.lpoRef);
    const setupLink = ` &nbsp;·&nbsp;<a href="#" id="boqSetup">${BOQMODE?"Manage rate schedule (BOQ)":"Use BOQ / rate schedule"}</a>`;
    $("#supInfo").innerHTML = sp?(BOQMODE
      ?`<b>Rate contract — ${esc(proj)} (BOQ, ${BOQ.length} item${BOQ.length===1?"":"s"})</b>${BOQPERINV?" · per-invoice call-off":""} · Retention ${pct(retP)} · VAT ${pct(vatP)}${num(advA)>0?` · Advance AED ${fmt(advA)} @ ${pct(advR)}`:""} · Ref ${esc(docNo||"—")}${setupLink}`
      :(perInvoice
        ?`<b>${rate?"Rate contract (services)":"Per-invoice supplier (no fixed contract for this project)"}</b> · certify the submitted invoice amount · Retention ${pct(retP)} · VAT ${pct(vatP)} · Ref ${esc(docNo||"—")}${setupLink}`
        :`<b>Contract — ${esc(proj)}: AED ${fmt(cv)}</b> · Retention ${pct(retP)} · VAT ${pct(vatP)}${num(advA)>0?` · Advance AED ${fmt(advA)} @ ${pct(advR)}`:""} · Ref ${esc(docNo||"—")}${setupLink}`)):"";
    $("#w_workPct").style.display=(perInvoice||BOQMODE)?"none":""; $("#w_variations").style.display=(perInvoice||BOQMODE)?"none":"";

    $("#w_invoiceAmount").style.display="none";
    $("#w_invoices").style.display=INVMODE?"":"none";
    const fiRO=$("#f_invoiceNo"); if(fiRO) fiRO.readOnly=INVMODE;
    if(INVMODE) renderInvoices();
    $("#w_boq").style.display=BOQMODE?"":"none";
    $("#progH").textContent=BOQMODE?(BOQPERINV?"Items on this invoice (BOQ)":"Measurement this certificate (BOQ)"):(perInvoice?"This certificate (per invoice)":"Progress this certificate");
    $("#calcNote").innerHTML=BOQMODE
      ?(BOQPERINV
        ?"<b>Per-invoice rate schedule:</b> tick the items billed on <b>this invoice</b>; the certificate is valued at Σ(qty × rate) for those items only, plus any materials, less retention/VAT. Each invoice stands alone — <b>previous invoices are not deducted</b>."
        :"<b>BOQ measurement:</b> enter the <b>cumulative quantity done</b> per item; the certificate values at Σ(qty × rate), less retention, advance recovery and previously-certified — all scoped to this project.")
      :(perInvoice
        ?"<b>Per-invoice certification:</b> enter the <b>Invoice amount</b> — the certificate is valued at that amount (plus any materials, less retention/VAT). Use <b>Contra / back-charges only to deduct</b> money the supplier owes you; leave it 0 for a normal payment."
        :"Contract value, retention %, VAT % and <b>advance recovery</b> come from <b>this project's contract</b>, scoped to this project only.");
    if(BOQMODE) renderBoq();
    renderPrevCerts();
    if($("#boqSetup")) $("#boqSetup").onclick=(e)=>{ e.preventDefault(); $("#w_boq").style.display=""; boqEditor(); }; };
  // Previous certificates for this supplier on THIS project — shown so the new

  const renderPrevCerts=()=>{ const host=$("#supPrev"); if(!host) return;
    const supId=$("#f_supplierId").value, proj=$("#f_project").value;
    const prior=(CERTS||[]).filter(x=>x&&x.supplierId===supId&&String(x.project||"")===String(proj)&&x.no!==(c&&c.no)&&x.status!=="Cancelled").sort((a,b)=>(a.seq||0)-(b.seq||0));
    if(!prior.length){ host.innerHTML=""; return; }
    const totNet=prior.filter(x=>x.kind!=="advance").reduce((a,x)=>a+num(x.net),0);
    const totPay=prior.reduce((a,x)=>a+num(x.payable),0);
    const paid=prior.filter(x=>x.status==="Paid").reduce((a,x)=>a+num(x.payable),0);
    const advRec=prior.reduce((a,x)=>a+num(x.advanceRecovery),0);
    host.innerHTML=`<div class="card" style="background:#f7f9fc;border:1px solid #e3e7ee;padding:12px 14px;margin:0">
      <b style="color:var(--navy)">Previous payment certificates — this supplier · ${esc(proj)}</b>
      <div style="overflow-x:auto"><table style="margin-top:6px"><tr><th>No.</th><th>Date</th><th>Type</th><th>Invoice(s)</th><th class="num">Net</th><th class="num">Payable (incl VAT)</th><th>Status</th></tr>
      ${prior.map(x=>`<tr><td><b>${esc(x.no)}</b></td><td>${dmy(x.date)}</td><td>${x.kind==="advance"?'<span class="pill" style="background:#7A5C00;font-size:10px">DOWN PAYMENT</span>':"Progress"}</td><td class="muted" style="font-size:11px">${esc(x.invoiceNo||"—")}</td><td class="num">${fmt(x.net)}</td><td class="num">${fmt(x.payable)}</td><td><span class="pill st-${x.status}" style="font-size:10px">${esc(x.status)}</span></td></tr>`).join("")}
      <tr class="tot"><td colspan="4">TOTAL previously certified (net, excl. down payment)</td><td class="num">${fmt(totNet)}</td><td class="num">${fmt(totPay)}</td><td></td></tr></table></div>
      <div class="muted" style="font-size:11px;margin-top:6px"><b>Paid to date: AED ${fmt(paid)}</b>${advRec?` · Advance recovered so far: AED ${fmt(advRec)}`:""} — all of this is <b>considered automatically</b> in the new certificate: cumulative contracts deduct "previously certified", per-invoice certificates track each invoice's remaining balance, and advance recovery continues from where it stopped. Nothing is double-paid.</div></div>`; };
  showSup(); $("#f_supplierId").onchange=showSup; $("#f_project").onchange=showSup;
  $("#backBtn").onclick=()=>{ CUR?openCert(CUR.no):vCerts(); };
  $("#saveBtn").onclick=async ()=>{ const g=id=>$("#f_"+id).value;
    const body={ supplierId:g("supplierId"), project:g("project"), entity:g("entity"), invoiceNo:g("invoiceNo"),

      variations:+g("variations")||0, workPct:(+g("workPct")||0)/100, invoiceAmount:+g("invoiceAmount")||0, materialsOnSite:+g("materialsOnSite")||0, contra:+g("contra")||0 };

      const invs=gatherInvoices();
      if(!invs.length){ toast("Add at least one invoice with an amount to pay"); return; }
      for(const iv of invs){ if(iv.amount>0){ const rem=r2(iv.amount-invPrevPaid(iv.no));
        if(iv.thisAmount>rem+0.01){ toast("Invoice "+iv.no+": only AED "+fmt(rem)+" remains uncertified"); return; } } }
      body.invoices=invs; body.invoiceAmount=r2(invs.reduce((a,iv)=>a+iv.thisAmount,0)); body.invoiceNo=invs.map(iv=>iv.no).join(", ");

      toast(isNew?("Created "+d.no):"Saved"); await load(); openCert(d.no);
    }catch(e){ toast(e.message); } };
}

async function openCert(no){
  VIEW="certs";
  let c; try{ c=await api("cert/"+encodeURIComponent(no)); }catch(e){ toast(e.message); return; }
  CUR=c; const K=c.calc||{};
  const row=(l,v,cls="")=>`<tr><td class="lab">${l}</td><td class="num ${cls}">${v}</td></tr>`;
  const canEdit = !["Approved","Paid","Cancelled"].includes(c.status) && ["QS","PM","CEO"].includes(ME.role);
  const acts=[];
  if(c.status==="Draft" && ["QS","CEO"].includes(ME.role)) acts.push(["submit","Submit for check","btn"]);
  if(c.status==="Certified" && ["PM","CEO"].includes(ME.role)) acts.push(["check","Confirm check","btn"]);
  if(c.status==="Checked" && ME.role==="CEO") acts.push(["approve","APPROVE","btn green"]);
  if(["Certified","Checked","Approved"].includes(c.status) && ["PM","CEO"].includes(ME.role)) acts.push(["reject","Reject","btn red"]);
  if(c.status==="Approved" && ["Accounts","CEO"].includes(ME.role)) acts.push(["pay","Record payment","btn gold"]);
  if(c.status!=="Paid" && c.status!=="Cancelled" && ME.role==="CEO") acts.push(["cancel","Cancel","btn ghost"]);
  const pm = c.payment ? c.payment.mode : "";
  const chqPrinted = !!(c.payment && c.payment.printed);
  const chequeBtn = pm==="Cheque"
    ? (chqPrinted
        ? (ME.role==="CEO"
            ? `<button class="btn gold" id="chqBtn">Reprint cheque 🔒 (CEO)</button>`
            : `<button class="btn" id="chqBtn" disabled title="Cheque already printed${c.payment.printedAt?" on "+dmy(c.payment.printedAt):""} — only the CEO can reprint" style="opacity:.5;cursor:not-allowed">Cheque printed ✓</button>`)
        : `<button class="btn gold" id="chqBtn">Print cheque</button>`)
    : "";
  const amendChqBtn = (pm==="Cheque" && c.payment && ME.role==="CEO") ? `<button class="btn ghost" id="amendChqBtn" title="Correct a mis-printed cheque number">Amend cheque no.</button>` : "";
  const amendAmtBtn = (c.payment && ME.role==="CEO") ? `<button class="btn ghost" id="amendAmtBtn" title="Correct the recorded payment amount">Amend amount</button>` : "";
  const revBtn = (c.payment && ME.role==="CEO") ? `<button class="btn ghost" id="revBtn2" style="color:var(--red);border-color:var(--red)" title="Reverse this payment and return the certificate to Approved">Reverse payment</button>` : "";
  const cashBtn = pm==="Cash" ? `<button class="btn gold" id="pcvBtn">Petty cash voucher</button>` : "";
  const rvBtn = c.payment ? `<button class="btn ghost" id="rvBtn">Receipt voucher</button>` : "";
  const canPay=["Accounts","CEO"].includes(ME.role);
  const proofBtn = pm==="Bank Transfer" ? (
    (c.payment.proof?`<button class="btn ghost" id="proofView">View proof</button>`:"") +
    (canPay?`<button class="btn ghost" id="proofAdd">${c.payment.proof?"Replace":"Attach"} proof</button>`:"")
  ) : "";
  $("#main").innerHTML = `<div class="card">
    <div class="flex"><h2 style="margin:0">${esc(c.no)}</h2><span class="pill st-${c.status}">${c.status}</span>
      <span class="muted">${esc(c.supplier)} · ${esc(c.project)} · Inv: ${esc(c.invoiceNo||"—")}</span>
      <div class="right flex">
        ${canEdit?`<button class="btn ghost" id="editBtn">Edit</button>`:""}
        ${(!canEdit&&ME.role==="CEO"&&c.status!=="Cancelled")?`<button class="btn ghost" id="ceoEditBtn" style="color:var(--gold);border-color:var(--gold)">Edit 🔒 (CEO)</button>`:""}
        <button class="btn" id="printBtn">${pm==="Cash"?"Print certificate + voucher":"Print certificate"}</button><button class="btn ghost" id="dlBtn">⤓ PDF</button>${chequeBtn}${amendChqBtn}${amendAmtBtn}${cashBtn}${rvBtn}${proofBtn}${revBtn}
        ${acts.map(([a,l,cl])=>`<button class="${cl}" data-a="${a}">${l}</button>`).join("")}${delBtn("cert",c.no,c.no)}
      </div></div>
    ${(c.payment && Math.abs(num(c.payment.amount)-num(K.payable))>0.01)?`<div class="note" style="margin-top:12px;background:#fff4e5;border-left:4px solid #bf9000">
      <b>Recorded payment (AED ${fmt(c.payment.amount)}) doesn't match this certificate (AED ${fmt(K.payable)}).</b> The certificate was changed after payment${num(K.payable)>num(c.payment.amount)?` — the supplier was underpaid by AED ${fmt(num(K.payable)-num(c.payment.amount))}`:` — the supplier was overpaid by AED ${fmt(num(c.payment.amount)-num(K.payable))}`}. ${ME.role==="CEO"?`Click <b>Reverse payment</b> above, then <b>Record payment</b> for AED ${fmt(K.payable)} to align them.`:`Ask the CEO to reverse and re-record the payment.`}</div>`:""}
    ${(num(K.net)<0 && num(c.contra)>0 && num(K.cumValue)===0)?`<div class="note" style="margin-top:12px;background:#fdecec;border-left:4px solid #c0392b">
      <b>This certificate is negative (−${fmt(Math.abs(K.payable))}).</b> The amount <b>AED ${fmt(c.contra)}</b> was entered in <b>Contra / back-charges</b> (a deduction). If you meant to <b>pay</b> ${esc(c.supplier)}, it should be the <b>invoice amount</b> instead.
      ${!["Paid","Cancelled"].includes(c.status)?`<div style="margin-top:8px"><button class="btn green" id="fixContraBtn">Fix → make it a AED ${fmt(c.contra)} payment</button> <span class="muted" style="font-size:11px">moves the amount to Invoice amount and clears contra</span></div>`:`<div style="margin-top:6px" class="muted">This certificate is already ${esc(c.status)} with a payment recorded — cancel/reverse the payment first, then correct it.</div>`}</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px">
      <div><h3>Certificate calculation (AED)${K.perInvoice?' <span class="muted" style="font-size:11px;font-weight:400">— per invoice</span>':""}</h3><table>
        ${K.perInvoice?`
        ${invHistory(c).map(h=>row(esc(h.no)+(h.amount>0?` <span class="muted" style="font-size:10px">(value ${fmt(h.amount)}${h.prev?` · prev ${fmt(h.prev)}`:""}${h.remaining!=null&&h.remaining>0.009?` · <b style="color:#7A5C00">remaining ${fmt(h.remaining)}</b>`:h.remaining!=null?" · settled":""})</span>`:""),fmt(h.thisAmount))).join("")}
        ${row("Invoice amount (this certificate)",fmt(K.cumValue))}
        ${row("Materials on site",fmt(c.materialsOnSite))}
        ${row("Gross this certificate",fmt(K.gross),"tot")}
        ${row("Less: retention @ "+pct(c.retentionPct),"("+fmt(K.retention)+")")}
        ${row("Less: advance recovery (auto)","("+fmt(K.advanceRecovery)+")")}
        ${row("Less: contra / back-charges","("+fmt(c.contra)+")")}`:`
        ${row("Adjusted order value",fmt(K.adjusted))}
        ${row("Cumulative work done",pct(c.workPct))}
        ${row("Cumulative value of work",fmt(K.cumValue))}
        ${row("Materials on site",fmt(c.materialsOnSite))}
        ${row("Total gross to date",fmt(K.gross),"tot")}
        ${row("Less: retention @ "+pct(c.retentionPct),"("+fmt(K.retention)+")")}
        ${row("Less: advance recovered to date","("+fmt(K.advanceRecoveredToDate!=null?K.advanceRecoveredToDate:K.advanceRecovery)+")")}
        ${row("Less: previously certified","("+fmt(K.prevCertified)+")")}
        ${row("Less: contra / back-charges","("+fmt(c.contra)+")")}`}
        ${row("NET this certificate (excl VAT)",fmt(K.net),"tot")}
        ${row("VAT @ "+pct(c.vatPct),fmt(K.vat))}
        ${row("<b>NET PAYABLE (incl VAT)</b>","<b>"+fmt(K.payable)+"</b>")}
      </table><div class="muted" style="margin-top:6px">${esc(words(K.payable))}</div>
      ${(+K.advanceAmount)>0?`<div class="note" style="margin-top:8px">Advance: AED ${fmt(K.advanceAmount)} · recovered to date incl. this ${fmt(K.advanceRecoveredToDate)} · outstanding <b>${fmt(K.advanceOutstanding)}</b></div>`:""}</div>
      <div>
        ${c.payment?`<h3>Payment</h3><table>
          ${row("Mode",esc(c.payment.mode))}${row("Reference",esc(c.payment.ref||"—"))}
          ${row("Bank",esc(c.payment.bank||"—"))}${row("Date",dmy(c.payment.date))}
          ${row("Payee",esc(c.payment.payee))}${row("Amount",fmt(c.payment.amount),"tot")}</table>${receiptHtml(c)}`:""}
        <h3>Attachments</h3>${attachHtml(c)}
        <h3>History</h3><ul class="audit">${(c.audit||[]).slice().reverse().map(a=>`<li>${dmy(a.at)} — <b>${esc(a.by)}</b>: ${esc(a.action)}${a.comment?" — <i>"+esc(a.comment)+"</i>":""}</li>`).join("")}</ul>
      </div></div></div>`;
  if(canEdit) $("#editBtn").onclick=()=>certForm(c);
  if($("#ceoEditBtn")) $("#ceoEditBtn").onclick=()=>ceoUnlock(()=>certForm(c));
  bindAttach(c);
  bindReceipt(c);
  $("#printBtn").onclick=()=>printCert(c);
  if($("#dlBtn")) $("#dlBtn").onclick=()=>downloadDoc(c.no,()=>printCert(c));
  if($("#chqBtn") && !$("#chqBtn").disabled) $("#chqBtn").onclick=()=>{
    if(chqPrinted && ME.role==="CEO"){
      ceoUnlock(async ()=>{ printCheque(c); try{ await api("cert/"+encodeURIComponent(c.no)+"/printed",{method:"POST"}); }catch(e){} toast("Cheque reprinted — logged"); });
      return;

        : m==="Cash"?"✔ After recording, print the Petty Cash Voucher from this certificate for signature."

    };
    return;
  }
  await send();

// Invoice-by-invoice history for a per-invoice certificate: full value, previously
// certified (earlier certs only), this certificate, and remaining balance.
function invHistory(c){
  const list=Array.isArray(c.invoices)&&c.invoices.length?c.invoices:[];
  return list.map(iv=>{ const key=String(iv.no||"").trim().toLowerCase();
    const prev=(CERTS||[]).filter(x=>x&&x.supplierId===c.supplierId&&x.status!=="Cancelled"&&x.kind!=="advance"&&(x.seq||0)<(c.seq||0)).reduce((a,x)=>{
      if(Array.isArray(x.invoices)&&x.invoices.length){ for(const v of x.invoices){ if(String(v.no||"").trim().toLowerCase()===key) a+=num(v.thisAmount); } }
      else if(String(x.invoiceNo||"").trim().toLowerCase()===key) a+=num(x.invoiceAmount); return a; },0);
    const amt=num(iv.amount), th=num(iv.thisAmount);
    return { no:iv.no, amount:amt, prev:r2(prev), thisAmount:th, remaining: amt>0?r2(amt-prev-th):null }; });
}

let PDF_OUT="";
function downloadDoc(name,fn){ PDF_OUT=name||"document"; try{ fn(); }catch(e){ PDF_OUT=""; toast(e.message); } }
// Save any table as CSV (opens directly in Excel).
function exportCsv(filename,headers,rows){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=[headers.map(q).join(",")].concat(rows.map(r=>r.map(q).join(","))).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=String(filename).replace(/[^A-Za-z0-9._-]+/g,"_")+".csv"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ a.remove(); URL.revokeObjectURL(a.href); }catch(e){} },20000);
  toast("Exported "+filename+".csv");
}
// Download a server-rendered corporate document (RFQ, LOA / subcontract,
// completion certificate…) as a PDF — same pagination as the printed page.
async function downloadServerDoc(apiPath,name){
  try{ toast("Building PDF…");
    const html=await apiText(apiPath);
    const b64=await htmlToPdfBase64(html,{budget:6e6});
    downloadPdfB64(String(name||"document").replace(/[^A-Za-z0-9._-]+/g,"_")+".pdf",b64);
    toast("Downloaded "+name+".pdf");
  }catch(e){ toast("PDF failed: "+e.message); }
}
function doPrint(){
  // Print inside an isolated iframe with @page margin:0 (suppresses the browser's
  // own header/footer). Before printing, the content is PAGINATED into explicit A4
  // pages: every page has real margins, page 2+ repeats a compact letterhead marked
  // "continued", every page carries "Page N of M", and breaks fall only between
  // sections / whole rows — never through the middle of a table.
  const styleTags=[...document.querySelectorAll("style")].map(s=>s.outerHTML).join("");
  const base=location.origin+location.pathname;
  const inner=$("#printArea").innerHTML;
  if(PDF_OUT){ const nm=PDF_OUT; PDF_OUT="";
    (async ()=>{ try{ toast("Building PDF…");
      const doc=`<!doctype html><html><head><meta charset="utf-8"><base href="${base}">${styleTags}
        <style>${PG_CSS}
        </style></head><body class="printing-cert"><div id="printArea">${inner}</div></body></html>`;
      const b64=await htmlToPdfBase64(doc,{budget:6e6});
      downloadPdfB64(nm.replace(/[^A-Za-z0-9._-]+/g,"_")+".pdf",b64);
      toast("Downloaded "+nm+".pdf");
    }catch(e){ toast("PDF failed: "+e.message); } })();
    return;
  }
  const html=`<!doctype html><html><head><meta charset="utf-8"><base href="${base}">${styleTags}
   <style>@page { size:A4; margin:0; } ${PG_CSS}
   </style></head><body class="printing-cert"><div id="printArea">${inner}</div></body></html>`;
  let f=document.getElementById("printFrame"); if(f) f.remove();
  f=document.createElement("iframe"); f.id="printFrame";
  f.setAttribute("style","position:fixed;right:0;bottom:0;width:230mm;height:80px;border:0;visibility:hidden");
  document.body.appendChild(f);
  const d=f.contentWindow.document; d.open(); d.write(html); d.close();
  const cleanup=()=>{ setTimeout(()=>{ try{ f.remove(); }catch(e){} }, 1500); };
  const go=()=>{ try{ paginatePrint(d,f.contentWindow); }catch(e){} try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.print(); } cleanup(); };
  let tries=0;
  const ready=()=>{ const imgs=[...d.images]; if(imgs.length===0||imgs.every(i=>i.complete)||tries++>50){ go(); } else setTimeout(ready,50); };
  setTimeout(ready,80);
}
// Measure each top-level block of every .cert, pack them into fixed-height A4 pages
// (an over-tall table is split by whole rows with its section/header rows repeated
// on the continuation), then rebuild as .pg pages with repeated compact letterhead
// on page 2+ and "Page N of M" on every page.
function paginatePrint(d,w){
  const pa=d.getElementById("printArea"); if(!pa) return;
  const certs=[...pa.children].filter(x=>x.classList&&x.classList.contains("cert"));
  if(!certs.length) return;
  const probe=d.createElement("div"); probe.style.cssText="width:100mm;position:absolute;visibility:hidden";
  d.body.appendChild(probe); const mm=(probe.getBoundingClientRect().width/100)||3.78; probe.remove();
  const capFull=Math.floor((295-10-7)*mm)-Math.ceil(9*mm);
  const contH=Math.ceil(19*mm);
  const bh=(el)=>{ const cs=w.getComputedStyle(el); return el.getBoundingClientRect().height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0); };
  const pages=[];
  for(const cert of certs){
    const hd=cert.querySelector(".hd");
    const info={ logo:(hd&&hd.querySelector("img")&&hd.querySelector("img").getAttribute("src"))||"logo.png",
      name:((hd&&hd.querySelector(".n1"))?hd.querySelector(".n1").textContent:"MA GROUP").trim(),
      title:(cert.querySelector(".title")?cert.querySelector(".title").textContent:"Document").trim(),
      no:(cert.querySelector(".meta b")?cert.querySelector(".meta b").textContent:"").trim() };
    const blocks=[...cert.children].filter(x=>!(x.classList&&x.classList.contains("pagebreak")));
    let cur=[],curH=0,idx=0;
    const cap=()=>idx===0?capFull:capFull-contH;
    const push=()=>{ pages.push({blocks:cur,info,cont:idx>0}); idx++; cur=[]; curH=0; };
    for(const bl of blocks){
      const h=bh(bl);
      if(h>cap()&&bl.tagName==="TABLE"&&bl.rows.length>4){
        // Too tall for one page even alone: split by whole rows, repeating the
        // section-title / column-label rows at the top of each continuation part.
        if(cur.length) push();
        const rows=[...bl.rows];
        let hdrN=0; if(rows[0]&&rows[0].querySelector("td.sec")){ hdrN=1; if(rows[1]&&(rows[1].querySelector("th")||rows[1].querySelector("td.lab"))) hdrN=2; }
        const hdr=rows.slice(0,hdrN), hdrH=hdr.reduce((a,r)=>a+r.getBoundingClientRect().height,0);
        const rowH=rows.map(r=>r.getBoundingClientRect().height);
        let part=d.createElement("table"); part.className=bl.className; let ph=0,n=0;
        for(let i=0;i<rows.length;i++){
          if(ph+rowH[i]>cap()&&n>hdrN){ cur=[part]; push(); part=d.createElement("table"); part.className=bl.className; hdr.forEach(r=>part.appendChild(r.cloneNode(true))); ph=hdrH; n=hdrN; }
          part.appendChild(rows[i]); ph+=rowH[i]; n++;
        }
        cur=[part]; curH=ph; continue;
      }
      if(curH+h>cap()&&cur.length) push();
      cur.push(bl); curH+=h;
    }
    if(cur.length) push();
  }
  const eh=(t)=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
  pa.innerHTML="";
  pages.forEach((p,i)=>{
    const pg=d.createElement("div"); pg.className="pg"+(i===pages.length-1?" last":"");
    if(p.cont){ const c=d.createElement("div"); c.className="pgcont";
      c.innerHTML=`<img src="${eh(p.info.logo)}"><div class="en">${eh(p.info.name)}</div><div class="rt"><b>${eh(p.info.title)}</b>${p.info.no?" — "+eh(p.info.no):""}<br>continued from previous page</div>`;
      pg.appendChild(c); }
    const body=d.createElement("div"); body.className="pgbody";
    const cw=d.createElement("div"); cw.className="cert";
    p.blocks.forEach(b=>cw.appendChild(b));
    body.appendChild(cw); pg.appendChild(body);
    const num=d.createElement("div"); num.className="pgnum";
    num.innerHTML=`<span>${eh(p.info.title)}${p.info.no?" · "+eh(p.info.no):""}</span><span>Page ${i+1} of ${pages.length}</span>`;
    pg.appendChild(num);
    pa.appendChild(pg);
  });
}

/* ---------- cheque words (bank style: "Three thousand ... and 10/100 only.") ---------- */
function chequeWords(amount){
  const neg=num(amount)<0; amount=Math.abs(num(amount));
  const d=Math.floor(amount), f=Math.round((amount-d)*100), m=Math.floor(d/1e6), t=Math.floor(d%1e6/1e3), u=d%1e3;
  let w=[m?grp(m).toLowerCase()+" million":"",t?grp(t).toLowerCase()+" thousand":"",u?grp(u).toLowerCase():""].filter(Boolean).join(" ")||"zero";
  w = (neg?"minus ":"")+w + (f?" and "+String(f).padStart(2,"0")+"/100":"") + " only.";
  return w.charAt(0).toUpperCase()+w.slice(1);
}
/* ---------- cheque PDF (exact size, single page, prints at 100%) ---------- */
function chequePDF(c){
  const ch=S.cheque, f=ch.fields, ox=+ch.offsetXmm||0, oy=+ch.offsetYmm||0;
  const W=+ch.widthMm||205, H=+ch.heightMm||95, fs=+ch.fontPt||11, wrap=+ch.wordsWrapMm||120;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: W>=H?"landscape":"portrait", unit:"mm", format:[W,H] });
  doc.setFont("helvetica","normal"); doc.setFontSize(fs);
  const put=(k,txt)=>{ const p=f[k]; if(!p||txt==null||txt==="") return; doc.text(String(txt), p.x+ox, p.y+oy); };
  const amt=c.payment.amount;
  // amount in words, wrapped to at most 2 lines
  const wparts = doc.splitTextToSize(chequeWords(amt), wrap);
  put("date", dmy(c.payment.date));
  put("payee", c.payment.payee);
  if(wparts[0]) put("words1", wparts[0]);
  if(wparts[1]) put("words2", wparts.slice(1).join(" "));
  put("figures", "*"+fmt(amt)+"/-*");
  return doc;
}
function printCheque(c){
  try{
    const doc=chequePDF(c);
    doc.autoPrint();
    const url=doc.output("bloburl");
    const w=window.open(url,"_blank");
    if(!w){ doc.save("cheque-"+(c.no||"test")+".pdf"); toast("Pop-up blocked — cheque PDF downloaded; open and print at 100%"); }
  }catch(e){ toast("Cheque error: "+e.message); }
}

/* ---------- suppliers ---------- */
function supAgg(id){
  const list=CERTS.filter(c=>c.supplierId===id&&c.status!=="Cancelled");
  const sum=(f,pred)=>list.filter(pred||(()=>true)).reduce((a,c)=>a+(f(c)||0),0);
  return {
    list,
    certified: sum(c=>c.payable),
    paid: sum(c=>c.payable, c=>c.status==="Paid"),
    pending: sum(c=>c.payable, c=>c.status==="Approved"),
    pipeline: sum(c=>c.payable, c=>["Draft","Certified","Checked"].includes(c.status)),
    retention: sum(c=>c.retention),
    advanceRec: sum(c=>c.advanceRecovery),
    certifiedNet: sum(c=>c.net),
  };
}

function supStatement(id){
  const s=supById(id); if(!s){ toast("Not found"); return; }
  const canEdit=["QS","PM","CEO"].includes(ME.role);
  const a=supAgg(id);
  const advOut=Math.max(0,(+s.advanceAmount||0)-a.advanceRec);

/* ---------- clients & client certificates (receivables) ---------- */
let CLIENTS=[], CONTRACTS=[];
// True advance/down-payment percentage = actual advance ÷ contract sum, so the
// displayed % always matches the configured amount (not a stale default).
function advPctOf(ct){ const a=num(ct&&ct.advanceAmount), cs=num(ct&&ct.contractSum); return (cs>0&&a>0)?a/cs:num(ct&&ct.advancePct); }
function ccCalc(grossCum,mos,contra,ct,prevNet,recoveredSoFar,prevContra,opt){
  opt=opt||{};
  const variationsCum=num(opt.variationsCum);
  const gross=r2(num(grossCum)+num(mos));
  const retention=r2(gross*num(ct.retentionPct));
  const afterRet=r2(gross-retention);
  let advRec=0; const advAmt=num(ct.advanceAmount); let advRate=num(ct.recoveryRate);
  if(advAmt>0&&!(advRate>0)){ const base=num(ct.contractSum); if(base>0) advRate=advAmt/base; }
  if(advAmt>0&&advRate>0){ const baseCum=Math.max(0,r2(num(grossCum)-variationsCum)); const cumRec=Math.min(r2(advRate*baseCum),advAmt); advRec=Math.max(0,r2(cumRec-num(recoveredSoFar))); }
  const net=r2(afterRet-r2(num(recoveredSoFar)+advRec)-r2(num(prevContra)+num(contra))-num(prevNet));
  const vat=r2(net*num(ct.vatPct));
  const grossThis=r2(gross-num(opt.prevGross));
  const variationsThis=r2(variationsCum-num(opt.prevVariations));
  return {gross,retention,afterRet,advRec,net,vat,payable:r2(net+vat),
    advRecoveredToDate:r2(num(recoveredSoFar)+advRec), advOutstanding:Math.max(0,r2(advAmt-num(recoveredSoFar)-advRec)),
    prevCertified:num(prevNet), advAmount:advAmt, retentionHeld:retention,
    grossThis, variationsCum, variationsThis,
    netToDate:r2(afterRet-r2(num(recoveredSoFar)+advRec)-r2(num(prevContra)+num(contra)))};
}
function r2(n){ n=num(n); return Math.round((n+Number.EPSILON)*100)/100; }
function num(x){ return typeof x==="number"&&isFinite(x)?x:parseFloat(x)||0; }
// Advance recovered to date (cumulative) — works from either the client-side (advRec)
// or backend (advanceRecovery) calc, deriving it so the table always foots to net.
function ccAdvToDate(calc){
  const contra=num(calc.contra);
  if(calc.advanceRecoveredToDate!==undefined&&calc.advanceRecoveredToDate!==null) return num(calc.advanceRecoveredToDate);
  if(calc.afterRet!==undefined) return r2(num(calc.afterRet)-(r2(num(calc.net)+num(calc.prevCertified)+contra)));
  return (calc.advanceRecovery!==undefined)?num(calc.advanceRecovery):num(calc.advRec);
}
// Full 3-section client IPC in the MA / client "by-building" format:
//   1. Work certified by building   2. Certificate calculation (this period)   3. Cumulative payment summary
function ccSections(calc,ct,lines){
  const R=(l,v,neg,cls)=>`<tr${cls?` class="${cls}"`:""}><td class="lab">${l}</td><td style="text-align:right">${neg&&num(v)?"("+fmt(Math.abs(v))+")":fmt(v)}</td></tr>`;
  const revised=r2(num(ct.contractSum)+num(ct.variations));
  const hasB=Array.isArray(lines)&&lines.length>0;
  const totalBoq=hasB?r2(lines.reduce((a,l)=>a+num(l.value),0)):revised;
  const grossCum=hasB?r2(lines.reduce((a,l)=>a+r2(num(l.value)*num(l.pct)),0)):num(calc.gross);
  const overall=revised>0?grossCum/revised:(totalBoq>0?grossCum/totalBoq:0);
  // Section 1 — work certified by building
  const brows=hasB?lines.map(l=>{ const v=r2(num(l.value)*num(l.pct));
    return `<tr><td>${esc(l.name||"")}</td><td style="text-align:right">${fmt(l.value)}</td><td style="text-align:right">${(num(l.pct)*100).toFixed(1)}%</td><td style="text-align:right">${fmt(v)}</td><td style="font-size:9.5px;color:#b45309">${esc(l.remarks||"")}</td></tr>`;}).join(""):"";
  const sec1=hasB?`<table><tr><td class="sec navy" colspan="5">1. WORK CERTIFIED — BY BUILDING (AED)</td></tr>
   <tr><td class="lab" style="width:38%">Building / scope of works as per BOQ</td><td style="text-align:right">BOQ Value</td><td style="text-align:right">Cumul. % Done</td><td style="text-align:right">Value Certified</td><td>Remarks</td></tr>
   ${brows}
   <tr class="tot"><td><b>TOTAL (incl. Variations)</b></td><td style="text-align:right"><b>${fmt(totalBoq)}</b></td><td style="text-align:right"><b>${(overall*100).toFixed(1)}%</b></td><td style="text-align:right"><b>${fmt(grossCum)}</b></td><td></td></tr>
   <tr><td class="lab" colspan="4">Overall Project Completion (to date)</td><td style="text-align:right"><b>${(overall*100).toFixed(1)}%</b></td></tr></table>`:"";
  // Section 2 — certificate calculation (this period)
  const grossThis=(calc.grossThis!==undefined)?num(calc.grossThis):num(calc.gross);
  const retThis=r2(grossThis*num(ct.retentionPct));
  const advThis=(calc.advRec!==undefined)?num(calc.advRec):num(calc.advanceRecovery);
  const varThis=num(calc.variationsThis);
  const advPctLabel=num(ct.recoveryRate)>0?pct(ct.recoveryRate):(num(ct.advanceAmount)>0&&num(ct.contractSum)>0?pct(num(ct.advanceAmount)/num(ct.contractSum)):"");
  const sec2=`<table><tr><td class="sec navy" colspan="2">2. CERTIFICATE CALCULATION — THIS PERIOD (AED)</td></tr>
   ${R("Gross invoice this period — base works + variations (ex-VAT)",grossThis)}
   ${R("Less: retention @ "+pct(ct.retentionPct),retThis,true)}
   ${R("Less: advance payment recovery"+(advPctLabel?" (@ "+advPctLabel+" of base works)":""),advThis,true)}
   ${R("Net certified — base + variations (ex-VAT)",calc.net,false,"tot")}
   ${R("Add: VAT @ "+pct(ct.vatPct),calc.vat)}
   <tr class="pay"><td>★ TOTAL DUE THIS CERTIFICATE ★</td><td style="text-align:right">${fmt(calc.payable)}</td></tr>
   ${varThis?`<tr><td class="lab" style="font-size:10.5px;font-style:italic">↳ of which variations certified this period — gross (ex-VAT)</td><td style="text-align:right;font-style:italic">${fmt(varThis)}</td></tr>`:""}
   <tr><td class="lab" style="font-style:italic">In words</td><td style="font-style:italic">${esc(words(calc.payable))}</td></tr></table>`;
  // Section 3 — cumulative payment summary
  const grossToDate=num(calc.gross);
  const retToDate=num(calc.retention);
  const advToDate=ccAdvToDate(calc);
  const netToDate=(calc.netToDate!==undefined)?num(calc.netToDate):r2(num(calc.afterRet)-advToDate-num(calc.contra));
  const sec3=`<table><tr><td class="sec navy" colspan="2">3. CUMULATIVE PAYMENT SUMMARY (AED)</td></tr>
   ${R("Revised contract value (incl. VOs, ex-VAT)",revised)}
   ${R("Total gross certified to date (ex-VAT)",grossToDate)}
   ${R("Less: total retention held",retToDate,true)}
   ${R("Less: advance recovered to date",advToDate,true)}
   ${R("Net paid / payable to date (ex-VAT)",netToDate,false,"tot")}
   ${R("Advance outstanding to recover",calc.advOutstanding)}</table>`;
  return sec1+sec2+sec3;
}

async function importExpensesExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xlsm,.xls,.csv";
  inp.onchange=async ()=>{ const f=inp.files[0]; if(!f) return;
    toast("Reading file…");
    try{ await loadScript("xlsx.full.min.js"); }catch(e){ toast("Could not load the Excel reader"); return; }
    let out=[];
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      // Find the sheet + header row that looks like a cost table (has a Date and a Cost/Invoice column).
      let best=null;
      for(const sn of wb.SheetNames){
        const rr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
        const lim=Math.min(rr.length,12);
        for(let h=0;h<lim;h++){
          const hd=(rr[h]||[]).map(x=>String(x||"").toLowerCase().trim());
          const has=k=>hd.some(x=>x.includes(k));
          const hasAmt=hd.some(x=>x==="cost"||x.includes("invoice")||x.includes("amount"));
          if(!has("date")||!hasAmt) continue;
          let score=0; ["date","cost","invoice","amount","supplier","cost type","category","trade","building","area","status","paid","project","budget","descr"].forEach(k=>{ if(has(k)) score++; });
          if(!best||score>best.score) best={rows:rr, hstart:h, score, head:hd};
        }
      }
      if(!best){ toast("Couldn't find a cost table. The sheet needs a header row with Date and Cost/Invoice columns."); return; }
      const rows=best.rows, head=best.head, hstart=best.hstart;
      const find=(...ks)=>head.findIndex(h=>ks.some(k=>h.includes(k)));
      const iType=head.findIndex(h=>h.includes("cost type")||h==="type");
      const iAmt=head.findIndex(h=>h==="cost"||h.includes("invoice")||h.includes("amount")||h.includes("cost ("));
      const iInv=head.findIndex(h=>h.includes("invoice no")||h.includes("invoice #")||h.includes("invoice number")||h==="inv no"||h==="inv#");
      const ci={ project:find("project"), date:find("date"), area:find("area","building"), category:find("category","trade"),
        costType:iType, supplier:find("supplier","subcont"), invoiceNo:iInv, description:find("descr","narrat"), poRef:find("po/","po ","p.o","lpo"),
        boqRef:find("boq"), budgeted:find("budget"), amount:iAmt, status:find("status"), paid:find("paid") };
      const toISO=v=>{ if(v instanceof Date){ let y=v.getFullYear(); if(y<2020) y+=20; return `${y}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`; } const s=String(v||"").trim(); let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:""; };
      const at=(r,i)=>i>=0?r[i]:"";
      const defProj=(ci.project<0)?(prompt("This file has no Project column. Project name for all rows:","The Square 2.0 - Nad Al Sheba")||""):"";
      for(let n=hstart+1;n<rows.length;n++){ const r=rows[n]||[]; const date=toISO(at(r,ci.date));
        const project=ci.project>=0?String(at(r,ci.project)||"").trim()||defProj:defProj;
        const amount=parseFloat(String(at(r,ci.amount)).replace(/[^\d.-]/g,""))||0;
        if(!date||!project||(amount===0 && !String(at(r,ci.supplier)).trim())) continue;
        out.push({ project, date, area:String(at(r,ci.area)||"").trim(), category:String(at(r,ci.category)||"").trim(),
          costType:String(at(r,ci.costType)||"").trim(), supplier:String(at(r,ci.supplier)||"").trim(), invoiceNo:String(at(r,ci.invoiceNo)||"").trim(),
          description:String(at(r,ci.description)||"").trim(), poRef:String(at(r,ci.poRef)||"").trim(), boqRef:String(at(r,ci.boqRef)||"").trim(),
          budgeted:parseFloat(String(at(r,ci.budgeted)).replace(/[^\d.-]/g,""))||0, amount,
          status:String(at(r,ci.status)||"").trim(), paid:parseFloat(String(at(r,ci.paid)).replace(/[^\d.-]/g,""))||0 }); }
    }catch(e){ toast("Could not read that file: "+e.message); return; }
    if(!out.length){ toast("No dated cost rows found in that file."); return; }
    if(!confirm(`Found ${out.length} expense rows.\n\nImport now into the cost log?`)) return;
    toast("Importing…");
    try{ const res=await api("expenses/import",{method:"POST",body:{rows:out}}); COSTMETA=null; toast(`Imported ${res.created} expenses`); reloadExp(); }catch(e){ toast(e.message); }
  };
  inp.click();
}

function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
// Parse an MA Group LPO / Purchase Order PDF into rate-schedule line items
// (ref, description, unit, rate, contract qty). Columns are read by x-position.
async function parseLpoPdf(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const numRe=/^-?[\d,]+(\.\d+)?$/; let colQty=null,colRate=null; const items=[]; let cur=null;
  const isTotals=(t)=>/sub\s*total|^total|terms|notes|authoriz|signature|thank you|bank details|grand total/i.test(t);
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const byY={}; tc.items.forEach(it=>{ const x=it.transform[4], y=Math.round(it.transform[5]); const s=(it.str||"").trim(); if(!s)return; (byY[y]=byY[y]||[]).push({x,s}); });
    const ys=Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for(const y of ys){ const cells=byY[y].sort((a,b)=>a.x-b.x); const joined=cells.map(c=>c.s).join(" ");
      if(/\bQty\b/.test(joined)&&/\bRate\b/.test(joined)&&/\bAmount\b/.test(joined)){ cells.forEach(c=>{ if(c.s==="Qty")colQty=c.x; if(c.s==="Rate")colRate=c.x; }); continue; }
      const first=cells[0]; const isNumLead=first&&/^\d+$/.test(first.s);
      const nums=cells.filter(c=>numRe.test(c.s.replace(/,/g,"")));
      const qcut=(colQty!=null?colQty-20:400);
      if(isNumLead&&colRate!=null&&nums.length>=2){
        const descCells=cells.filter(c=>c.x>first.x+2&&c.x<qcut);
        const near=(cx)=>nums.reduce((b,c)=>Math.abs(c.x-cx)<Math.abs((b?b.x:1e9)-cx)?c:b,null);
        const rc=near(colRate), qc=colQty!=null?near(colQty):null;
        cur={ ref:first.s, description:descCells.map(c=>c.s).join(" ").trim(), rate:rc?parseFloat(rc.s.replace(/,/g,"")):0, qty:qc?parseFloat(qc.s.replace(/,/g,"")):1 };
        items.push(cur);
      } else if(cur){ const tc2=cells.filter(c=>c.x<qcut); const extra=tc2.map(c=>c.s).join(" ").trim();
        if(extra&&!isTotals(extra)) cur.description=(cur.description+" "+extra).trim(); }
    }
  }
  items.forEach((it,i)=>{ const m=it.description.match(/\(Per\s+([^)]+)\)/i); it.unit=m?m[1].trim():""; it.ref=String(i+1); });
  return items.filter(it=>it.description&&it.rate>0);
}

// Read the month's check-ins in runs of 10 days (one HR call per day server-side).
async function pullAttendance(m){
  const b=$("#prAtt"); if(b){ b.disabled=true; b.textContent="Reading attendance…"; }
  try{
    let from=m+"-01", first=true, days=0, guard=0;
    while(from&&guard++<6){ const r=await api("ops/attendance/pull",{method:"POST",body:{month:m,from,reset:first}}); first=false; days=r.days; from=r.next; if(b) b.textContent="Reading attendance… "+days+" day(s)"; }
    toast("Attendance read: "+days+" day(s)"); vOps();
  }catch(e){ alert(e.message); vOps(); }
}

  const rows=[...names].sort((a,b)=>(num(att?.sites?.[b])||0)-(num(att?.sites?.[a])||0)||a.localeCompare(b));
  if(!rows.length) return "";
  const opt=(cur)=>`<option value="">— not mapped (stays in HQ)</option><option value="${esc(HQ_NAME)}" ${cur===HQ_NAME?"selected":""}>MA HQ – Operations (office)</option>${d.projects.map(p=>`<option ${cur===p?"selected":""}>${esc(p)}</option>`).join("")}<option value="__ignore" ${cur==="__ignore"?"selected":""}>Ignore (not a work site)</option>`;
  const unmapped=rows.filter(n=>!map[n]&&num(att?.sites?.[n])>0).length;
  return `<div class="card" style="margin:12px 0 0;background:#f8f9fc"><div class="flex" style="flex-wrap:wrap;gap:8px"><h3 style="margin:0">Check-in sites → projects</h3>

    if(!rows.length) throw new Error("No employee rows found in the file.");

var LABEL_SIZE="t3x2";
var LABEL_ROTATE=false;
var LABEL_DIMS={ t3x2:{w:76.2,h:50.8}, t2x3:{w:50.8,h:76.2}, t4x6:{w:100,h:150}, t100x50:{w:100,h:50}, t60x40:{w:60,h:40} };
var LABEL_BC={ t3x2:{height:50,width:2}, t2x3:{height:60,width:1.8}, t4x6:{height:120,width:3}, t100x50:{height:52,width:2.4}, t60x40:{height:42,width:1.8} };
function printAssetLabels(list,size,rotate){
  size=size||LABEL_SIZE||"t3x2";
  rotate = (rotate===undefined) ? LABEL_ROTATE : rotate;
  list=(list||[]).filter(Boolean);
  if(!list.length){ toast("No assets to print"); return; }
  if(typeof JsBarcode==="undefined"){ toast("Barcode library not loaded — refresh and retry"); return; }
  const d=LABEL_DIMS[size]||LABEL_DIMS.t3x2;
  const pw = rotate ? d.h : d.w, ph = rotate ? d.w : d.h;
  $("#labelPage").textContent="@page { size:"+pw+"mm "+ph+"mm; margin:0; }";
  const area=document.getElementById("labelArea");
  area.innerHTML=list.map(a=>{ const inner=`<div class="lbl ${size}">${assetLabelHtml(a)}</div>`;
    return rotate ? `<div class="lblrot" style="width:${pw}mm;height:${ph}mm">${inner}</div>` : inner; }).join("");
  const divs=area.querySelectorAll(".lbl"); const bc=LABEL_BC[size]||LABEL_BC.t3x2;
  list.forEach((a,i)=>{ const svg=divs[i].querySelector("svg.bc"); try{ JsBarcode(svg,a.code,{format:"CODE128",displayValue:false,margin:0,...bc}); }catch(e){} });
  const done=()=>{ document.body.classList.remove("printing-labels"); window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  document.body.classList.add("printing-labels");
  setTimeout(()=>window.print(),60);
}

async function importAssetsExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xlsm,.xls";
  inp.onchange=async ()=>{ const f=inp.files[0]; if(!f) return;
    toast("Reading Excel…");
    try{ await loadScript("xlsx.full.min.js"); }catch(e){ toast("Could not load the Excel reader"); return; }
    let assets=[];
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      const name=wb.SheetNames.find(n=>n.toLowerCase().includes("register"))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:""});
      const toISO=v=>{ if(v instanceof Date) return v.toISOString().slice(0,10); const s=String(v||"").trim(); const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; const m2=s.match(/^\d{4}-\d{2}-\d{2}/); return m2?m2[0]:""; };
      for(const r of rows){ const code=String(r[1]||"").trim();
        if(!/^MAG-[A-Z]{2,3}-\d{3,5}$/.test(code)) continue;
        assets.push({ code, cat:String(r[2]||"").trim(), description:String(r[3]||"").trim(), model:String(r[4]||"").trim(),
          year:String(r[5]||"").trim(), serial:String(r[6]||"").trim(), location:String(r[7]||"").trim(),
          custodian:String(r[8]||"").trim(), owner:String(r[9]||"").trim(), purchaseDate:toISO(r[10]),
          condition:String(r[11]||"").trim(), cost:r[12], life:r[13] });
      }
    }catch(e){ toast("Could not read that file: "+e.message); return; }
    if(!assets.length){ toast("No asset rows found. The sheet needs a column of MAG-XXX-#### codes."); return; }
    if(!confirm(`Found ${assets.length} assets in the file.\n\nImport now? Codes already in the system are skipped (your edits are kept).`)) return;
    try{ const res=await api("assets/import",{method:"POST",body:{assets}}); toast(`Imported ${res.created} new · ${res.updated} updated · ${res.skipped} skipped`); vAssets(); }catch(e){ toast(e.message); }
  };
  inp.click();
}
