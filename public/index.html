/* ---------- cheque diary: what clears / falls due on a given day ----------
   Outgoing = cheques we issued (post-dated included); incoming = client cheques.
   The live bank balance already deducts every issued cheque, so the uncleared
   total is exactly the bridge back to the bank-statement balance. */
let CHQ_FROM="", CHQ_TO="", CHQ_DIR="", CHQ_ST="Due", CHQ_PRESET="month";
function chequeDiary(d){
  const host=$("#chqDiaryCard"); if(!host) return;
  const all=d.cheques||[], sum=d.chequeSummary||{};
  const today=(sum.today||new Date().toISOString().slice(0,10));
  const canClear=["Accounts","CEO"].includes(ME.role);
  const addDays=(iso,n)=>{ const t=new Date(iso+"T00:00:00"); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
  const dow=(iso)=>["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(iso+"T00:00:00").getDay()];
  const monthStart=today.slice(0,8)+"01";
  const monthEnd=(()=>{ const t=new Date(today+"T00:00:00"); return new Date(t.getFullYear(),t.getMonth()+1,0).toISOString().slice(0,10); })();
  if(!CHQ_FROM){ CHQ_FROM=monthStart; CHQ_TO=monthEnd; }
  const ALL=CHQ_PRESET==="all";
  const from=ALL?"0000-01-01":CHQ_FROM, to=ALL?"9999-12-31":(CHQ_TO||CHQ_FROM);
  const label=ALL?"all dates":(from===to?("on "+dmy(from)+" ("+dow(from)+")"):("from "+dmy(from)+" to "+dmy(to)));
  const inWin=c=>c.date&&c.date>=from&&c.date<=to;
  let list=all.filter(c=>inWin(c)&&(!CHQ_DIR||c.dir===CHQ_DIR)&&(!CHQ_ST||c.status===CHQ_ST));
  list.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(b.amount-a.amount));
  const T=(arr,dir,st)=>r2(arr.filter(c=>(!dir||c.dir===dir)&&(!st||c.status===st)).reduce((t,c)=>t+num(c.amount),0));
  const N=(arr,dir,st)=>arr.filter(c=>(!dir||c.dir===dir)&&(!st||c.status===st)).length;
  const win=all.filter(inWin);
  const out=T(list,"out"), inn=T(list,"in");
  // Grand totals across ALL dates — independent of the filters above.
  const gOut=T(all,"out","Due"), gIn=T(all,"in","Due"), gOutN=N(all,"out","Due"), gInN=N(all,"in","Due");
  const gClearedOut=T(all,"out","Cleared"), gRetOut=T(all,"out","Returned"), gRetN=N(all,"out","Returned")+N(all,"in","Returned");
  const ovOut=r2(all.filter(c=>c.dir==="out"&&c.status==="Due"&&c.overdue).reduce((t,c)=>t+num(c.amount),0));
  const byBank={}; list.filter(c=>c.dir==="out").forEach(c=>{ const b=c.bank||"(no account)"; byBank[b]=r2((byBank[b]||0)+num(c.amount)); });
  const balOf=(nm)=>{ const a=(d.accounts||[]).find(x=>x.name===nm); return a?num(a.balance):null; };
  const stPill=c=>c.status==="Cleared"?`<span class="pill" style="background:var(--green);font-size:10px">Cleared${c.clearedAt?" "+dmy(c.clearedAt):""}</span>`
    :c.status==="Returned"?`<span class="pill" style="background:var(--red);font-size:10px">Returned</span>`
    :c.overdue?`<span class="pill" style="background:#b45309;font-size:10px">Due — not cleared</span>`
    :`<span class="pill" style="background:var(--blue);font-size:10px">Due</span>`;
  const nextDays=[...new Set(all.filter(c=>c.status==="Due"&&c.date>=today).map(c=>c.date))].sort().slice(0,8);
  const pre=(k,l,f,t)=>`<button class="btn ${CHQ_PRESET===k?"gold":"ghost"} chqPre" data-k="${k}" data-f="${f}" data-t="${t}" style="padding:4px 10px;font-size:11.5px">${l}</button>`;
  host.innerHTML=`
   <div class="flex" style="flex-wrap:wrap;gap:8px"><h2 style="margin:0">Cheque diary — clearing &amp; due dates</h2>
     <span class="muted">which cheques hit the bank between any two dates</span>
     <button class="btn ghost right" id="chqDiaryCsv">Export CSV</button></div>
   <div class="kpis" style="margin-top:10px">
     <div class="kpi" style="border-top-color:var(--navy)"><div class="v" style="color:var(--navy)">AED ${fmt(gOut)}</div><div class="l">TOTAL uncleared cheques issued — all dates${gOutN?` (${gOutN} cheque${gOutN===1?"":"s"})`:""}</div></div>
     <div class="kpi" style="border-top-color:var(--green)"><div class="v" style="color:var(--green)">AED ${fmt(gIn)}</div><div class="l">TOTAL client cheques not yet cleared${gInN?` (${gInN})`:""}</div></div>
     <div class="kpi" style="border-top-color:#b45309"><div class="v" style="color:#b45309">AED ${fmt(ovOut)}</div><div class="l">Past due — issued, not yet cleared</div></div>
     <div class="kpi" style="border-top-color:var(--red)"><div class="v" style="color:var(--red)">AED ${fmt(sum.dueToday)}</div><div class="l">Due today (${dmy(today)})</div></div>
   </div>
   <div class="note" style="margin-top:8px;font-size:11.5px">The live balance above already deducts every cheque you issued. So your <b>bank-statement balance ≈ live balance + AED ${fmt(gOut)}</b> (issued, not yet presented) <b>− AED ${fmt(gIn)}</b> (client cheques not yet credited). Mark each cheque <b>Cleared</b> as it appears on the statement to keep this exact.${gRetN?` <b style="color:var(--red)">${gRetN} cheque(s) returned</b> — AED ${fmt(gRetOut)}.`:""}</div>
   <div class="flex" style="flex-wrap:wrap;gap:8px;margin-top:12px;align-items:flex-end">
     <div><label style="font-size:11px">From date</label><input type="date" id="chqFrom" value="${esc(CHQ_FROM)}" ${ALL?"disabled":""}></div>
     <div><label style="font-size:11px">To date</label><input type="date" id="chqTo" value="${esc(CHQ_TO)}" ${ALL?"disabled":""}></div>
     <div><label style="font-size:11px">Direction</label><select id="chqDir">
       <option value="" ${!CHQ_DIR?"selected":""}>Out &amp; in</option>
       <option value="out" ${CHQ_DIR==="out"?"selected":""}>Issued by us (out)</option>
       <option value="in" ${CHQ_DIR==="in"?"selected":""}>Received from clients (in)</option></select></div>
     <div><label style="font-size:11px">Status</label><select id="chqSt">
       <option value="Due" ${CHQ_ST==="Due"?"selected":""}>Due / not cleared</option>
       <option value="Cleared" ${CHQ_ST==="Cleared"?"selected":""}>Cleared</option>
       <option value="Returned" ${CHQ_ST==="Returned"?"selected":""}>Returned</option>
       <option value="" ${CHQ_ST===""?"selected":""}>Any status</option></select></div>
   </div>
   <div class="flex" style="flex-wrap:wrap;gap:6px;margin-top:8px">
     ${pre("today","Today",today,today)}
     ${pre("tom","Tomorrow",addDays(today,1),addDays(today,1))}
     ${pre("week","Next 7 days",today,addDays(today,6))}
     ${pre("month","This month",monthStart,monthEnd)}
     ${pre("next30","Next 30 days",today,addDays(today,29))}
     ${pre("past","Past due (before today)","0000-01-01",addDays(today,-1))}
     ${pre("all","All dates","","")}
   </div>
   ${nextDays.length?`<div class="flex" style="flex-wrap:wrap;gap:6px;margin-top:8px"><span class="muted" style="font-size:11px">Next dates with cheques due:</span>
     ${nextDays.map(dt=>{ const dOut=r2(all.filter(c=>c.date===dt&&c.status==="Due"&&c.dir==="out").reduce((t,c)=>t+num(c.amount),0));
        const dIn=r2(all.filter(c=>c.date===dt&&c.status==="Due"&&c.dir==="in").reduce((t,c)=>t+num(c.amount),0));
        return `<button class="btn ${(!ALL&&from===dt&&to===dt)?"gold":"ghost"} chqJump" data-d="${dt}" style="padding:4px 9px;font-size:11px">${dmy(dt)}${dOut?` · −${fmt(dOut)}`:""}${dIn?` · +${fmt(dIn)}`:""}</button>`; }).join("")}</div>`:""}
   <div style="margin-top:10px;overflow-x:auto">
     <table><tr><th>Due date</th><th>Day</th><th>Dir.</th><th>Cheque No.</th><th>Bank account</th><th>Payee / party</th><th>Project</th><th>Cert / ref</th><th class="num">Amount (AED)</th><th>Status</th>${canClear?"<th></th>":""}</tr>
     ${list.length?list.map(c=>`<tr${c.overdue&&c.status==="Due"?' style="background:#fff8ec"':''}>
        <td style="white-space:nowrap"><b>${c.date?dmy(c.date):"—"}</b></td><td class="muted" style="font-size:11px">${c.date?dow(c.date):""}</td>
        <td>${c.dir==="out"?'<span style="color:var(--red)">OUT</span>':'<span style="color:var(--green)">IN</span>'}</td>
        <td>${esc(c.ref||"—")}</td><td>${esc(c.bank||"—")}</td><td><b>${esc(c.party||"—")}</b></td>
        <td class="muted" style="font-size:11px">${esc(c.project||"—")}</td><td class="muted" style="font-size:11px">${esc(c.certNo||"—")}</td>
        <td class="num" style="color:${c.dir==="out"?"var(--red)":"var(--green)"}">${c.dir==="out"?"−":"+"} ${fmt(c.amount)}</td>
        <td>${stPill(c)}</td>
        ${canClear?`<td style="white-space:nowrap">${c.status==="Due"
           ?`<button class="btn ghost chqClear" data-k="${esc(c.key)}" data-d="${esc(c.date)}" style="padding:3px 8px;font-size:11px">Mark cleared</button> <a href="#" class="chqRet" data-k="${esc(c.key)}" style="color:var(--red);font-size:11px">returned</a>`
           :`<a href="#" class="chqUndo" data-k="${esc(c.key)}" style="font-size:11px;color:#6b7280">undo</a>`}</td>`:""}
      </tr>`).join("")
      :`<tr><td colspan="${canClear?11:10}" class="muted">No cheques ${esc(label)}${CHQ_ST?" with status "+esc(CHQ_ST):""}.</td></tr>`}
     ${list.length?`<tr class="tot"><td colspan="8"><b>TOTAL ${esc(label)} — ${list.length} cheque${list.length===1?"":"s"}</b></td><td class="num"><b>${out?"−"+fmt(out):""}${out&&inn?" / ":""}${inn?"+"+fmt(inn):""}</b></td><td colspan="${canClear?2:1}"></td></tr>`:""}
     </table></div>
   <div style="margin-top:10px;overflow-x:auto"><b style="font-size:12px;color:var(--navy)">Totals ${esc(label)}</b>
     <table style="margin-top:4px"><tr><th>Status</th><th class="num">Cheques issued (out)</th><th class="num">Client cheques (in)</th><th class="num">Net</th></tr>
       ${["Due","Cleared","Returned"].map(st=>{ const o=T(win,"out",st), i2=T(win,"in",st), no=N(win,"out",st), ni=N(win,"in",st);
         if(!o&&!i2) return ""; return `<tr><td>${st==="Due"?"Due / not cleared":st}</td><td class="num" style="color:var(--red)">${fmt(o)}${no?` <span class="muted">(${no})</span>`:""}</td><td class="num" style="color:var(--green)">${fmt(i2)}${ni?` <span class="muted">(${ni})</span>`:""}</td><td class="num">${fmt(r2(i2-o))}</td></tr>`; }).join("")}
       <tr class="tot"><td><b>All statuses in this period</b></td><td class="num"><b>${fmt(T(win,"out",""))}</b></td><td class="num"><b>${fmt(T(win,"in",""))}</b></td><td class="num"><b>${fmt(r2(T(win,"in","")-T(win,"out","")))}</b></td></tr>
       <tr><td class="lab"><b>GRAND TOTAL — uncleared, all dates</b></td><td class="num" style="color:var(--red)"><b>${fmt(gOut)}</b> <span class="muted">(${gOutN})</span></td><td class="num" style="color:var(--green)"><b>${fmt(gIn)}</b> <span class="muted">(${gInN})</span></td><td class="num"><b>${fmt(r2(gIn-gOut))}</b></td></tr>
       <tr><td class="lab">Cleared to date (all dates)</td><td class="num">${fmt(gClearedOut)}</td><td class="num">${fmt(T(all,"in","Cleared"))}</td><td class="num"></td></tr>
     </table></div>
   ${Object.keys(byBank).length?`<div style="margin-top:10px"><b style="font-size:12px;color:var(--navy)">Funding required per account — ${esc(label)}</b>
     <table style="margin-top:4px"><tr><th>Account</th><th class="num">Cheques out in this period</th><th class="num">Live balance (already net of them)</th><th>Cover</th></tr>
     ${Object.keys(byBank).sort().map(bk=>{ const bal=balOf(bk); const ok=bal==null?null:(bal>=0);
       return `<tr><td>${esc(bk)}</td><td class="num" style="color:var(--red)">${fmt(byBank[bk])}</td><td class="num" style="color:${ok===false?"var(--red)":"inherit"}">${bal==null?"—":fmt(bal)}</td><td>${ok==null?'<span class="muted">account not set</span>':ok?'<span style="color:var(--green)">✓ funded</span>':'<span style="color:var(--red)">⚠ short — fund the account</span>'}</td></tr>`;}).join("")}
     </table>
     <div class="muted" style="font-size:11px;margin-top:4px">These cheques are already deducted from the live balance, so a positive balance means the account can meet them. A negative balance means the account must be funded before the cheques are presented.</div></div>`:""}`;
  const rerender=()=>{ CHQ_DIR=$("#chqDir").value; CHQ_ST=$("#chqSt").value;
    if(!ALL){ CHQ_FROM=$("#chqFrom").value||CHQ_FROM; CHQ_TO=$("#chqTo").value||CHQ_FROM;
      if(CHQ_TO<CHQ_FROM){ CHQ_TO=CHQ_FROM; toast("‘To’ date cannot be before ‘From’ — adjusted"); }
      CHQ_PRESET=""; }
    chequeDiary(d); };
  ["chqFrom","chqTo","chqDir","chqSt"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=rerender; });
  host.querySelectorAll(".chqPre").forEach(b=>b.onclick=()=>{ CHQ_PRESET=b.dataset.k;
    if(b.dataset.k!=="all"){ CHQ_FROM=b.dataset.f; CHQ_TO=b.dataset.t; } chequeDiary(d); });
  host.querySelectorAll(".chqJump").forEach(b=>b.onclick=()=>{ CHQ_PRESET=""; CHQ_FROM=b.dataset.d; CHQ_TO=b.dataset.d; chequeDiary(d); });
  const setSt=async (key,status,clearedAt)=>{ try{ await api("cheque/status",{method:"POST",body:{key,status,clearedAt}}); toast(status==="Due"?"Reset to due":"Marked "+status.toLowerCase()); vBank(); }catch(e){ toast(e.message); } };
  host.querySelectorAll(".chqClear").forEach(b=>b.onclick=()=>{ const dt=prompt("Date the cheque cleared the bank (YYYY-MM-DD):", b.dataset.d||today); if(dt===null) return; setSt(b.dataset.k,"Cleared",dt.trim()||today); });
  host.querySelectorAll(".chqRet").forEach(a=>a.onclick=e=>{ e.preventDefault(); if(!confirm("Mark this cheque as RETURNED / bounced?")) return; setSt(a.dataset.k,"Returned",today); });
  host.querySelectorAll(".chqUndo").forEach(a=>a.onclick=e=>{ e.preventDefault(); setSt(a.dataset.k,"Due",""); });
  $("#chqDiaryCsv").onclick=()=>{ const rows=[["Due date","Direction","Cheque No.","Bank","Payee/Party","Project","Cert","Amount","Status","Cleared on"]]
      .concat(list.map(c=>[c.date,c.dir==="out"?"OUT":"IN",c.ref,c.bank,c.party,c.project,c.certNo,c.amount,c.status,c.clearedAt||""]))
      .concat([[],["TOTAL "+label,"","","","","","",r2(inn-out),"",""],["GRAND TOTAL uncleared (all dates) OUT","","","","","","",gOut,"",""],["GRAND TOTAL uncleared (all dates) IN","","","","","","",gIn,"",""]]);
    const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="MA_Cheque_Diary_"+(ALL?"all":from+"_to_"+to)+".csv"; a.click(); };
}

          <button class="btn ghost aw_view" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">View / Print</button>
          <button class="btn ghost aw_dl" data-id="${esc(a.id)}" data-no="${esc(a.docNo)}" style="padding:4px 9px;font-size:12px">⤓ PDF</button>
          ${a.status!=="Countersigned"?`<button class="btn ghost aw_edit" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">Edit / amend</button>`:""}
          <button class="btn ghost aw_send" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">${a.status==="Issued"?"Send by email":"Re-send"}</button>
          ${a.status!=="Countersigned"?`<button class="btn ghost aw_recv" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">Mark signed →</button>`:""}
          ${(a.status==="Countersigned"&&+a.advanceAmount>0&&!a.advanceCertNo)?`<button class="btn gold aw_adv" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">Process down payment</button>`:""}
          ${(a.status==="Countersigned"&&!(+a.advanceAmount>0&&!a.advanceCertNo))?`<button class="btn ghost aw_sync" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px">Sync to supplier</button>`:""}
          ${a.advanceCertNo?`<button class="btn ghost aw_openipc" style="padding:4px 9px;font-size:12px">Open IPCs →</button>`:""}
          ${ME.role==="CEO"?`<button class="btn ghost aw_del" data-id="${esc(a.id)}" style="padding:4px 9px;font-size:12px;color:var(--red)">Delete</button>`:""}
        </td></tr>`).join("")}</table></div>`;
    h.querySelectorAll(".aw_view").forEach(b=>b.onclick=()=>openAwardDoc(b.dataset.id,true));
    h.querySelectorAll(".aw_dl").forEach(b=>b.onclick=()=>downloadServerDoc("award/"+b.dataset.id+"/html", b.dataset.no||"Award"));
    h.querySelectorAll(".aw_edit").forEach(b=>b.onclick=async ()=>{ try{ const rec=await api("award/"+b.dataset.id); AW_EDIT=rec; await vAwards(); window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ toast(e.message); } });
    h.querySelectorAll(".aw_send").forEach(b=>b.onclick=async ()=>{ const a=items.find(x=>x.id===b.dataset.id); if(!confirm(`Email this ${a.type==="LOA"?"Letter of Award":"Subcontract Agreement"} to ${esc(a.supplierName)} for signature within ${a.signBackHours||24} hours?`)) return;
      try{
        toast("Preparing PDF…"); let pdfBase64="", pdfName="";
        try{ const html=await apiText("award/"+b.dataset.id+"/html"); pdfBase64=await htmlToPdfBase64(html); pdfName=((a.docNo||"Award").replace(/[^A-Za-z0-9._-]+/g,"_"))+".pdf"; }
        catch(e){ if(!confirm("Could not build the PDF attachment ("+e.message+"). Send the email without the PDF attached?")) return; }
        toast("Sending…"); const r=await api("award/"+b.dataset.id+"/send",{method:"POST",body:{pdfBase64,pdfName}}); toast("Sent to "+r.to+(r.attached?" (PDF attached)":"")); const d=await api("award/list"); renderList(d.items);
      }catch(e){ toast(e.message); } });
    h.querySelectorAll(".aw_recv").forEach(b=>b.onclick=async ()=>{ const a=items.find(x=>x.id===b.dataset.id); const hasAdv=+a.advanceAmount>0;
      if(!confirm(`Mark ${a.docNo} as signed & returned?\n\nThis will:\n• copy the contract terms (value, advance recovery, retention, DLP) onto the supplier\n${hasAdv?`• create the down-payment certificate for AED ${fmt(a.advanceAmount)} + 5% VAT (draft, ready to approve & pay)`:"• (no advance on this contract)"}\n• progress IPCs will then auto-apply advance recovery & retention`)) return;
      try{ toast("Processing…"); const r=await api("award/"+b.dataset.id+"/received",{method:"POST"});
        toast(r.advanceCreated?("Signed · down payment "+r.advanceCertNo+" created"):"Signed · supplier terms synced");
        const d=await api("award/list"); renderList(d.items);
        if(r.advanceCreated) setTimeout(()=>alert("Down payment certificate "+r.advanceCertNo+" created as a draft.\nGo to Supplier IPCs to approve & pay it. Progress IPCs you raise afterwards will recover the advance automatically."),100);

    h.querySelectorAll(".aw_adv").forEach(b=>b.onclick=async ()=>{ const a=items.find(x=>x.id===b.dataset.id);
      if(!confirm(`Create the down-payment certificate for ${a.docNo} — AED ${fmt(a.advanceAmount)} + 5% VAT?`)) return;
      try{ toast("Processing…"); const r=await api("award/"+b.dataset.id+"/process-advance",{method:"POST"}); toast(r.advanceCreated?("Down payment "+r.advanceCertNo+" created"):(r.already?"Already created":"Terms synced")); const d=await api("award/list"); renderList(d.items); }catch(e){ toast(e.message); } });
    h.querySelectorAll(".aw_sync").forEach(b=>b.onclick=async ()=>{ const a=items.find(x=>x.id===b.dataset.id);
      if(!confirm(`Apply ${a.docNo}'s terms (contract value, retention, advance recovery, DLP) to ${esc(a.supplierName)} so IPCs treat it as a fixed contract?`)) return;
      try{ toast("Syncing…"); const r=await api("award/"+b.dataset.id+"/process-advance",{method:"POST"}); await load().catch(()=>{}); toast(r.advanceCreated?("Synced · down payment "+r.advanceCertNo+" created"):"Supplier synced — raise IPCs now"); const d=await api("award/list"); renderList(d.items); }catch(e){ toast(e.message); } });
    h.querySelectorAll(".aw_openipc").forEach(b=>b.onclick=()=>{ VIEW="certs"; CUR=null; render(); });
    h.querySelectorAll(".aw_del").forEach(b=>b.onclick=async ()=>{ if(!confirm("Delete this award document? This cannot be undone.")) return;

  renderList(data.items);
  if(AW_PRESEL){ const sel=$("#aw_sup"); if(sel){ sel.value=AW_PRESEL; const sp=supById(AW_PRESEL); if(sp&&sp.project&&$("#aw_proj")) $("#aw_proj").value=sp.project; } AW_PRESEL=""; }
  if(AW_PREFILL){ const p=AW_PREFILL; if(p.amount&&$("#aw_amt")){ $("#aw_amt").value=p.amount; typeBadge&&typeBadge(); } if(p.project&&$("#aw_proj")) $("#aw_proj").value=p.project; if(p.scopeTitle&&$("#aw_stitle")) $("#aw_stitle").value=p.scopeTitle; if(p.scope&&$("#aw_scope")) $("#aw_scope").value=p.scope; AW_PREFILL=null; }
  const typeBadge=()=>{ const amt=+$("#aw_amt").value||0; const el=$("#aw_type"); if(!el) return; if(!amt){ el.textContent="— enter amount —"; el.style.color="#8a8a8a"; return; }
    if(amt<AWARD_THRESHOLD){ el.innerHTML='LETTER OF AWARD <span class="muted" style="font-weight:400">(below threshold)</span>'; el.style.color="#2E75B6"; }
    else { el.innerHTML='SUBCONTRACT AGREEMENT <span class="muted" style="font-weight:400">(≥ threshold)</span>'; el.style.color="#375623"; } };
  $("#aw_amt").oninput=typeBadge;
  // Prefill some fields from the selected supplier's linked project, if any.
  const awSupInfo=()=>{ const s=supById($("#aw_sup").value); const box=$("#aw_supinfo"); if(!box) return;
    if(!s){ box.style.display="none"; return; }
    if(s.project&&!$("#aw_proj").value) $("#aw_proj").value=s.project;
    // Prefill advance + retention from the supplier record.
    if($("#aw_adv")) $("#aw_adv").value=(+s.advanceAmount||0);
    if($("#aw_advrec")) $("#aw_advrec").value=s.advanceRecoveryRate?Math.round(s.advanceRecoveryRate*1000)/10:0;
    if($("#aw_ret")) $("#aw_ret").value=(s.retentionPct!=null?Math.round(s.retentionPct*1000)/10:10);
    if($("#aw_dlp")) $("#aw_dlp").value=(s.dlpMonths?Math.round(s.dlpMonths*30.44):365);
    const miss=[]; if(!String(s.licenseNo||"").trim())miss.push("Trade Licence"); if(!String(s.trn||"").trim())miss.push("TRN"); if(!String(s.email||"").trim())miss.push("Email");
    box.style.display="";
    box.innerHTML=`<b>Auto-filled from supplier record:</b> ${esc(s.name)} · TL ${esc(s.licenseNo||"—")} · TRN ${esc(s.trn||"—")} · ${esc(s.email||"—")}${(+s.advanceAmount>0)?` · advance AED ${fmt(s.advanceAmount)} @ ${pct(s.advanceRecoveryRate||0)} recovery`:""}${miss.length?`<br><span style="color:var(--red)">⚠ missing on the supplier record: ${miss.join(", ")} — complete it in Suppliers so the document is not blank.</span>`:""}`;
  };
  $("#aw_sup").onchange=()=>{ if(!AW_EDIT) awSupInfo(); else awSupInfo(); };
  awSupInfo();
  // When the amount crosses the threshold, default the performance-security instrument
  // to a bank guarantee for agreements and an undated cheque for small LOAs.
  const defPerfType=()=>{ if(AW_EDIT) return; const amt=+$("#aw_amt").value||0; const sel=$("#aw_perftype"); if(sel) sel.value=(amt>=AWARD_THRESHOLD?"guarantee":"cheque"); };
  // UAE best practice: recover the advance pro-rata at the same % it was given, so
  // it clears exactly by completion. Auto-suggest that rate when recovery is left blank.
  const defAdvRec=()=>{ if(AW_EDIT) return; const adv=+$("#aw_adv").value||0, amt=+$("#aw_amt").value||0, cur=+$("#aw_advrec").value||0;
    if(adv>0 && amt>0 && !cur){ $("#aw_advrec").value = Math.round(adv/amt*1000)/10; } };
  const prevAmtIn=$("#aw_amt").oninput; $("#aw_amt").oninput=()=>{ if(prevAmtIn) prevAmtIn(); defPerfType(); defAdvRec(); };
  if($("#aw_adv")) $("#aw_adv").addEventListener("input",defAdvRec);
  // ----- amend mode: prefill the whole form from the record being edited -----
  if(AW_EDIT){ const r=AW_EDIT;
    const setv=(id,v)=>{ const el=$("#"+id); if(el!=null&&v!=null) el.value=v; };
    setv("aw_sup",r.supplierId); setv("aw_ent",r.entity); setv("aw_amt",r.amount); setv("aw_proj",r.project);
    setv("aw_loc",r.location); setv("aw_client",r.client); setv("aw_qref",r.quotationRef); setv("aw_qdate",(r.quotationDate||"").slice(0,10));
    setv("aw_stitle",r.scopeTitle); setv("aw_scope",r.scope); setv("aw_cdays",r.commenceDays); setv("aw_comp",(r.completion||"").slice(0,10));
    setv("aw_ret",r.retentionPct); setv("aw_dd",r.delayPctPerDay); setv("aw_dc",r.delayCapPct); setv("aw_retcap",r.retentionCapPct!=null?r.retentionCapPct:5);
    setv("aw_dlp",r.dlpDays); setv("aw_pay",r.paymentDays); setv("aw_hrs",r.signBackHours);
    setv("aw_perftype",r.perfSecurityType||"guarantee"); setv("aw_perf",r.performancePct!=null?r.performancePct:10);
    setv("aw_secdays",r.securityDeliveryDays!=null?r.securityDeliveryDays:7); setv("aw_perfval",r.perfValidity||"");
    setv("aw_bondtype",r.perfBondType||"none"); setv("aw_bondpct",r.performanceBondPct!=null?r.performanceBondPct:0);
    setv("aw_adv",r.advanceAmount||0); setv("aw_advrec",r.advanceRecoveryPct||0); setv("aw_advguar",r.advGuaranteeType||"guarantee");
    typeBadge();
    const btn=$("#aw_gen"); if(btn) btn.textContent="Save amendment";
    const bar=$("#aw_editbar"); if(bar){ bar.style.display=""; bar.innerHTML=`<b>Amending ${esc(r.docNo)}</b> (${r.type==="LOA"?"Letter of Award":"Subcontract Agreement"}, status: ${esc(r.status)}) — make your changes and click <b>Save amendment</b>. <a href="#" id="aw_cancel">Cancel</a>`;
      $("#aw_cancel").onclick=(e)=>{ e.preventDefault(); AW_EDIT=null; vAwards(); }; }
  }
  $("#aw_gen").onclick=async ()=>{
    const supplierId=$("#aw_sup").value, amount=+$("#aw_amt").value||0;
    if(!supplierId){ toast("Select a supplier / subcontractor"); return; }
    if(amount<=0){ toast("Enter the award / quotation amount"); return; }
    const body={ supplierId, amount, entity:$("#aw_ent").value, project:$("#aw_proj").value.trim(), location:$("#aw_loc").value.trim(), client:$("#aw_client").value.trim(),
      quotationRef:$("#aw_qref").value.trim(), quotationDate:$("#aw_qdate").value, scopeTitle:$("#aw_stitle").value.trim(), scope:$("#aw_scope").value.trim(),
      commenceDays:+$("#aw_cdays").value||7, completion:$("#aw_comp").value, retentionPct:+$("#aw_ret").value||10, delayPctPerDay:+$("#aw_dd").value||0.5, delayCapPct:+$("#aw_dc").value||10,
      retentionCapPct:+$("#aw_retcap").value||0, performancePct:+$("#aw_perf").value||10, perfSecurityType:$("#aw_perftype").value, perfValidity:$("#aw_perfval").value.trim(),
      securityDeliveryDays:+$("#aw_secdays").value||7, advGuaranteeType:$("#aw_advguar").value,
      perfBondType:$("#aw_bondtype").value, performanceBondPct:+$("#aw_bondpct").value||0,
      dlpDays:+$("#aw_dlp").value||365, paymentDays:+$("#aw_pay").value||30, signBackHours:+$("#aw_hrs").value||24,
      advanceAmount:+$("#aw_adv").value||0, advanceRecoveryPct:+$("#aw_advrec").value||0 };
    const editing=AW_EDIT;
    try{ toast(editing?"Saving…":"Generating…");
      const rec=await api(editing?("award/"+editing.id+"/update"):"award/generate",{method:"POST",body});
      toast(rec.docNo+(editing?" amended":" created")+" ("+(rec.type==="LOA"?"Letter of Award":"Subcontract Agreement")+")");
      AW_EDIT=null;
      const d=await api("award/list"); renderList(d.items); openAwardDoc(rec.id,false);
    }catch(e){ toast(e.message); }
  };
}

/* ---------- procurement (vendor directory + RFQ / inquiry) ---------- */
let PROC={vendors:[],trades:[]}, PROC_TAB="dir", PROC_SEL=new Set(), RFQS=[], RFQ_CUR=null, RFQ_DRAFT=null;
async function vProc(){
  if(!["CEO","PM","QS"].includes(ME.role)){ $("#main").innerHTML=`<div class="card muted">Procurement is available to commercial roles only.</div>`; return; }
  $("#main").innerHTML=`<div class="card"><div class="muted">Loading procurement…</div></div>`;
  try{ const [meta,pv,rq]=await Promise.all([api("procurement/meta"),api("pvendors"),api("rfqs")]);
    PROC.vendors=pv.items||[]; PROC.trades=pv.trades||[]; PROC.meta=meta; RFQS=rq.items||[];
  }catch(e){ $("#main").innerHTML=`<div class="card">${esc(e.message)}</div>`; return; }
  const sub=(k,l)=>`<button class="btn ${PROC_TAB===k?'gold':'ghost'}" onclick="PROC_TAB='${k}';RFQ_CUR=null;vProc()">${l}</button>`;
  const withEmailN=PROC.vendors.filter(v=>/@/.test(v.email||"")).length, regN=PROC.vendors.filter(v=>v.supplierId).length;
  $("#main").innerHTML=`<div class="card"><div class="flex"><h2 style="margin:0">Procurement</h2>
     <span class="muted">${PROC.vendors.length} vendors · ${regN} registered · ${withEmailN} with email · ${PROC.trades.length} trades</span>
     <div class="right flex" style="gap:6px">${sub("dir","Directory")}${sub("issue","Issue Inquiry")}${sub("rfqs","Inquiries ("+RFXcount()+")")}${sub("evals","Evaluation ("+EVALcount()+")")}</div></div>
   </div><div id="proc_body"></div>`;
  if(PROC_TAB==="dir") procDir();
  else if(PROC_TAB==="issue") procIssue();
  else if(PROC_TAB==="evals") procEvals();
  else procRfqs();
}
function RFXcount(){ return RFQS.filter(r=>r.status!=="Awarded"&&r.status!=="Cancelled").length; }
function procVById(id){ return PROC.vendors.find(v=>v.id===id); }

function procDir(){
  const b=$("#proc_body");
  const trades=[...new Set(PROC.vendors.map(v=>v.trade))].sort();
  const emirates=[...new Set(PROC.vendors.map(v=>v.emirate).filter(Boolean))].sort();
  b.innerHTML=`<div class="card">
    <div class="flex" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <select id="pdTrade" style="max-width:230px"><option value="">All trades</option>${trades.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
      <select id="pdType"><option value="">All types</option><option>Supplier</option><option>Subcontractor</option><option>Both</option></select>
      <select id="pdEmail"><option value="">Email: any</option><option value="1">Has email</option><option value="0">No email</option></select>
      <select id="pdReg"><option value="">All vendors</option><option value="1">Registered suppliers</option><option value="0">Directory only</option></select>
      <input id="pdQ" placeholder="Search name / specialty / phone…" style="max-width:240px">
      <div class="right flex" style="gap:6px"><button class="btn ghost" id="pdAdd">+ Add vendor</button>
        <button class="btn gold" id="pdMakeRfq">Create inquiry from selected (<span id="pdSelN">0</span>)</button></div>
    </div>
    <div id="pdList" class="muted">…</div></div>`;
  const render=()=>{
    const tr=$("#pdTrade").value, ty=$("#pdType").value, em=$("#pdEmail").value, rg=$("#pdReg").value, q=($("#pdQ").value||"").toLowerCase();
    let list=PROC.vendors.filter(v=>(!tr||v.trade===tr)&&(!ty||v.type===ty||(ty!=="Both"&&v.type==="Both"))
      &&(em===""||(em==="1"?/@/.test(v.email||""):!/@/.test(v.email||"")))
      &&(rg===""||(rg==="1"?!!v.supplierId:!v.supplierId))
      &&(!q||((v.name+" "+v.specialty+" "+v.phone+" "+v.whatsapp+" "+v.emirate+" "+v.contactName).toLowerCase().includes(q))));
    $("#pdList").classList.remove("muted");
    $("#pdList").innerHTML=`<div class="muted" style="margin-bottom:6px">${list.length} of ${PROC.vendors.length}</div>
      <div style="overflow-x:auto"><table><tr><th></th><th>Vendor</th><th>Trade</th><th>Specialty</th><th>Contact</th><th>Phone</th><th>Email</th><th>Emirate</th><th>Type</th><th></th></tr>
      ${list.map(v=>`<tr class="click" data-v="${esc(v.id)}"><td><input type="checkbox" class="pdChk" data-id="${esc(v.id)}" ${PROC_SEL.has(v.id)?"checked":""} onclick="event.stopPropagation()"></td>
        <td><b>${esc(v.name)}</b>${v.supplierId?` <span class="pill" style="background:#375623;font-size:9px">registered</span>`:""}</td>
        <td>${esc(v.trade)}</td><td class="muted" style="max-width:220px">${esc(v.specialty||"—")}</td>
        <td>${esc(v.contactName||"—")}</td><td>${esc(v.phone||v.whatsapp||"—")}</td>
        <td>${/@/.test(v.email||"")?esc(v.email):`<span style="color:var(--red)">✗ none</span>`}</td>
        <td>${esc(v.emirate||"—")}</td><td>${esc(v.type)}</td>
        <td><a href="#" data-del="${esc(v.id)}" title="delete">✕</a></td></tr>`).join("")}</table></div>`;
    $("#pdList").querySelectorAll("[data-v]").forEach(r=>r.onclick=e=>{ if(e.target.dataset.del||e.target.classList.contains("pdChk"))return; procVendorForm(procVById(r.dataset.v)); });
    $("#pdList").querySelectorAll(".pdChk").forEach(c=>c.onchange=()=>{ if(c.checked)PROC_SEL.add(c.dataset.id); else PROC_SEL.delete(c.dataset.id); $("#pdSelN").textContent=PROC_SEL.size; });
    $("#pdList").querySelectorAll("[data-del]").forEach(a=>a.onclick=async e=>{ e.preventDefault();e.stopPropagation(); if(ME.role!=="CEO"){toast("Only the CEO can delete a vendor");return;} const v=procVById(a.dataset.del); if(!confirm("Delete vendor "+(v?v.name:"")+"?"))return; try{ await api("pvendor/"+a.dataset.del,{method:"DELETE"}); PROC.vendors=PROC.vendors.filter(x=>x.id!==a.dataset.del); render(); }catch(x){toast(x.message);} });
    $("#pdSelN").textContent=PROC_SEL.size;
  };
  ["pdTrade","pdType","pdEmail","pdReg","pdQ"].forEach(id=>$("#"+id).addEventListener("input",render));
  $("#pdAdd").onclick=()=>procVendorForm(null);
  $("#pdMakeRfq").onclick=()=>{ if(!PROC_SEL.size){toast("Tick the vendors first, or use Issue Inquiry and pick a trade");return;} RFQ_DRAFT={vendorIds:[...PROC_SEL], trade:(procVById([...PROC_SEL][0])||{}).trade||""}; PROC_TAB="issue"; vProc(); };
  render();
}
function procVendorForm(v){
  const isNew=!v; v=v||{type:"Supplier",status:"Active",trade:"General Trading / Materials"};
  const b=$("#proc_body");
  const tradeOpts=PROC.trades.map(t=>`<option ${t===v.trade?"selected":""}>${esc(t)}</option>`).join("");
  b.innerHTML=`<div class="card"><h3 style="margin-top:0">${isNew?"Add vendor":"Edit vendor"}</h3>
    <div class="grid">
      <div style="grid-column:1/-1"><label>Company name *</label><input id="pv_name" value="${esc(v.name||"")}"></div>
      <div><label>Trade / category</label><select id="pv_trade">${tradeOpts}</select></div>
      <div><label>Type</label><select id="pv_type"><option ${v.type==="Supplier"?"selected":""}>Supplier</option><option ${v.type==="Subcontractor"?"selected":""}>Subcontractor</option><option ${v.type==="Both"?"selected":""}>Both</option></select></div>
      <div style="grid-column:1/-1"><label>Specialty / trade detail</label><input id="pv_specialty" value="${esc(v.specialty||"")}"></div>
      <div><label>Contact person</label><input id="pv_contactName" value="${esc(v.contactName||"")}"></div>
      <div><label>Phone</label><input id="pv_phone" value="${esc(v.phone||"")}"></div>
      <div><label>WhatsApp</label><input id="pv_whatsapp" value="${esc(v.whatsapp||"")}"></div>
      <div><label>Email</label><input id="pv_email" value="${esc(v.email||"")}"></div>
      <div><label>Website</label><input id="pv_website" value="${esc(v.website||"")}"></div>
      <div><label>Emirate / area</label><input id="pv_emirate" value="${esc(v.emirate||"")}"></div>
      <div><label>Status</label><select id="pv_status"><option ${v.status==="Active"?"selected":""}>Active</option><option ${v.status==="On Hold"?"selected":""}>On Hold</option><option ${v.status==="Blacklisted"?"selected":""}>Blacklisted</option></select></div>
      <div style="grid-column:1/-1"><label>Notes</label><input id="pv_notes" value="${esc(v.notes||"")}"></div>
    </div>

function procEvalForm(){

  const V=quoted.map(q=>{ const prev=(ev.vendors||[]).find(x=>x.vendorId===q.vendorId)||{}; const pv=procVById(q.vendorId)||{};

      quoted:prev.quoted!==undefined?num(prev.quoted):num(q.amount), discount:num(prev.discount), adjustment:num(prev.adjustment),
      vatIncl:prev.vatIncl!==undefined?!!prev.vatIncl:!!q.vatIncl,
      leadTime:prev.leadTime||q.leadTime||"", validity:prev.validity||q.validity||"", paymentTerms:prev.paymentTerms||q.paymentTerms||"",

  const evaluated=v=>r2(num(v.quoted)-num(v.discount)+num(v.adjustment));

  const weighted=v=>v.excluded?0:r2(CR.reduce((a,c)=>a+scoreOf(v,c)/10*num(c.weight),0));
  const secScore=(v,sec)=>v.excluded?0:r2(CR.filter(c=>c.section===sec).reduce((a,c)=>a+scoreOf(v,c)/10*num(c.weight),0));
  const prequalOk=v=>!Object.values(v.prequal||{}).some(x=>x==="fail");
  b.innerHTML=`<div class="card"><div class="flex"><h3 style="margin:0">Evaluation — ${esc(r.rfqNo)}</h3>

  </div>`;
  $("#ev_back").onclick=()=>{ RFQ_CUR=null; PROC_TAB="evals"; vProc(); };
  const dis=locked?"disabled":"";
  const drawPq=()=>{ $("#ev_pq").innerHTML=`<table><tr><th style="min-width:260px">Requirement</th>${V.map(v=>`<th style="text-align:center">${esc(v.vendorName)}</th>`).join("")}</tr>
    ${EVAL_PREQUAL.map(p=>`<tr><td class="lab">${esc(p.label)}</td>${V.map((v,i)=>`<td style="text-align:center"><select data-pq="${i}" data-k="${p.key}" ${dis} style="width:80px">
      <option value="" ${!v.prequal[p.key]?"selected":""}>—</option><option value="pass" ${v.prequal[p.key]==="pass"?"selected":""}>Pass</option><option value="na" ${v.prequal[p.key]==="na"?"selected":""}>N/A</option><option value="fail" ${v.prequal[p.key]==="fail"?"selected":""}>Fail</option></select></td>`).join("")}</tr>`).join("")}
    <tr class="tot"><td><b>Prequalification result</b></td>${V.map(v=>`<td style="text-align:center"><b style="color:${prequalOk(v)?"#2E7D32":"#c00"}">${prequalOk(v)?"QUALIFIED":"DISQUALIFIED"}</b></td>`).join("")}</tr></table>`;
    $("#ev_pq").querySelectorAll("[data-pq]").forEach(sel=>sel.onchange=()=>{ V[+sel.dataset.pq].prequal[sel.dataset.k]=sel.value; drawPq(); drawRes(); }); };
  const drawComm=()=>{ const lo=lowest(), bud=num($("#ev_budget").value);

      ${V.map((v,i)=>{ const e=evaluated(v); const dv=lo>0&&e>0?r2(e-lo):0;
        return `<tr${v.excluded?` style="opacity:.5"`:""}><td><b>${esc(v.vendorName)}</b>${e===lo&&!v.excluded&&e>0?` <span class="pill" style="background:#2E7D32;font-size:9px">lowest</span>`:""}${!prequalOk(v)?` <span class="pill" style="background:#C00000;font-size:9px">disqualified</span>`:""}</td>
        <td class="num"><input type="number" step="0.01" data-c="${i}" data-f="quoted" value="${v.quoted||""}" style="width:110px;text-align:right" ${dis}></td>
        <td class="num"><input type="number" step="0.01" data-c="${i}" data-f="discount" value="${v.discount||""}" style="width:90px;text-align:right" ${dis}></td>
        <td class="num"><input type="number" step="0.01" data-c="${i}" data-f="adjustment" value="${v.adjustment||""}" style="width:90px;text-align:right" ${dis}></td>
        <td class="num"><b>${fmt(e)}</b></td>
        <td class="num" style="color:${dv>0?"#c00":"#2E7D32"}">${dv>0?"+"+fmt(dv)+" ("+(lo>0?r2(dv/lo*100):0).toFixed(1)+"%)":"—"}</td>
        ${bud>0?`<td class="num" style="color:${e>bud?"#c00":"#2E7D32"}">${e>bud?"+":"−"}${fmt(Math.abs(r2(e-bud)))}</td>`:""}
        <td><input data-c="${i}" data-f="leadTime" value="${esc(v.leadTime)}" style="width:90px" ${dis}></td>

    $("#ev_comm").querySelectorAll("[data-c]").forEach(inp=>inp.onchange=()=>{ const v=V[+inp.dataset.c], f=inp.dataset.f;

      else if(["quoted","discount","adjustment"].includes(f)) v[f]=num(inp.value); else v[f]=inp.value;

  const drawScores=()=>{ const sec=s=>CR.filter(c=>c.section===s);

    const totW=r2(CR.reduce((a,c)=>a+num(c.weight),0));

      <tr><td class="sec navy" colspan="${2+V.length}">TECHNICAL / CAPABILITY</td></tr>${rows("technical")}
      <tr class="tot"><td><b>Weighted score (out of 100)</b></td><td style="text-align:center;color:${Math.abs(totW-100)>0.01?"#c00":"inherit"}"><b>${totW}%</b></td>${V.map(v=>`<td style="text-align:center"><b>${weighted(v).toFixed(1)}</b></td>`).join("")}</tr>
      <tr><td class="lab">↳ commercial / technical split</td><td></td>${V.map(v=>`<td style="text-align:center;font-size:11px">${secScore(v,"commercial").toFixed(1)} / ${secScore(v,"technical").toFixed(1)}</td>`).join("")}</tr></table>
      ${Math.abs(totW-100)>0.01?`<div class="note" style="border-color:#C00000;color:#c00;margin-top:6px">Weights currently total ${totW}% — they must total 100% before the evaluation can be saved.</div>`:""}`;
    $("#ev_sc").querySelectorAll("[data-s]").forEach(inp=>inp.onchange=()=>{ V[+inp.dataset.s].scores[inp.dataset.k]=Math.max(0,Math.min(10,num(inp.value))); drawScores(); drawRes(); });
    $("#ev_sc").querySelectorAll("[data-w]").forEach(inp=>inp.onchange=()=>{ const c=CR.find(x=>x.key===inp.dataset.w); if(c) c.weight=num(inp.value); drawScores(); drawRes(); }); };
  const drawRes=()=>{ const ranked=V.filter(v=>!v.excluded).slice().sort((a,c)=>weighted(c)-weighted(a));
    const lo=lowest(); const lowV=V.filter(v=>!v.excluded&&evaluated(v)>0).sort((a,c)=>evaluated(a)-evaluated(c))[0];
    const recId=$("#ev_rec").value||(ranked[0]?ranked[0].vendorId:"");

    $("#ev_nlWrap").style.display=nl?"":"none";

      ${ranked.map((v,i)=>`<tr${v.vendorId===recId?` style="background:#eef4ec"`:""}><td class="num"><b>${i+1}</b></td><td><b>${esc(v.vendorName)}</b>${v.vendorId===recId?` <span class="pill" style="background:#375623;font-size:9px">RECOMMENDED</span>`:""}${evaluated(v)===lo?` <span class="pill" style="background:#2E7D32;font-size:9px">lowest</span>`:""}</td><td class="num">${fmt(evaluated(v))}</td><td class="num">${secScore(v,"technical").toFixed(1)}</td><td class="num">${secScore(v,"commercial").toFixed(1)}</td><td class="num"><b>${weighted(v).toFixed(1)}</b></td><td style="color:${prequalOk(v)?"#2E7D32":"#c00"}">${prequalOk(v)?"Qualified":"Disqualified"}</td></tr>`).join("")}

  $("#ev_rec").onchange=drawRes;

function printEvalSheet(r){

// Downscale pictures in the browser so a phone photo (5–10 MB) becomes a
// web-ready JPEG (≤ 1600 px) before it is stored and sent to the platforms.
function mktShrink(file){ return new Promise((res,rej)=>{ if(!/^image\//.test(file.type)){ const r=new FileReader(); r.onload=()=>res({name:file.name,data:r.result}); r.onerror=rej; r.readAsDataURL(file); return; }
  const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const max=1600; let w=img.width,h=img.height; if(w>max||h>max){ const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); } const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res({name:file.name.replace(/\.[^.]+$/,"")+".jpg",data:c.toDataURL("image/jpeg",0.86)}); }; img.onerror=rej; img.src=u; }); }

  const MEDIA=media;
  const count=()=>{ const t=($("#mk_body").value+" "+$("#mk_tags").value).trim(); const n=t.length; const chs=[...el.querySelectorAll(".mk-ch:checked")].map(x=>x.value); const warn=chs.filter(c=>MKT_LIMITS[c]&&n>MKT_LIMITS[c]).map(c=>mktChName(c)+" limit "+MKT_LIMITS[c]); $("#mk_count").innerHTML=`${n} characters${warn.length?' · <b style="color:var(--red)">too long for '+esc(warn.join(", "))+'</b>':""}`; $("#mk_prev").textContent=[$("#mk_body").value,$("#mk_link").value,$("#mk_tags").value].filter(Boolean).join("\n\n"); };

  el.querySelectorAll("[data-rm]").forEach(a=>a.onclick=e=>{ e.preventDefault(); MEDIA.splice(+a.dataset.rm,1); p.media=MEDIA; renderMktForm(el,p); });
  const ff=$("#mk_file"); if(ff) ff.onchange=async()=>{ for(const f of ff.files){ if(MEDIA.length>=4){ toast("Maximum 4 pictures"); break; } try{ const m=await mktShrink(f); MEDIA.push({name:m.name,data:m.data,preview:m.data,type:m.data.slice(5,m.data.indexOf(";"))}); }catch(e){ toast("Could not read "+f.name); } } p.media=MEDIA; renderMktForm(el,p); };
  const gather=(status)=>({ id:p.id, title:$("#mk_title").value.trim(), type:$("#mk_type").value, campaign:$("#mk_camp").value.trim(), project:$("#mk_proj").value, channels:[...el.querySelectorAll(".mk-ch:checked")].map(x=>x.value), body:$("#mk_body").value, hashtags:$("#mk_tags").value.trim(), link:$("#mk_link").value.trim(), emailSubject:$("#mk_subj").value.trim(), audienceId:$("#mk_aud").value, waTemplate:$("#mk_tpl").value.trim(), waLang:$("#mk_lang").value.trim()||"en", scheduledAt:$("#mk_when").value?new Date($("#mk_when").value).toISOString():"", status:status||p.status||"Draft", media:MEDIA.map((m,i)=>m.keep?{keep:true,i:m.i}:{name:m.name,data:m.data}) });
  const save=async(status,msg)=>{ try{ const r=await api("mkt/post",{method:"POST",body:gather(status)}); toast(msg||"Saved"); await openMktPost(r.id); }catch(e){ toast(e.message); } };
  const setStatus=async(status,note)=>{ try{ const body={status}; if(status==="Scheduled"){ const w=$("#mk_when").value; if(!w){ toast("Set the schedule date & time first"); return; } if(!ro) await api("mkt/post",{method:"POST",body:gather()}); body.scheduledAt=new Date(w).toISOString(); } if(note!==undefined) body.note=note; await api("mkt/post/"+p.id+"/status",{method:"POST",body}); toast("Status: "+status); await openMktPost(p.id); }catch(e){ toast(e.message); } };
  const act=$("#mk_actions"); const B=(id,l,cls)=>`<button class="btn ${cls||"ghost"}" id="${id}">${l}</button>`;

  if(p.id&&mktCan.approve()&&["Approved","Scheduled","Failed"].includes(p.status)) h+=B("mkSched","Schedule at the set time");
  if(p.id&&mktCan.publish()&&["Approved","Scheduled","Failed","Published"].includes(p.status)&&(p.channels||[]).some(c=>["linkedin","instagram","facebook"].includes(c)&&!(p.published&&p.published[c]))) h+=B("mkPub","Publish now (social)","gold");
  for(const c of (p.channels||[])) if(p.id&&mktCan.publish()&&["whatsapp","email"].includes(c)&&["Approved","Scheduled","Failed","Published"].includes(p.status)&&!(p.published&&p.published[c])) h+=B("mkSend_"+c,"Send "+mktChName(c),"gold");
  if(p.id&&mktCan.approve()&&["Review","Approved","Scheduled"].includes(p.status)) h+=B("mkReject","Send back to draft");
  if(p.id&&mktCan.approve()&&p.status!=="Cancelled"&&p.status!=="Published") h+=B("mkCancel","Cancel post");
  if(p.id&&mktCan.approve()) h+=`<button class="btn danger right" id="mkDel">Delete</button>`;
  act.innerHTML=h||`<span class="muted">Read only.</span>`;
  const on=(id,fn)=>{ const b=$("#"+id); if(b) b.onclick=fn; };
  on("mkSave",()=>save());
  on("mkReview",async()=>{ if(!p.id){ try{ const r=await api("mkt/post",{method:"POST",body:gather("Review")}); toast("Sent for CEO review"); await openMktPost(r.id); }catch(e){ toast(e.message); } } else { await api("mkt/post",{method:"POST",body:gather()}).catch(e=>toast(e.message)); setStatus("Review"); } });
  on("mkApprove",()=>setStatus("Approved"));
  on("mkSched",()=>setStatus("Scheduled"));
  on("mkReject",()=>{ const n=prompt("Note for the marketing team (optional):")||""; setStatus("Draft",n); });
  on("mkCancel",()=>{ if(confirm("Cancel this post?")) setStatus("Cancelled"); });
  on("mkDel",()=>adminDeleteMkt(p));
  on("mkPub",async()=>{ if(!confirm("Publish now to: "+(p.channels||[]).filter(c=>["linkedin","instagram","facebook"].includes(c)).map(mktChName).join(", ")+"?\n\nThis goes live on the company's official accounts.")) return; try{ const r=await api("mkt/post/"+p.id+"/publish",{method:"POST",body:{}}); const bad=Object.entries(r.results).filter(([,v])=>!v.ok); toast(bad.length?"Some channels failed — see per-channel status":"Published"); await openMktPost(p.id); }catch(e){ alert(e.message); } });
  for(const c of ["whatsapp","email"]){ on("mkSend_"+c,async()=>{ const aud=$("#mk_aud").value; if(!aud){ toast("Choose an audience first"); return; } if(!ro) await api("mkt/post",{method:"POST",body:gather()}).catch(()=>{}); if(!confirm("Send this post by "+mktChName(c)+" to the selected audience?\n\nMessages go out from the company's official "+(c==="email"?"mailbox":"WhatsApp number")+".")) return; const b=$("#mkSend_"+c); b.disabled=true; let tot=0, fail=0, guard=0; try{ while(guard++<200){ const r=await api("mkt/post/"+p.id+"/broadcast",{method:"POST",body:{channel:c,audienceId:aud,batch:25}}); tot=r.doneTotal; fail+=r.failed; b.textContent=`Sending… ${tot}/${r.total}`; if(!r.remaining) break; } toast(`Done — ${tot} sent${fail?", "+fail+" failed":""}`); }catch(e){ alert(e.message); } await openMktPost(p.id); }); }
}
async function adminDeleteMkt(p){ if(!confirm("Delete "+p.id+" permanently?")) return; try{ await api("mkt/post/"+p.id,{method:"DELETE"}); toast("Deleted"); MKT_TAB="posts"; MKT_EDIT=null; vMarketing(); }catch(e){ toast(e.message); } }
function renderMktAudiences(el){
  const d=MKT;
  el.innerHTML=`<div class="flex" style="flex-wrap:wrap;gap:8px"><span class="muted">Built-in audiences come live from the system (clients, suppliers, staff from the HR system). Custom lists can be typed or imported from Excel / CSV (columns: Name, Email, Phone, Company).</span>${mktCan.edit()?`<button class="btn gold right" id="audNew">+ New list</button>`:""}</div>

   ${d.builtIn.map(a=>`<tr><td><b>${esc(a.name)}</b> <span class="pill st-Draft" style="font-size:9px">live</span></td><td class="num">—</td><td>—</td><td><a href="#" data-view="${a.id}">preview</a></td></tr>`).join("")}
   ${d.audiences.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="num">${a.count}</td><td>${dmy(a.updatedAt)}</td><td><a href="#" data-view="${a.id}">open</a>${mktCan.approve()?` · <a href="#" data-del="${a.id}" style="color:var(--red)">delete</a>`:""}</td></tr>`).join("")}</table>
   <div id="audBox" style="margin-top:12px"></div>`;
  const box=$("#audBox");
  const show=async(id)=>{ box.innerHTML=`<div class="muted">Loading…</div>`; try{ const a=await api("mkt/audience/"+id); const rows=a.contacts||[]; box.innerHTML=`<div class="card" style="margin:0"><div class="flex"><h3 style="margin:0">${esc(a.name||id)} · ${rows.length} contact(s)</h3>${a.builtIn?"":mktCan.edit()?`<button class="btn ghost right" id="audEdit">Edit list</button>`:""}<button class="btn ghost ${a.builtIn?"right":""}" id="audCsv">Export CSV</button></div>
      <div style="overflow-x:auto;max-height:340px;overflow-y:auto"><table><tr><th>Name</th><th>E-mail</th><th>Phone</th><th>Company</th></tr>${rows.slice(0,500).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email||"")}</td><td>${esc(c.phone||"")}</td><td>${esc(c.company||"")}</td></tr>`).join("")}</table></div>
      <div class="muted" style="font-size:11px;margin-top:4px">${rows.filter(c=>c.email).length} with e-mail · ${rows.filter(c=>c.phone).length} with WhatsApp-capable phone.</div></div>`;
      $("#audCsv").onclick=()=>exportCsv("MA_Audience_"+id+".csv",["Name","Email","Phone","Company"],rows.map(c=>[c.name,c.email,c.phone,c.company]));
      const ed=$("#audEdit"); if(ed) ed.onclick=()=>editAudience(a); }catch(e){ box.innerHTML=`<div class="muted">${esc(e.message)}</div>`; } };
  const editAudience=(a)=>{ a=a||{name:"",contacts:[]}; box.innerHTML=`<div class="card" style="margin:0"><h3 style="margin:0 0 6px">${a.id?"Edit":"New"} list</h3>
     <div class="grid"><div><label>List name</label><input id="au_name" value="${esc(a.name)}" placeholder="e.g. Developers & consultants"></div><div><label>Import Excel / CSV</label><input type="file" id="au_file" accept=".csv,.xlsx,.xls"></div></div>
     <label>Contacts — one per line: Name, Email, Phone, Company</label><textarea id="au_txt" rows="10" style="font-family:monospace;font-size:12px">${esc((a.contacts||[]).map(c=>[c.name,c.email,c.phone,c.company].join(", ")).join("\n"))}</textarea>
     <div class="flex" style="gap:8px;margin-top:8px"><button class="btn gold" id="au_save">Save list</button><button class="btn ghost" id="au_cancel">Cancel</button><span class="muted" style="font-size:11px">Only contacts who agreed to receive company updates. Phones are stored in international format (971…).</span></div></div>`;
    const parse=()=>$("#au_txt").value.split(/\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim())).filter(r=>r.some(Boolean)).map(r=>({name:r[0]||"",email:r[1]||"",phone:r[2]||"",company:r[3]||""}));
    $("#au_file").onchange=async()=>{ const f=$("#au_file").files[0]; if(!f) return; try{ const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"}); const rr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}); const hi=rr.findIndex(r=>r.some(c=>/mail|phone|name/i.test(String(c)))); const H=hi>=0?rr[hi].map(h=>String(h).toLowerCase()):[]; const col=(...ks)=>{ for(const k of ks){ const i=H.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; }; const C={n:col("name","contact"),e:col("mail"),p:col("phone","mobile","whatsapp"),c:col("company","organisation","organization")}; const rows=rr.slice(hi+1).filter(r=>r.some(Boolean)).map(r=>[C.n>=0?r[C.n]:r[0],C.e>=0?r[C.e]:r[1],C.p>=0?r[C.p]:r[2],C.c>=0?r[C.c]:r[3]].map(x=>String(x||"").trim()).join(", ")); $("#au_txt").value=($("#au_txt").value.trim()?$("#au_txt").value.trim()+"\n":"")+rows.join("\n"); toast(rows.length+" rows added"); }catch(e){ toast("Could not read file: "+e.message); } };
    $("#au_save").onclick=async()=>{ try{ const r=await api("mkt/audience",{method:"POST",body:{id:a.id,name:$("#au_name").value.trim(),contacts:parse()}}); toast("Saved · "+r.count+" contacts"); MKT_TAB="audiences"; vMarketing(); }catch(e){ toast(e.message); } };

  const nb=$("#audNew"); if(nb) nb.onclick=()=>editAudience(null);

async function vAnnounce(){
  if(!["CEO","HR","Marketing"].includes(ME.role)){ $("#main").innerHTML=`<div class="card muted">Announcements are available to the CEO, HR &amp; Admin and Marketing.</div>`; return; }
  $("#main").innerHTML=`<div class="card"><div class="muted">Loading…</div></div>`;
  let rc={withEmail:0,missingEmail:0,total:0}, hist={items:[]};
  try{ [rc,hist]=await Promise.all([api("announcement/recipients"),api("announcement/list")]); }catch(e){}
  const catOpts=ANN_CATS.map(c=>`<option>${esc(c)}</option>`).join("");
  $("#main").innerHTML=`
   <div class="card">
     <div class="flex"><h2 style="margin:0">Broadcast announcement</h2>
       <span class="right muted" style="font-size:12px">Recipients hidden in BCC · privacy protected</span></div>
     <div class="note" style="margin:8px 0">This sends one email to <b>all active suppliers &amp; subcontractors</b>. Every recipient is placed in <b>BCC</b>, so no vendor can see another vendor's email address. The most recent announcement is also sent automatically to any newly registered vendor.</div>
     <div class="kpis" style="margin:6px 0 14px">
       <div class="kpi"><div class="v">${rc.withEmail||0}</div><div class="l">Will receive (valid email)</div></div>
       <div class="kpi ${rc.missingEmail?'alert':''}"><div class="v">${rc.missingEmail||0}</div><div class="l">Skipped — no email on file</div></div>
       <div class="kpi"><div class="v">${rc.total||0}</div><div class="l">Total registered vendors</div></div>
     </div>
     <div class="grid">
       <div><label>Category</label><select id="anCat">${catOpts}</select></div>
       <div><label>Subject line</label><input id="anSubj" placeholder="e.g. Monthly Payment Submittal Cut-off — Action Required"></div>
     </div>
     <div style="margin-top:10px"><label>Message</label>
       <textarea id="anBody" rows="11" style="width:100%;font-family:inherit" placeholder="Write your announcement here. Leave a blank line between paragraphs."></textarea></div>
     <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px"><input type="checkbox" id="anAuto" checked> Automatically send this to newly registered suppliers/subcontractors (keeps it as the standing notice for new vendors)</label>
     <div class="flex" style="margin-top:14px;gap:10px">
       <button class="btn ghost" id="anTpl">Insert payment-cycle template</button>
       <button class="btn ghost" id="anTest">Send test to me</button>
       <span class="right"></span>
       <button class="btn green" id="anSend">Send to all suppliers &amp; subcontractors</button>
     </div>
   </div>
   <div class="card"><h2 style="margin:0 0 8px">Announcement history</h2>
     <div id="anHist"></div></div>`;
  const renderHist=(items)=>{ const h=$("#anHist"); if(!h) return;
    if(!items||!items.length){ h.innerHTML=`<div class="muted">No announcements sent yet.</div>`; return; }
    h.innerHTML=`<div style="overflow-x:auto"><table><tr><th>Date</th><th>Category</th><th>Subject</th><th class="num">Recipients</th><th>Auto to new</th><th>By</th></tr>
      ${items.map(a=>`<tr class="click anRow" data-id="${esc(a.id)}"><td>${dmy(a.sentAt)} ${esc(String(a.sentAt||"").slice(11,16))}</td><td>${esc(a.category||"")}</td><td>${esc(a.subject||"")}</td><td class="num">${a.recipientCount||0}${a.totalTargets&&a.totalTargets!==a.recipientCount?" / "+a.totalTargets:""}</td><td>${a.autoNew!==false?'<span style="color:var(--green)">Yes</span>':'No'}</td><td>${esc(a.sentBy||"")}</td></tr>`).join("")}</table></div>`;
    h.querySelectorAll(".anRow").forEach(r=>r.onclick=()=>{ const a=items.find(x=>x.id===r.dataset.id); if(!a) return; $("#anCat").value=a.category; $("#anSubj").value=a.subject; $("#anBody").value=a.body; toast("Loaded into the composer — edit and resend if needed"); window.scrollTo({top:0,behavior:"smooth"}); });
  };
  renderHist(hist.items);
  $("#anTpl").onclick=()=>{ const c=$("#anCat").value; const t=ANN_TEMPLATES[c]||ANN_TEMPLATES["Payment & Certification"]; $("#anBody").value=t; if(!$("#anSubj").value) $("#anSubj").value="Monthly Payment Submittal Cut-off — Action Required"; };
  $("#anTest").onclick=async ()=>{ const category=$("#anCat").value, subject=$("#anSubj").value.trim(), body=$("#anBody").value.trim();
    if(subject.length<3||body.length<5){ toast("Enter a subject and message first"); return; }
    try{ toast("Sending test…"); const r=await api("announcement/send",{method:"POST",body:{category,subject,body,test:true}}); toast("Test sent to "+r.to); }catch(e){ toast(e.message); } };
  $("#anSend").onclick=async ()=>{ const category=$("#anCat").value, subject=$("#anSubj").value.trim(), body=$("#anBody").value.trim(), autoNew=$("#anAuto").checked;
    if(subject.length<3){ toast("Enter a subject line"); return; }
    if(body.length<5){ toast("Enter the announcement message"); return; }
    if(!confirm(`Send this announcement to ${rc.withEmail||0} supplier(s)/subcontractor(s)?\n\nAll recipients will be in BCC (hidden from each other).`)) return;
    try{ toast("Broadcasting…"); const r=await api("announcement/send",{method:"POST",body:{category,subject,body,autoNew}});
      toast(`Sent to ${r.recipientCount} recipient(s)`); const h=await api("announcement/list"); renderHist(h.items);
    }catch(e){ toast(e.message); } };
}

// Client-side recalculation of the stats for the filtered subset
function srRecalc(items){
  const open=items.filter(x=>x.open), closed=items.filter(x=>x.status==="Closed");
  const rt=items.filter(x=>x.respondedAt&&x.reportedAt).map(x=>(new Date(x.respondedAt)-new Date(String(x.reportedAt).length<=10?x.reportedAt+"T09:00":x.reportedAt))/3600e3);
  const kt=closed.filter(x=>x.completedAt&&x.reportedAt).map(x=>(new Date(x.completedAt)-new Date(String(x.reportedAt).length<=10?x.reportedAt+"T09:00":x.reportedAt))/864e5);
  const avg=a=>a.length?r2(a.reduce((t,v)=>t+v,0)/a.length):0;
  return { total:items.length, open:open.length, closed:closed.length,
    overdue:open.filter(x=>x.responseOverdue||x.rectifyOverdue).length,
    emergencyOpen:open.filter(x=>x.priority==="Emergency").length,
    inScope:items.filter(x=>x.liability==="in-scope").length,
    outOfScope:items.filter(x=>x.liability==="out-of-scope").length,
    awaitingVerdict:items.filter(x=>x.open&&!x.liability).length,
    chargeableValue:r2(items.filter(x=>x.liability==="out-of-scope").reduce((t,x)=>t+num(x.quoteTotal),0)),
    approvedChargeable:r2(items.filter(x=>x.quoteApprovedAt).reduce((t,x)=>t+num(x.quoteTotal),0)),
    backCharges:r2(items.reduce((t,x)=>t+num(x.backChargeAmount),0)),
    avgResponseHrs:avg(rt), avgRectifyDays:avg(kt),
    slaResponseMet:items.filter(x=>x.responseMet===true).length,
    slaResponseTotal:items.filter(x=>x.responseMet!==null).length };
}

// Corporate documents paginate themselves into A4 pages (repeated letterhead on
// page 2+, "Page N of M"). Wait for that before opening the print dialog.
function waitPaginateThenPrint(w){
  let n=0;
  const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
  const tick=()=>{ let ready=false; try{ ready=!!w.MAPG_DONE||!!(w.document&&w.document.querySelector(".mapg")); }catch(e){ ready=true; }
    if(ready||n++>60) setTimeout(go,120); else setTimeout(tick,80); };
  setTimeout(tick,150);
}

     <div style="grid-column:1/-1"><label>Retention release statement <span class="muted">(no amounts — wording only)</span></label><input id="hc_retentionDue" value="${esc(r.retentionDue||"")}" placeholder="e.g. Final retention to be released in accordance with the contract"></div>`:""}
     ${isW?`<div><label>Warranty start (completion date)</label><input id="hc_dlpStart" type="date" value="${esc((r.dlpStart||"").slice(0,10))}"></div>
     <div><label>Warranty end</label><input id="hc_dlpEnd" type="date" value="${esc((r.dlpEnd||"").slice(0,10))}"></div>
     <div><label>Warranty period (text)</label><input id="hc_warrantyPeriod" value="${esc(r.warrantyPeriod||"12 months")}" placeholder="e.g. 12 months / 1 year"></div>`:""}
   </div>
   <h3>Scope of works</h3>
   <div style="overflow-x:auto"><table id="hcScope"><tr><th>#</th><th>Description</th><th>Unit</th><th>Qty</th><th>Status</th><th></th></tr>${scope.map(srow).join("")}</table></div>
   <div class="flex" style="margin-top:6px"><button class="btn ghost" id="hcAddRow">+ Add line</button></div>
   <div class="note" style="margin-top:10px">This is a <b>technical completion document</b> — no contract values, rates or amounts are shown on the certificate or the report. Commercial matters remain in the payment certificates and invoices.</div>
   <h3>Declaration — editable clauses</h3>
   <div class="muted" style="font-size:11px;margin-bottom:6px">Placeholders {COMPLETION_DATE}, {DLP_START}, {DLP_END} are replaced automatically on the printed certificate.${isDlp?"":" The acceptance-without-reservation / variation clause protects against later scope claims — edit with care."}</div>
   ${clauses.map((c,i)=>`<div style="margin-bottom:6px"><label>Clause ${i+1}</label><textarea class="hc_clause" style="width:100%;min-height:58px">${esc(c)}</textarea></div>`).join("")}
   <div><label>Remarks / exceptions (optional — printed on the certificate)</label><input id="hc_notes" value="${esc(r.notes||"")}"></div>
   ${r.id?`<h3 style="margin-top:14px">Completion report — photos</h3>
   <div class="muted" style="font-size:11.5px;margin-bottom:6px">Upload site photos of the completed works — the system builds a professional <b>Project Completion Report</b> (executive summary, project &amp; contract details, scope completed, photographic record, completion statement) with your signature &amp; stamp. It prints as its own document and is <b>attached to the email together with the certificate</b>.</div>
   <div style="margin-bottom:6px"><label>Report executive summary (optional — written automatically from the project details if left blank)</label><textarea id="hc_reportIntro" style="width:100%;min-height:52px">${esc(r.reportIntro||"")}</textarea></div>
   <div id="hcPhotos" class="flex" style="flex-wrap:wrap;gap:10px;margin-top:4px"></div>
   <div class="flex" style="gap:8px;margin-top:6px"><button class="btn ghost" id="hcAddPh" type="button">+ Upload photos</button><input id="hcPhFile" type="file" accept="image/*" multiple style="display:none"><span class="muted" id="hcPhMsg" style="font-size:11px"></span></div>`
   :`<div class="note" style="margin-top:10px">Save the draft first, then upload the report photos.</div>`}
   <div style="height:14px"></div>
   <div class="flex" style="gap:10px;flex-wrap:wrap">
     ${canEdit?`<button class="btn green" id="hcSave">${isNew?"Save as draft":"Save changes"}</button>`:""}
     ${r.id&&canEdit&&r.status==="Draft"?`<button class="btn" id="hcSubmit" style="background:var(--navy);color:#fff">Submit — mark as Issued</button>`:""}
     ${r.id&&ME.role==="CEO"&&r.status!=="Draft"?`<button class="btn ghost" id="hcReopen">Reopen to draft 🔒</button>`:""}
     ${r.id?`<button class="btn" id="hcPrint">View / Print certificate</button>`:""}
     ${r.id?`<button class="btn" id="hcReport">View / Print report</button>`:""}
     ${r.id?`<button class="btn ghost" id="hcDl">⤓ Download PDF (certificate + report)</button>`:""}
     ${r.id&&canEdit?`<button class="btn gold" id="hcSend">Email to party (certificate + report PDF)</button>`:""}
     ${r.id&&ME.role==="CEO"?`<button class="btn red" id="hcDel">Delete</button>`:""}
   </div>
   ${r.id&&r.status==="Draft"?`<div class="muted" style="font-size:11px;margin-top:6px">This is a <b>Draft</b> — edit freely. <b>Submit</b> marks it Issued (official register); emailing it also issues it automatically.</div>`:""}</div>`;
  $("#hcBack").onclick=vCompCerts;
  // prefill pickers
  (async ()=>{ try{ if(!CONTRACTS.length) CONTRACTS=await api("contracts"); }catch(e){}
    const pc=$("#hc_pickC"); if(pc) pc.innerHTML=`<option value="">—</option>`+CONTRACTS.map(c=>`<option value="${esc(c.id)}">${esc(c.project)} — ${esc(c.clientName||"")}</option>`).join("");
    const ps=$("#hc_pickS"); if(ps) ps.innerHTML=`<option value="">—</option>`+SUPS.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
    if(pc) pc.onchange=async ()=>{ const ct=CONTRACTS.find(x=>x.id===pc.value); if(!ct) return;
      $("#hc_ptype").value="Client"; $("#hc_partyName").value=ct.clientName||ct.mainContractor||""; $("#hc_project").value=ct.project||"";
      $("#hc_contractRef").value=ct.subcontractRef||""; $("#hc_quotationRef").value=ct.offerRef||"";
      try{ const cl=await api("clients"); const c2=cl.find(x=>x.id===ct.clientId); if(c2){ $("#hc_partyTrn").value=c2.trn||""; $("#hc_partyEmail").value=c2.email||""; $("#hc_partyAttn").value=c2.contactName||""; } }catch(e){} };
    if(ps) ps.onchange=()=>{ const sp=SUPS.find(x=>x.id===ps.value); if(!sp) return;
      $("#hc_ptype").value="Subcontractor"; $("#hc_partyName").value=sp.name||""; $("#hc_partyTrn").value=sp.trn||"";
      $("#hc_partyEmail").value=sp.email||""; $("#hc_partyAttn").value=sp.contactName||""; $("#hc_project").value=sp.project||$("#hc_project").value;
      $("#hc_contractRef").value=sp.lpoRef||sp.subcontractRef||""; }; })();
  const bindDel=()=>document.querySelectorAll(".hc_sdel").forEach(a=>a.onclick=e=>{ e.preventDefault(); a.closest("tr").remove(); }); bindDel();
  $("#hcAddRow").onclick=()=>{ const t=$("#hcScope"); const tr=document.createElement("tr"); tr.innerHTML=srow({ref:String(t.rows.length),description:"",unit:"",qty:"",status:"Completed"},t.rows.length-1); t.appendChild(tr); bindDel(); };
  const gather=()=>{ const g=id=>{const el=$("#hc_"+id); return el?el.value:"";};
    const sc=[...$("#hcScope").querySelectorAll("tr")].slice(1).map(tr=>({ ref:tr.querySelector(".hc_sref").value, description:tr.querySelector(".hc_sdesc").value, unit:tr.querySelector(".hc_sunit").value, qty:tr.querySelector(".hc_sqty").value, status:tr.querySelector(".hc_sst").value })).filter(l=>l.description.trim());
    return { id:r.id, type:isW?"WARRANTY":isDlp?"DLP":"COMPLETION", docNo:g("docNo"), date:g("date"), entity:g("ent"),
      partyType:g("ptype"), partyName:g("partyName"), partyTrn:g("partyTrn"), partyAttn:g("partyAttn"), partyEmail:g("partyEmail"),
      cc:String(g("cc")||"").split(/[,;\s]+/).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)),
      project:g("project"), location:g("location"), contractRef:g("contractRef"), contractDate:g("contractDate"),
      quotationRef:g("quotationRef"), quotationDate:g("quotationDate"), completionDate:g("completionDate"),
      dlpStart:g("dlpStart"), dlpEnd:g("dlpEnd"), retentionDue:g("retentionDue"), warrantyPeriod:g("warrantyPeriod"),
      scope:sc,
      clauses:[...document.querySelectorAll(".hc_clause")].map(t=>t.value), notes:g("notes"), reportIntro:g("reportIntro") }; };
  // ---- report photos ----
  const renderPhotos=()=>{ const host=$("#hcPhotos"); if(!host) return;
    const ph=Array.isArray(r.photos)?r.photos:[];
    host.innerHTML=ph.length?ph.map((p,i)=>`<div style="width:172px;border:1px solid #e3e7ee;border-radius:6px;overflow:hidden;background:#fff">
      <img src="${p.dataUrl}" style="width:100%;height:112px;object-fit:cover;display:block">
      <div style="padding:5px"><input class="phCap" data-i="${i}" value="${esc(p.caption||"")}" placeholder="caption (e.g. Reception — completed)" style="width:100%;font-size:11px">
      <a href="#" class="phDel" data-i="${i}" style="color:#c00;font-size:11px">remove</a></div></div>`).join("")
     :`<span class="muted">No photos yet — click "+ Upload photos".</span>`;
    host.querySelectorAll(".phDel").forEach(a=>a.onclick=async e=>{ e.preventDefault(); if(!confirm("Remove this photo?"))return;
      try{ await api("compcert/"+r.id+"/photo",{method:"POST",body:{removeIndex:+a.dataset.i}}); r=await api("compcert/"+r.id); renderPhotos(); }catch(e2){ toast(e2.message); } });
    host.querySelectorAll(".phCap").forEach(inp=>inp.onchange=async ()=>{ try{ await api("compcert/"+r.id+"/photo",{method:"POST",body:{captionIndex:+inp.dataset.i,caption:inp.value}}); if(r.photos&&r.photos[+inp.dataset.i]) r.photos[+inp.dataset.i].caption=inp.value; }catch(e2){ toast(e2.message); } }); };
  if(r.id&&$("#hcAddPh")){ renderPhotos();
    $("#hcAddPh").onclick=()=>$("#hcPhFile").click();
    $("#hcPhFile").onchange=async ()=>{ const files=[...$("#hcPhFile").files]; if(!files.length)return;
      const msg=$("#hcPhMsg"); let done=0;
      for(const f of files){ msg.textContent="Uploading "+(++done)+"/"+files.length+"…";
        await new Promise(res=>fileToDataUrl(f,async d=>{ try{ await api("compcert/"+r.id+"/photo",{method:"POST",body:{dataUrl:d,name:f.name}}); }catch(e2){ toast(f.name+": "+e2.message); } res(); })); }
      msg.textContent=""; $("#hcPhFile").value="";
      try{ r=await api("compcert/"+r.id); }catch(e2){}
      renderPhotos(); toast("Photos uploaded"); }; }
  if($("#hcReport")) $("#hcReport").onclick=async ()=>{ try{ const html=await apiText("compcert/"+r.id+"/report"); const w=window.open("","_blank"); if(!w){ toast("Allow pop-ups to view the report"); return; } w.document.open(); w.document.write(html); w.document.close(); waitPaginateThenPrint(w); }catch(e){ toast(e.message); } };
  if($("#hcSave")) $("#hcSave").onclick=async ()=>{ try{ const saved=await api("compcert",{method:"POST",body:gather()}); toast(saved.docNo+" saved"+(saved.status==="Draft"?" as draft":"")); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcSubmit")) $("#hcSubmit").onclick=async ()=>{ if(!confirm("Submit "+(r.docNo||"this certificate")+" and mark it as ISSUED? It becomes part of the official register."))return;
    try{ const saved=await api("compcert",{method:"POST",body:{...gather(),status:"Issued"}}); toast(saved.docNo+" issued"); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcReopen")) $("#hcReopen").onclick=async ()=>{ if(!confirm("Reopen "+(r.docNo||"this certificate")+" to Draft for editing?"))return;
    try{ const saved=await api("compcert",{method:"POST",body:{...gather(),status:"Draft"}}); toast(saved.docNo+" reopened to draft"); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcPrint")) $("#hcPrint").onclick=()=>openCompCertDoc(r.id,true);
  if($("#hcDl")) $("#hcDl").onclick=async ()=>{
    try{ const saved=await api("compcert",{method:"POST",body:gather()});
      const nPh=(saved.photos||r.photos||[]).length;
      const wantReport=(!isDlp&&!isW)||nPh>0;
      const base=(saved.docNo||r.docNo||"certificate").replace(/[^A-Za-z0-9._-]+/g,"_");
      toast("Building certificate PDF…");
      const ch=await apiText("compcert/"+r.id+"/html");
      downloadPdfB64(base+".pdf", await htmlToPdfBase64(ch,{budget:1.4e6}));
      if(wantReport){ toast("Building completion report PDF"+(nPh?" ("+nPh+" photos)":"")+"…");
        try{ const rh=await apiText("compcert/"+r.id+"/report");
          downloadPdfB64(base+"_Completion_Report.pdf", await htmlToPdfBase64(rh,{budget:6e6}));
          toast("Downloaded — certificate + completion report");
        }catch(e){ toast("Certificate downloaded. Report PDF failed: "+e.message); } }
      else toast("Downloaded "+base+".pdf");
    }catch(e){ toast(e.message); } };
  if($("#hcDel")) $("#hcDel").onclick=async ()=>{ if(!confirm("Delete "+r.docNo+"? This cannot be undone."))return; try{ await api("compcert/"+r.id,{method:"DELETE"}); toast("Deleted"); vCompCerts(); }catch(e){ toast(e.message); } };
  if($("#hcSend")) $("#hcSend").onclick=async ()=>{ const to=($("#hc_partyEmail").value||"").trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ toast("Enter the party email first"); return; }
    const ccRaw=($("#hc_cc")?$("#hc_cc").value:"")||"";
    const ccList=ccRaw.split(/[,;\s]+/).filter(Boolean);
    const ccBad=ccList.filter(x=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
    if(ccBad.length){ toast("Check the CC addresses: "+ccBad.join(", ")); return; }
    const cc=ccList.filter(x=>x.toLowerCase()!==to.toLowerCase());
    try{ const saved=await api("compcert",{method:"POST",body:gather()}); // save latest edits first
      const nPh=(saved.photos||r.photos||[]).length;
      // The certificate and the completion report always travel together in ONE email.
      const wantReport=(!isDlp&&!isW)||nPh>0;
      if(!confirm(`Email to: ${to}${cc.length?`\nCC: ${cc.join(", ")}`:""}\n\n• ${isW?"Warranty certificate":isDlp?"DLP certificate":"Completion certificate"} ${saved.docNo||""} (PDF)${wantReport?`\n• Project Completion Report (PDF)${nPh?` — including ${nPh} site photo${nPh===1?"":"s"}`:""}`:""}\n\nBoth documents are attached to the same email. Send now?`)) return;
      const base=(saved.docNo||r.docNo||"certificate").replace(/[^A-Za-z0-9._-]+/g,"_");
      const pdfs=[];
      toast("Preparing certificate PDF…");
      try{ const html=await apiText("compcert/"+r.id+"/html"); pdfs.push({name:base+".pdf", base64:await htmlToPdfBase64(html,{budget:1.4e6})}); }
      catch(e){ if(!confirm("Could not build the certificate PDF ("+e.message+"). Send without it?")) return; }
      if(wantReport){ toast("Preparing completion report PDF"+(nPh?" ("+nPh+" photos)":"")+"… this can take a moment");
        try{ const rh=await apiText("compcert/"+r.id+"/report");
          const rb=await htmlToPdfBase64(rh,{budget:3.2e6});
          pdfs.push({name:base+"_Completion_Report.pdf", base64:rb});
        }catch(e){ if(!confirm("The completion report PDF could not be built ("+e.message+").\n\nSend the certificate on its own?\n\nCancel = stop, so you can reduce the number of photos and try again.")) return; } }
      const kb=Math.round(pdfs.reduce((a,p)=>a+p.base64.length,0)/1024*0.75);
      if(kb>4600){ toast("Attachments are "+ (kb/1024).toFixed(1) +" MB — too large to send. Remove a few photos and try again."); return; }
      toast("Sending "+pdfs.length+" PDF"+(pdfs.length===1?"":"s")+" ("+(kb>=1024?(kb/1024).toFixed(1)+" MB":kb+" KB")+")…");
      const res=await api("compcert/"+r.id+"/send",{method:"POST",body:{to,cc,pdfs}});
      toast("Sent to "+res.to+(cc.length?" (cc "+cc.length+")":"")+" — "+pdfs.length+" PDF"+(pdfs.length===1?"":"s")+" attached"); compCertForm(await api("compcert/"+r.id));
    }catch(e){ toast(e.message); } };
}
if(location.hash==="#marketing"){ VIEW="marketing"; MKT_TAB="connect"; history.replaceState(null,"",location.pathname); }
(async ()=>{ if(TOKEN){ try{ await load(); render(); return; }catch(e){} } renderLogin(); })();
</script>
</body>
</html>
