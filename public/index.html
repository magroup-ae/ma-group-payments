// Parse an MA Group LPO / Purchase Order PDF into rate-schedule line items
// (ref, description, unit, rate, contract qty). Columns are read by x-position.
async function parseLpoPdf(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const numRe=/^-?[\d,]+(\.\d+)?$/; let colQty=null,colRate=null; const items=[]; let cur=null;
  const isTotals=(t)=>/sub\s*total|^total|terms|notes|authoriz|signature|thank you|bank details|grand total/i.test(t);
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const byY={}; tc.items.forEach(it=>{ const x=it.transform[4], y=Math.round(it.transform[5]); const s=(it.str||"").trim(); if(!s)return; (byY[y]=byY[y]||[]).push({x,s}); });
    const ys=Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for(const y of ys){ const cells=byY[y].sort((a,b)=>a.x-b.x); const joined=cells.map(c=>c.s).join(" ");
      if(/\bQty\b/.test(joined)&&/\bRate\b/.test(joined)&&/\bAmount\b/.test(joined)){ cells.forEach(c=>{ if(c.s==="Qty")colQty=c.x; if(c.s==="Rate")colRate=c.x; }); continue; }
      const first=cells[0]; const isNumLead=first&&/^\d+$/.test(first.s);
      const nums=cells.filter(c=>numRe.test(c.s.replace(/,/g,"")));
      const qcut=(colQty!=null?colQty-20:400);
      if(isNumLead&&colRate!=null&&nums.length>=2){
        const descCells=cells.filter(c=>c.x>first.x+2&&c.x<qcut);
        const near=(cx)=>nums.reduce((b,c)=>Math.abs(c.x-cx)<Math.abs((b?b.x:1e9)-cx)?c:b,null);
        const rc=near(colRate), qc=colQty!=null?near(colQty):null;
        cur={ ref:first.s, description:descCells.map(c=>c.s).join(" ").trim(), rate:rc?parseFloat(rc.s.replace(/,/g,"")):0, qty:qc?parseFloat(qc.s.replace(/,/g,"")):1 };
        items.push(cur);
      } else if(cur){ const tc2=cells.filter(c=>c.x<qcut); const extra=tc2.map(c=>c.s).join(" ").trim();
        if(extra&&!isTotals(extra)) cur.description=(cur.description+" "+extra).trim(); }
    }
  }
  items.forEach((it,i)=>{ const m=it.description.match(/\(Per\s+([^)]+)\)/i); it.unit=m?m[1].trim():""; it.ref=String(i+1); });
  return items.filter(it=>it.description&&it.rate>0);
}

async function importAssetsExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xlsm,.xls";
  inp.onchange=async ()=>{ const f=inp.files[0]; if(!f) return;
    toast("Reading Excel…");
    try{ await loadScript("xlsx.full.min.js"); }catch(e){ toast("Could not load the Excel reader"); return; }
    let assets=[];
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      const name=wb.SheetNames.find(n=>n.toLowerCase().includes("register"))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:""});
      const toISO=v=>{ if(v instanceof Date) return v.toISOString().slice(0,10); const s=String(v||"").trim(); const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; const m2=s.match(/^\d{4}-\d{2}-\d{2}/); return m2?m2[0]:""; };
      for(const r of rows){ const code=String(r[1]||"").trim();
        if(!/^MAG-[A-Z]{2,3}-\d{3,5}$/.test(code)) continue;
        assets.push({ code, cat:String(r[2]||"").trim(), description:String(r[3]||"").trim(), model:String(r[4]||"").trim(),
          year:String(r[5]||"").trim(), serial:String(r[6]||"").trim(), location:String(r[7]||"").trim(),
          custodian:String(r[8]||"").trim(), owner:String(r[9]||"").trim(), purchaseDate:toISO(r[10]),
          condition:String(r[11]||"").trim(), cost:r[12], life:r[13] });
      }
    }catch(e){ toast("Could not read that file: "+e.message); return; }
    if(!assets.length){ toast("No asset rows found. The sheet needs a column of MAG-XXX-#### codes."); return; }
    if(!confirm(`Found ${assets.length} assets in the file.\n\nImport now? Codes already in the system are skipped (your edits are kept).`)) return;
    try{ const res=await api("assets/import",{method:"POST",body:{assets}}); toast(`Imported ${res.created} new · ${res.updated} updated · ${res.skipped} skipped`); vAssets(); }catch(e){ toast(e.message); }
  };
  inp.click();
}

    // Prefill advance + retention from the supplier record.
    if($("#aw_adv")) $("#aw_adv").value=(+s.advanceAmount||0);
    if($("#aw_advrec")) $("#aw_advrec").value=s.advanceRecoveryRate?Math.round(s.advanceRecoveryRate*1000)/10:0;
    if($("#aw_ret")) $("#aw_ret").value=(s.retentionPct!=null?Math.round(s.retentionPct*1000)/10:10);
    if($("#aw_dlp")) $("#aw_dlp").value=(s.dlpMonths?Math.round(s.dlpMonths*30.44):365);
    const miss=[]; if(!String(s.licenseNo||"").trim())miss.push("Trade Licence"); if(!String(s.trn||"").trim())miss.push("TRN"); if(!String(s.email||"").trim())miss.push("Email");
    box.style.display="";
    box.innerHTML=`<b>Auto-filled from supplier record:</b> ${esc(s.name)} · TL ${esc(s.licenseNo||"—")} · TRN ${esc(s.trn||"—")} · ${esc(s.email||"—")}${(+s.advanceAmount>0)?` · advance AED ${fmt(s.advanceAmount)} @ ${pct(s.advanceRecoveryRate||0)} recovery`:""}${miss.length?`<br><span style="color:var(--red)">⚠ missing on the supplier record: ${miss.join(", ")} — complete it in Suppliers so the document is not blank.</span>`:""}`;
  };
  $("#aw_sup").onchange=()=>{ if(!AW_EDIT) awSupInfo(); else awSupInfo(); };
  awSupInfo();
  // When the amount crosses the threshold, default the performance-security instrument
  // to a bank guarantee for agreements and an undated cheque for small LOAs.
  const defPerfType=()=>{ if(AW_EDIT) return; const amt=+$("#aw_amt").value||0; const sel=$("#aw_perftype"); if(sel) sel.value=(amt>=AWARD_THRESHOLD?"guarantee":"cheque"); };
  // UAE best practice: recover the advance pro-rata at the same % it was given, so
  // it clears exactly by completion. Auto-suggest that rate when recovery is left blank.
  const defAdvRec=()=>{ if(AW_EDIT) return; const adv=+$("#aw_adv").value||0, amt=+$("#aw_amt").value||0, cur=+$("#aw_advrec").value||0;
    if(adv>0 && amt>0 && !cur){ $("#aw_advrec").value = Math.round(adv/amt*1000)/10; } };
  const prevAmtIn=$("#aw_amt").oninput; $("#aw_amt").oninput=()=>{ if(prevAmtIn) prevAmtIn(); defPerfType(); defAdvRec(); };
  if($("#aw_adv")) $("#aw_adv").addEventListener("input",defAdvRec);
  // ----- amend mode: prefill the whole form from the record being edited -----
  if(AW_EDIT){ const r=AW_EDIT;
    const setv=(id,v)=>{ const el=$("#"+id); if(el!=null&&v!=null) el.value=v; };
    setv("aw_sup",r.supplierId); setv("aw_ent",r.entity); setv("aw_amt",r.amount); setv("aw_proj",r.project);
    setv("aw_loc",r.location); setv("aw_client",r.client); setv("aw_qref",r.quotationRef); setv("aw_qdate",(r.quotationDate||"").slice(0,10));
    setv("aw_stitle",r.scopeTitle); setv("aw_scope",r.scope); setv("aw_cdays",r.commenceDays); setv("aw_comp",(r.completion||"").slice(0,10));
    setv("aw_ret",r.retentionPct); setv("aw_dd",r.delayPctPerDay); setv("aw_dc",r.delayCapPct); setv("aw_retcap",r.retentionCapPct!=null?r.retentionCapPct:5);
    setv("aw_dlp",r.dlpDays); setv("aw_pay",r.paymentDays); setv("aw_hrs",r.signBackHours);
    setv("aw_perftype",r.perfSecurityType||"guarantee"); setv("aw_perf",r.performancePct!=null?r.performancePct:10);
    setv("aw_secdays",r.securityDeliveryDays!=null?r.securityDeliveryDays:7); setv("aw_perfval",r.perfValidity||"");
    setv("aw_bondtype",r.perfBondType||"none"); setv("aw_bondpct",r.performanceBondPct!=null?r.performanceBondPct:0);
    setv("aw_adv",r.advanceAmount||0); setv("aw_advrec",r.advanceRecoveryPct||0); setv("aw_advguar",r.advGuaranteeType||"guarantee");
    typeBadge();
    const btn=$("#aw_gen"); if(btn) btn.textContent="Save amendment";
    const bar=$("#aw_editbar"); if(bar){ bar.style.display=""; bar.innerHTML=`<b>Amending ${esc(r.docNo)}</b> (${r.type==="LOA"?"Letter of Award":"Subcontract Agreement"}, status: ${esc(r.status)}) — make your changes and click <b>Save amendment</b>. <a href="#" id="aw_cancel">Cancel</a>`;
      $("#aw_cancel").onclick=(e)=>{ e.preventDefault(); AW_EDIT=null; vAwards(); }; }
  }
  $("#aw_gen").onclick=async ()=>{
    const supplierId=$("#aw_sup").value, amount=+$("#aw_amt").value||0;
    if(!supplierId){ toast("Select a supplier / subcontractor"); return; }
    if(amount<=0){ toast("Enter the award / quotation amount"); return; }
    const body={ supplierId, amount, entity:$("#aw_ent").value, project:$("#aw_proj").value.trim(), location:$("#aw_loc").value.trim(), client:$("#aw_client").value.trim(),
      quotationRef:$("#aw_qref").value.trim(), quotationDate:$("#aw_qdate").value, scopeTitle:$("#aw_stitle").value.trim(), scope:$("#aw_scope").value.trim(),
      commenceDays:+$("#aw_cdays").value||7, completion:$("#aw_comp").value, retentionPct:+$("#aw_ret").value||10, delayPctPerDay:+$("#aw_dd").value||0.5, delayCapPct:+$("#aw_dc").value||10,
      retentionCapPct:+$("#aw_retcap").value||0, performancePct:+$("#aw_perf").value||10, perfSecurityType:$("#aw_perftype").value, perfValidity:$("#aw_perfval").value.trim(),
      securityDeliveryDays:+$("#aw_secdays").value||7, advGuaranteeType:$("#aw_advguar").value,
      perfBondType:$("#aw_bondtype").value, performanceBondPct:+$("#aw_bondpct").value||0,
      dlpDays:+$("#aw_dlp").value||365, paymentDays:+$("#aw_pay").value||30, signBackHours:+$("#aw_hrs").value||24,
      advanceAmount:+$("#aw_adv").value||0, advanceRecoveryPct:+$("#aw_advrec").value||0 };
    const editing=AW_EDIT;
    try{ toast(editing?"Saving…":"Generating…");
      const rec=await api(editing?("award/"+editing.id+"/update"):"award/generate",{method:"POST",body});
      toast(rec.docNo+(editing?" amended":" created")+" ("+(rec.type==="LOA"?"Letter of Award":"Subcontract Agreement")+")");
      AW_EDIT=null;
      const d=await api("award/list"); renderList(d.items); openAwardDoc(rec.id,false);
    }catch(e){ toast(e.message); }
  };
}

/* ---------- procurement (vendor directory + RFQ / inquiry) ---------- */
let PROC={vendors:[],trades:[]}, PROC_TAB="dir", PROC_SEL=new Set(), RFQS=[], RFQ_CUR=null, RFQ_DRAFT=null;
async function vProc(){
  if(!["CEO","PM","QS"].includes(ME.role)){ $("#main").innerHTML=`<div class="card muted">Procurement is available to commercial roles only.</div>`; return; }
  $("#main").innerHTML=`<div class="card"><div class="muted">Loading procurement…</div></div>`;
  try{ const [meta,pv,rq]=await Promise.all([api("procurement/meta"),api("pvendors"),api("rfqs")]);
    PROC.vendors=pv.items||[]; PROC.trades=pv.trades||[]; PROC.meta=meta; RFQS=rq.items||[];
  }catch(e){ $("#main").innerHTML=`<div class="card">${esc(e.message)}</div>`; return; }
  const sub=(k,l)=>`<button class="btn ${PROC_TAB===k?'gold':'ghost'}" onclick="PROC_TAB='${k}';RFQ_CUR=null;vProc()">${l}</button>`;
  const withEmailN=PROC.vendors.filter(v=>/@/.test(v.email||"")).length, regN=PROC.vendors.filter(v=>v.supplierId).length;
  $("#main").innerHTML=`<div class="card"><div class="flex"><h2 style="margin:0">Procurement</h2>
     <span class="muted">${PROC.vendors.length} vendors · ${regN} registered · ${withEmailN} with email · ${PROC.trades.length} trades</span>
     <div class="right flex" style="gap:6px">${sub("dir","Directory")}${sub("issue","Issue Inquiry")}${sub("rfqs","Inquiries ("+RFXcount()+")")}</div></div>
   </div><div id="proc_body"></div>`;
  if(PROC_TAB==="dir") procDir();
  else if(PROC_TAB==="issue") procIssue();
  else procRfqs();
}
function RFXcount(){ return RFQS.filter(r=>r.status!=="Awarded"&&r.status!=="Cancelled").length; }
function procVById(id){ return PROC.vendors.find(v=>v.id===id); }

function procDir(){
  const b=$("#proc_body");
  const trades=[...new Set(PROC.vendors.map(v=>v.trade))].sort();
  const emirates=[...new Set(PROC.vendors.map(v=>v.emirate).filter(Boolean))].sort();
  b.innerHTML=`<div class="card">
    <div class="flex" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <select id="pdTrade" style="max-width:230px"><option value="">All trades</option>${trades.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
      <select id="pdType"><option value="">All types</option><option>Supplier</option><option>Subcontractor</option><option>Both</option></select>
      <select id="pdEmail"><option value="">Email: any</option><option value="1">Has email</option><option value="0">No email</option></select>
      <select id="pdReg"><option value="">All vendors</option><option value="1">Registered suppliers</option><option value="0">Directory only</option></select>
      <input id="pdQ" placeholder="Search name / specialty / phone…" style="max-width:240px">
      <div class="right flex" style="gap:6px"><button class="btn ghost" id="pdAdd">+ Add vendor</button>
        <button class="btn gold" id="pdMakeRfq">Create inquiry from selected (<span id="pdSelN">0</span>)</button></div>
    </div>
    <div id="pdList" class="muted">…</div></div>`;
  const render=()=>{
    const tr=$("#pdTrade").value, ty=$("#pdType").value, em=$("#pdEmail").value, rg=$("#pdReg").value, q=($("#pdQ").value||"").toLowerCase();
    let list=PROC.vendors.filter(v=>(!tr||v.trade===tr)&&(!ty||v.type===ty||(ty!=="Both"&&v.type==="Both"))
      &&(em===""||(em==="1"?/@/.test(v.email||""):!/@/.test(v.email||"")))
      &&(rg===""||(rg==="1"?!!v.supplierId:!v.supplierId))
      &&(!q||((v.name+" "+v.specialty+" "+v.phone+" "+v.whatsapp+" "+v.emirate+" "+v.contactName).toLowerCase().includes(q))));
    $("#pdList").classList.remove("muted");
    $("#pdList").innerHTML=`<div class="muted" style="margin-bottom:6px">${list.length} of ${PROC.vendors.length}</div>
      <div style="overflow-x:auto"><table><tr><th></th><th>Vendor</th><th>Trade</th><th>Specialty</th><th>Contact</th><th>Phone</th><th>Email</th><th>Emirate</th><th>Type</th><th></th></tr>
      ${list.map(v=>`<tr class="click" data-v="${esc(v.id)}"><td><input type="checkbox" class="pdChk" data-id="${esc(v.id)}" ${PROC_SEL.has(v.id)?"checked":""} onclick="event.stopPropagation()"></td>
        <td><b>${esc(v.name)}</b>${v.supplierId?` <span class="pill" style="background:#375623;font-size:9px">registered</span>`:""}</td>
        <td>${esc(v.trade)}</td><td class="muted" style="max-width:220px">${esc(v.specialty||"—")}</td>
        <td>${esc(v.contactName||"—")}</td><td>${esc(v.phone||v.whatsapp||"—")}</td>
        <td>${/@/.test(v.email||"")?esc(v.email):`<span style="color:var(--red)">✗ none</span>`}</td>
        <td>${esc(v.emirate||"—")}</td><td>${esc(v.type)}</td>
        <td><a href="#" data-del="${esc(v.id)}" title="delete">✕</a></td></tr>`).join("")}</table></div>`;
    $("#pdList").querySelectorAll("[data-v]").forEach(r=>r.onclick=e=>{ if(e.target.dataset.del||e.target.classList.contains("pdChk"))return; procVendorForm(procVById(r.dataset.v)); });
    $("#pdList").querySelectorAll(".pdChk").forEach(c=>c.onchange=()=>{ if(c.checked)PROC_SEL.add(c.dataset.id); else PROC_SEL.delete(c.dataset.id); $("#pdSelN").textContent=PROC_SEL.size; });
    $("#pdList").querySelectorAll("[data-del]").forEach(a=>a.onclick=async e=>{ e.preventDefault();e.stopPropagation(); if(ME.role!=="CEO"){toast("Only the CEO can delete a vendor");return;} const v=procVById(a.dataset.del); if(!confirm("Delete vendor "+(v?v.name:"")+"?"))return; try{ await api("pvendor/"+a.dataset.del,{method:"DELETE"}); PROC.vendors=PROC.vendors.filter(x=>x.id!==a.dataset.del); render(); }catch(x){toast(x.message);} });
    $("#pdSelN").textContent=PROC_SEL.size;
  };
  ["pdTrade","pdType","pdEmail","pdReg","pdQ"].forEach(id=>$("#"+id).addEventListener("input",render));
  $("#pdAdd").onclick=()=>procVendorForm(null);
  $("#pdMakeRfq").onclick=()=>{ if(!PROC_SEL.size){toast("Tick the vendors first, or use Issue Inquiry and pick a trade");return;} RFQ_DRAFT={vendorIds:[...PROC_SEL], trade:(procVById([...PROC_SEL][0])||{}).trade||""}; PROC_TAB="issue"; vProc(); };
  render();
}
function procVendorForm(v){
  const isNew=!v; v=v||{type:"Supplier",status:"Active",trade:"General Trading / Materials"};
  const b=$("#proc_body");
  const tradeOpts=PROC.trades.map(t=>`<option ${t===v.trade?"selected":""}>${esc(t)}</option>`).join("");
  b.innerHTML=`<div class="card"><h3 style="margin-top:0">${isNew?"Add vendor":"Edit vendor"}</h3>
    <div class="grid">
      <div style="grid-column:1/-1"><label>Company name *</label><input id="pv_name" value="${esc(v.name||"")}"></div>
      <div><label>Trade / category</label><select id="pv_trade">${tradeOpts}</select></div>
      <div><label>Type</label><select id="pv_type"><option ${v.type==="Supplier"?"selected":""}>Supplier</option><option ${v.type==="Subcontractor"?"selected":""}>Subcontractor</option><option ${v.type==="Both"?"selected":""}>Both</option></select></div>
      <div style="grid-column:1/-1"><label>Specialty / trade detail</label><input id="pv_specialty" value="${esc(v.specialty||"")}"></div>

      <div><label>Phone</label><input id="pv_phone" value="${esc(v.phone||"")}"></div>
      <div><label>WhatsApp</label><input id="pv_whatsapp" value="${esc(v.whatsapp||"")}"></div>
      <div><label>Email</label><input id="pv_email" value="${esc(v.email||"")}"></div>
      <div><label>Website</label><input id="pv_website" value="${esc(v.website||"")}"></div>
      <div><label>Emirate / area</label><input id="pv_emirate" value="${esc(v.emirate||"")}"></div>
      <div><label>Status</label><select id="pv_status"><option ${v.status==="Active"?"selected":""}>Active</option><option ${v.status==="On Hold"?"selected":""}>On Hold</option><option ${v.status==="Blacklisted"?"selected":""}>Blacklisted</option></select></div>
      <div style="grid-column:1/-1"><label>Notes</label><input id="pv_notes" value="${esc(v.notes||"")}"></div>

  $("#pv_back").onclick=()=>procDir();
  $("#pv_save").onclick=async()=>{ const g=k=>$("#pv_"+k).value; const body={name:g("name").trim(),trade:g("trade"),type:g("type"),specialty:g("specialty"),contactName:g("contactName"),phone:g("phone"),whatsapp:g("whatsapp"),email:g("email").trim(),website:g("website"),emirate:g("emirate"),status:g("status"),notes:g("notes")};
    if(!body.name){toast("Vendor name is required");return;} if(!isNew)body.id=v.id;
    try{ const saved=await api("pvendor",{method:"POST",body}); const i=PROC.vendors.findIndex(x=>x.id===saved.id); if(i>=0)PROC.vendors[i]=saved; else PROC.vendors.push(saved); toast("Saved"); procDir(); }catch(e){toast(e.message);} };
}
let IW=null; // issue working RFQ
async function procIssue(){
  const b=$("#proc_body");
  if(!IW){
    if(RFQ_CUR){ IW=JSON.parse(JSON.stringify(RFQ_CUR)); }
    else { IW={id:"",project:"",location:"",trade:(RFQ_DRAFT&&RFQ_DRAFT.trade)||"",scopeTitle:"",scope:"",requirements:"",dueDate:"",entity:(S.entities[0]||{}).short||"",deliveryTerms:"",siteVisit:"",notes:"",vendorIds:(RFQ_DRAFT&&RFQ_DRAFT.vendorIds)||[],files:[]}; }
    RFQ_DRAFT=null;
  }
  const entOpts=(S.entities||[]).map(e=>`<option value="${esc(e.short)}" ${e.short===IW.entity?"selected":""}>${esc(e.short)}</option>`).join("");
  const projOpts=(S.projects||[]).map(p=>`<option value="${esc(p.name)}">`).join("");
  const tradeOpts=`<option value="">— all trades —</option>`+PROC.trades.map(t=>`<option ${t===IW.trade?"selected":""}>${esc(t)}</option>`).join("");
  b.innerHTML=`<div class="card">
    <div class="flex"><h3 style="margin:0">${IW.id?("Inquiry "+esc(IW.rfqNo||"")):"New inquiry (RFQ)"}</h3>
      <span class="right muted">Draft saves first, then attach files &amp; send</span></div>
    <datalist id="projDL2">${projOpts}</datalist>
    <div class="grid" style="margin-top:10px">
      <div><label>Project</label><input id="iw_project" list="projDL2" value="${esc(IW.project||"")}"></div>
      <div><label>Location / Emirate</label><input id="iw_location" value="${esc(IW.location||"")}"></div>
      <div><label>Trade / package</label><select id="iw_trade">${tradeOpts}</select></div>
      <div><label>Paying entity</label><select id="iw_entity">${entOpts}</select></div>
      <div style="grid-column:1/-1"><label>Scope title (short)</label><input id="iw_scopeTitle" value="${esc(IW.scopeTitle||"")}" placeholder="e.g. Supply & installation of porcelain tiles"></div>
      <div style="grid-column:1/-1"><label>Scope of works / supply (one line per item)</label><textarea id="iw_scope" rows="4" style="width:100%;font-family:inherit">${esc(IW.scope||"")}</textarea></div>
      <div style="grid-column:1/-1"><label>Technical requirements / specifications (optional, one line per item)</label><textarea id="iw_requirements" rows="3" style="width:100%;font-family:inherit">${esc(IW.requirements||"")}</textarea></div>
      <div><label>Reply by (submission deadline)</label><input id="iw_dueDate" type="date" value="${esc((IW.dueDate||'').slice(0,10))}"></div>
      <div><label>Delivery / site terms</label><input id="iw_deliveryTerms" value="${esc(IW.deliveryTerms||"")}"></div>
      <div style="grid-column:1/-1"><label>Site visit / notes to vendor</label><input id="iw_notes" value="${esc(IW.notes||"")}"></div>
    </div>
    <h4 style="margin:14px 0 4px">Attachments — BOQ, drawings, specifications</h4>
    <div class="note" style="font-size:11px">Up to 7 MB per file (≈22 MB total). For very large drawing sets, put a shared cloud link in the scope. Files are emailed to each selected vendor.</div>
    <div id="iw_files" style="margin:8px 0"></div>
    <div><input type="file" id="iw_file" multiple></div>
    <h4 style="margin:16px 0 4px">Select vendors <span class="muted" style="font-weight:400;font-size:11px">— filtered by the trade above; vendors without email go to a call list</span></h4>
    <div class="flex" style="gap:8px;margin-bottom:6px"><button class="btn ghost" id="iw_all">Select all with email</button><button class="btn ghost" id="iw_none">Clear</button><span class="muted" id="iw_selinfo"></span></div>
    <div id="iw_vendors" style="max-height:280px;overflow:auto;border:1px solid #e3e7ee;border-radius:8px;padding:6px"></div>
    <div style="height:12px"></div>
    <div class="flex" style="gap:8px"><button class="btn green" id="iw_save">Save draft</button>
      <button class="btn ghost" id="iw_preview">Preview</button>
      <button class="btn gold" id="iw_send">Send inquiry →</button>
      <button class="btn ghost" id="iw_back">Back to list</button></div>
    <div id="iw_sendinfo" style="margin-top:8px"></div>
  </div>`;
  const collect=()=>{ IW.project=$("#iw_project").value.trim(); IW.location=$("#iw_location").value.trim(); IW.trade=$("#iw_trade").value; IW.entity=$("#iw_entity").value;

  const renderVendors=()=>{ const tr=$("#iw_trade").value; const list=PROC.vendors.filter(v=>(!tr||v.trade===tr)&&v.status==="Active");

    $("#iw_vendors").innerHTML=list.length?list.map(v=>`<label style="display:flex;align-items:center;gap:8px;padding:3px 4px;border-bottom:1px solid #f0f2f6">
      <input type="checkbox" class="ivChk" data-id="${esc(v.id)}" ${sel.has(v.id)?"checked":""}>
      <span style="flex:1"><b>${esc(v.name)}</b> <span class="muted">· ${esc(v.emirate||"")}</span></span>
      <span>${/@/.test(v.email||"")?`<span class="muted">${esc(v.email)}</span>`:`<span style="color:var(--red)">no email → ${esc(v.phone||v.whatsapp||"call")}</span>`}</span></label>`).join(""):`<div class="muted">No active vendors for this trade. Pick a different trade or add vendors in the Directory.</div>`;
    $("#iw_vendors").querySelectorAll(".ivChk").forEach(c=>c.onchange=()=>{ const s=new Set(IW.vendorIds||[]); if(c.checked)s.add(c.dataset.id); else s.delete(c.dataset.id); IW.vendorIds=[...s]; selInfo(); });
    selInfo();
  };
  const selInfo=()=>{ const sel=(IW.vendorIds||[]); const withE=sel.filter(id=>{const v=procVById(id);return v&&/@/.test(v.email||"");}).length;
    $("#iw_selinfo").textContent=`${sel.length} selected · ${withE} will be emailed · ${sel.length-withE} on call list`; };
  const renderFiles=()=>{ const fs=IW.files||[]; $("#iw_files").innerHTML=fs.length?fs.map(f=>`<span class="pill" style="background:#eef2f8;color:#1f3864;margin:2px 4px 2px 0">📎 ${esc(f.name)} <a href="#" data-fx="${f.idx}" style="color:var(--red)">✕</a></span>`).join(""):`<span class="muted">No files attached yet.</span>`;
    $("#iw_files").querySelectorAll("[data-fx]").forEach(a=>a.onclick=async e=>{ e.preventDefault(); if(!IW.id)return; try{ const r=await api("rfq/"+IW.id+"/file/"+a.dataset.fx,{method:"DELETE"}); IW.files=r.files; renderFiles(); }catch(x){toast(x.message);} }); };
  const ensureSaved=async()=>{ collect(); if(!IW.scopeTitle&&!IW.scope){toast("Add a scope title or scope first");return null;} const body={...IW}; delete body.files; delete body.quotes; const saved=await api("rfq",{method:"POST",body}); IW.id=saved.id; IW.rfqNo=saved.rfqNo; IW.status=saved.status; if(saved.files)IW.files=saved.files; return saved; };
  $("#iw_trade").onchange=renderVendors;
  $("#iw_all").onclick=()=>{ const tr=$("#iw_trade").value; const s=new Set(IW.vendorIds||[]); PROC.vendors.filter(v=>(!tr||v.trade===tr)&&v.status==="Active"&&/@/.test(v.email||"")).forEach(v=>s.add(v.id)); IW.vendorIds=[...s]; renderVendors(); };
  $("#iw_none").onclick=()=>{ IW.vendorIds=[]; renderVendors(); };

async function openRfqFile(rfqId,idx,name){ try{ const res=await fetch("/api/rfqfile/"+rfqId+"/"+idx,{headers:TOKEN?{authorization:"Bearer "+TOKEN}:{}}); if(!res.ok)throw new Error("Download failed"); const blob=await res.blob(); const url=URL.createObjectURL(blob); const w=window.open(url,"_blank"); if(!w){const a=document.createElement("a");a.href=url;a.download=name||"file";a.click();} setTimeout(()=>URL.revokeObjectURL(url),60000); }catch(e){toast(e.message);} }

function rfqWaText(r){ return `MA Group — Request for Quotation ${r.rfqNo}\n`

  +`Please also reply with your EMAIL address so we can send you the full RFQ with the BOQ & drawings.\n`
  +`— MA Group Procurement · +971 80062244`; }
function waLink(v,r){ const num=waNorm(v.whatsapp||v.phone); if(!num)return ""; return `https://wa.me/${num}?text=${encodeURIComponent(rfqWaText(r))}`; }

function wireWa(container,r){

    $("#nbAdd").onclick=async ()=>{ const b=$("#nbName").value.trim(); if(!b) return; S.banks.push(b); await saveS(); };
    if($("#polReg")) api("policy/register").then(r=>{ const b=$("#polReg"); if(!b) return;

    document.querySelectorAll("[data-reset]").forEach(a=>a.onclick=async e=>{ e.preventDefault(); const pin=prompt("New PIN (4-8 digits):"); if(!pin) return; const u=USERS.find(x=>x.id===a.dataset.reset);

async function bindEmail(){

    ? `<span style="color:#2e7d32">● Sending is ON via ${prov==="smtp"?"Zoho Mail":"ZeptoMail"}${(prov==="smtp"?cfg.smtpPassFromEnv:cfg.tokenFromEnv)?" (set via environment)":""}</span>`

     <div><label>From name</label><input id="em_fromName" value="${esc(cfg.fromName||"")}"></div>
     <div><label>From address</label><input id="em_from" value="${esc(cfg.from||"")}"></div>
     <div><label>Reply-to</label><input id="em_replyTo" value="${esc(cfg.replyTo||"")}"></div>
     <div><label>Internal CC (optional)</label><input id="em_cc" value="${esc(cfg.cc||"")}" placeholder="accounts@maagroup.ae"></div>
     <div><label>Internal BCC (optional)</label><input id="em_bcc" value="${esc(cfg.bcc||"")}"></div>
   </div>
   <div id="em_smtpBlock" style="margin-top:10px">
     <div class="note" style="margin-bottom:8px">Sends through your Zoho mailbox over SMTP. Use the account <b>info@maagroup.ae</b> and a <b>Zoho app-specific password</b> (Zoho Mail → Settings → Security → App Passwords) — not your normal login password.</div>
     <div class="grid">

     </div>
   </div>
   <div id="em_zeptoBlock" style="margin-top:10px">
     <div style="grid-column:1/-1"><label>ZeptoMail send token ${cfg.tokenFromEnv?"(set via environment)":cfg.tokenSet?"(saved — leave blank to keep)":""}</label><input id="em_token" type="password" style="width:100%" placeholder="${cfg.tokenSet?"•••••••• (unchanged)":"Zoho-enczapikey token"}"></div>
   </div>

   <div style="columns:2;-webkit-columns:2;font-size:13px">${togRows}</div>
   <div style="height:12px"></div>

  const syncProv=()=>{ const p=$("#em_provider").value;

  async function loadLog(){ const el=$("#em_log"); if(!el) return; try{ const d=await api("emaillog");

  loadLog();
}

function chequeLayoutCard(){
  const ch=S.cheque, f=ch.fields;
  const fr=(k)=>`<tr><td>${esc(f[k].label)}</td><td class="num">${f[k].x}</td><td class="num">${f[k].y}</td></tr>`;
  return `<div class="card"><h2>Cheque Layout</h2>
   <div class="note"><b>The cheque layout is frozen</b> — the line positions below are locked and cannot be edited. The only adjustment is the <b>global X &amp; Y offset</b>, which moves <b>all lines together as one block</b> (spacing between lines never changes). If the print lands too low, use a <b>negative Y</b> (− = up); too far right, use a <b>negative X</b> (− = left).
   <br>Print the test choosing <b>Paper = A4</b>, <b>Orientation = Landscape</b>, <b>Scale = 100% / Actual size</b> (never "Fit"), <b>Margins = None</b>. <b>If a printer prints the cheque as 2 pages</b> it is set to Portrait — switch that printer to <b>Landscape</b>.</div>

     <div><label>Global offset X → right (mm, − = left)</label><input id="ch_ox" type="number" step="0.5" value="${ch.offsetXmm}"></div>

   </div>
   <h3>Line positions (frozen — reference only)</h3>
   <table><tr><th>Field</th><th class="num">X (mm)</th><th class="num">Y (mm)</th></tr>${["date","payee","words1","words2","figures"].map(fr).join("")}</table>
   <div class="muted" style="font-size:11px;margin-top:4px">Page: ${ch.widthMm}×${ch.heightMm} mm (A4 landscape) · Font ${ch.fontPt} pt · Words wrap ${ch.wordsWrapMm||120} mm — all locked.</div>
   <div style="height:12px"></div><div class="flex"><button class="btn green" id="ch_save">Save adjustment</button><button class="btn ghost" id="ch_test">Print test cheque</button></div></div>`;
}
function bindChequeLayout(saveS){
  const btn=$("#ch_save"); if(!btn) return;
  // Only the global X/Y offset is adjustable — line positions, page size, font and
  // wrap are frozen and never touched by save.
  const pull=()=>{ const ch=S.cheque;
    ch.offsetXmm=+$("#ch_ox").value||0; ch.offsetYmm=+$("#ch_oy").value||0; };
  btn.onclick=async ()=>{ pull(); await saveS(); };
  $("#ch_test").onclick=()=>{ pull();
    printCheque({ no:"TEST", payment:{ payee:"TEST PAYEE — ALIGNMENT CHECK LINE", amount:3047.10, date:new Date().toISOString().slice(0,10) } }); };
}

async function openCompCertDoc(id,doPrintIt){
  try{ const html=await apiText("compcert/"+id+"/html"); const w=window.open("","_blank");

}

      renderPhotos(); toast("Photos uploaded"); }; }
  if($("#hcReport")) $("#hcReport").onclick=async ()=>{ try{ const html=await apiText("compcert/"+r.id+"/report"); const w=window.open("","_blank"); if(!w){ toast("Allow pop-ups to view the report"); return; } w.document.open(); w.document.write(html); w.document.close(); setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },500); }catch(e){ toast(e.message); } };
  if($("#hcSave")) $("#hcSave").onclick=async ()=>{ try{ const saved=await api("compcert",{method:"POST",body:gather()}); toast(saved.docNo+" saved"+(saved.status==="Draft"?" as draft":"")); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcSubmit")) $("#hcSubmit").onclick=async ()=>{ if(!confirm("Submit "+(r.docNo||"this certificate")+" and mark it as ISSUED? It becomes part of the official register."))return;
    try{ const saved=await api("compcert",{method:"POST",body:{...gather(),status:"Issued"}}); toast(saved.docNo+" issued"); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcReopen")) $("#hcReopen").onclick=async ()=>{ if(!confirm("Reopen "+(r.docNo||"this certificate")+" to Draft for editing?"))return;
    try{ const saved=await api("compcert",{method:"POST",body:{...gather(),status:"Draft"}}); toast(saved.docNo+" reopened to draft"); compCertForm(saved); }catch(e){ toast(e.message); } };
  if($("#hcPrint")) $("#hcPrint").onclick=()=>openCompCertDoc(r.id,true);
  if($("#hcDel")) $("#hcDel").onclick=async ()=>{ if(!confirm("Delete "+r.docNo+"? This cannot be undone."))return; try{ await api("compcert/"+r.id,{method:"DELETE"}); toast("Deleted"); vCompCerts(); }catch(e){ toast(e.message); } };
  if($("#hcSend")) $("#hcSend").onclick=async ()=>{ const to=($("#hc_partyEmail").value||"").trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ toast("Enter the party email first"); return; }
    if(!confirm(`Email this ${isW?"warranty certificate":isDlp?"DLP certificate":"completion certificate"} (with PDF attached) to ${to}?`)) return;
    try{ await api("compcert",{method:"POST",body:gather()}); // save latest edits first
      const base=(r.docNo||"certificate").replace(/[^A-Za-z0-9._-]+/g,"_");
      const pdfs=[];
      toast("Preparing certificate PDF…");
      try{ const html=await apiText("compcert/"+r.id+"/html"); pdfs.push({name:base+".pdf", base64:await htmlToPdfBase64(html)}); }
      catch(e){ if(!confirm("Could not build the certificate PDF ("+e.message+"). Send without it?")) return; }
      // Attach the Project Completion Report too (always for completion certs, and
      // whenever photos are attached on the other types).
      const wantReport=(!isDlp&&!isW)||((r.photos||[]).length>0);
      if(wantReport){ toast("Preparing report PDF…");
        try{ const rh=await apiText("compcert/"+r.id+"/report"); pdfs.push({name:base+"_Completion_Report.pdf", base64:await htmlToPdfBase64(rh)}); }
        catch(e){ toast("Report PDF skipped: "+e.message); } }
      toast("Sending…"); const res=await api("compcert/"+r.id+"/send",{method:"POST",body:{to,pdfs}});
      toast("Sent to "+res.to+(res.attached?" ("+pdfs.length+" PDF"+(pdfs.length===1?"":"s")+" attached)":"")); compCertForm(await api("compcert/"+r.id));
    }catch(e){ toast(e.message); } };
}
(async ()=>{ if(TOKEN){ try{ await load(); render(); return; }catch(e){} } renderLogin(); })();
</script>
</body>
